[project]
name = "opendde-workbench"
version = "0.3.0rc1"
description = "Bilingual research workbench for OpenDDE and Harness"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Victor Xu"}]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]

[project.scripts]
opendde-workbench = "opendde_workbench.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendde_workbench"]

[tool.hatch.build.hooks.custom]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
