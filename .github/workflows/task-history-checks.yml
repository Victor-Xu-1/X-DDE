name: Modular task history and result navigation checks
on:
  workflow_dispatch:
  push:
    paths: &history_paths
      - "src/opendde_workbench/task_history/**"
      - "src/opendde_workbench/examples/library.py"
      - "tests/test_example_library.py"
      - "frontend/src/studio/TaskWorkspace*"
      - "frontend/src/studio/TaskHistory*"
      - "frontend/src/studio/ModuleWorkspaceNavigation*"
      - "frontend/src/studio/useTaskHistory*"
      - "frontend/src/studio/task-history*"
      - "frontend/src/studio/task-kind-rules.ts"
      - "frontend/src/examples/useTaskLabel*"
      - "frontend/src/App.tsx"
      - "frontend/src/App.test.tsx"
      - "frontend/src/useWorkbench*"
      - "tests/test_task_history.py"
      - "tests/test_example_source_titles.py"
      - "tests/test_task_identity.py"
      - "server_tests/*task_history*"
      - ".github/workflows/task-history-checks.yml"
  pull_request:
    paths: *history_paths
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WB_AUTO_DEPLOY: "0"
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Task modules, filters, history races and direct application consumer
        working-directory: frontend
        run: >-
          npx vitest run src/studio/TaskWorkspace.test.tsx
          src/studio/ModuleWorkspaceNavigation.test.tsx
          src/studio/task-history-model.test.ts src/studio/useTaskHistory.test.tsx
          src/studio/research-modules.test.ts src/App.test.tsx
          src/studio/task-history-route.test.ts src/useWorkbench.test.ts
          src/examples/useTaskLabel.test.tsx src/studio/TaskHistoryList.test.tsx
          src/TaskDetail.test.tsx src/TaskDetail.actions.test.tsx
          src/studio/PredictionResults.test.tsx
          src/operations/result-source-labels.test.ts src/operations/ResultTaskSelect.test.tsx
      - name: Query, request identity, stable pagination and personal/example boundaries
        run: |
          uv run --locked ruff check src/opendde_workbench/task_history tests/test_task_history.py tests/test_example_source_titles.py tests/test_task_identity.py server_tests/prepare_task_history.py server_tests/test_task_history_browser.py
          uv run --locked python scripts/generate-capability-catalog.py --check
          uv run --locked pytest -q tests/test_task_history.py tests/test_example_library.py tests/test_example_source_titles.py tests/test_task_identity.py
      - name: Restore existing native outputs into isolated CI history; no scientific runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-task-history" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-task-history/state" >> "$GITHUB_ENV"
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
          uv run --locked playwright install chromium --with-deps
      - name: Bilingual desktop/mobile grouping, filters, page restoration, links and native result
        run: |
          .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          .venv/bin/python server_tests/prepare_task_history.py
          mkdir -p server_tests/evidence/task-history
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/task-history/service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" >/dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" >/dev/null
          .venv/bin/python -m pytest -x -q server_tests/test_task_history_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-history-native-evidence
          path: server_tests/evidence/task-history
          if-no-files-found: warn
