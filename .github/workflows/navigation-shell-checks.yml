name: Research navigation and header checks
on:
  workflow_dispatch:
  push:
    paths: &navigation_paths
      - "frontend/src/studio/Navigation*"
      - "frontend/src/studio/ModuleWorkspaceNavigation*"
      - "frontend/src/studio/navigation-frame.css"
      - "frontend/src/studio/Header*"
      - "frontend/src/studio/header.css"
      - "frontend/src/studio/TaskSearch*"
      - "frontend/src/studio/TaskNotifications*"
      - "frontend/src/studio/ModuleTaskPicker*"
      - "frontend/src/studio/MethodSwitch*"
      - "frontend/src/studio.css"
      - "frontend/src/design/workspaces.css"
      - "frontend/src/tokens.css"
      - "frontend/index.html"
      - "frontend/src/theme.test.ts"
      - "frontend/src/design/layout.css"
      - "frontend/src/design/controls.css"
      - "frontend/src/design/module-surfaces.css"
      - "server_tests/test_navigation_shell_browser.py"
      - "server_tests/prepare_shell_history.py"
      - ".github/workflows/navigation-shell-checks.yml"
  pull_request:
    paths: *navigation_paths
permissions:
  contents: read
jobs:
  utility-scope:
    uses: ./.github/workflows/molecular-utility-checks.yml
    with:
      scope_only: true
  appearance-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      appearance_only: ${{ steps.select.outputs.appearance_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/appearance-scope.py
  research-shell:
    needs: [appearance-scope, utility-scope]
    if: >-
      needs.appearance-scope.outputs.appearance_only != 'true' &&
      (needs.utility-scope.outputs.utility_only != 'true' ||
      needs.utility-scope.outputs.mobile_header_only == 'true' ||
      needs.utility-scope.outputs.desktop_header_only == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WB_AUTO_DEPLOY: "0"
      WB_BROWSER_URL: http://127.0.0.1:4330
      DESKTOP_HEADER_ONLY: ${{ needs.utility-scope.outputs.desktop_header_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Navigation, header and direct application consumers
        if: env.DESKTOP_HEADER_ONLY != 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/studio/Navigation.test.tsx
          src/studio/ModuleWorkspaceNavigation.test.tsx
          src/studio/NavigationFrame.test.tsx src/studio/Header.test.tsx
          src/utilities/BackendControls.test.tsx
          src/studio/MethodSwitch.test.tsx src/studio/BindingEntryDialog.test.tsx
          src/studio/research-modules.test.ts src/studio/InterfaceSettings.test.tsx
          src/App.test.tsx src/studio/TaskWorkspace.test.tsx
          src/theme.test.ts src/guided/Questionnaire.test.tsx
      - name: Desktop search, task navigation and backend controls
        if: env.DESKTOP_HEADER_ONLY == 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/studio/Header.test.tsx
          src/studio/ModuleWorkspaceNavigation.test.tsx src/utilities/BackendControls.test.tsx
      - name: Restore reviewed public state without inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export WB_HOME="$RUNNER_TEMP/x-dde-research-shell"
          export WB_STATE_DIR="$WB_HOME/state"
          echo "WB_HOME=$WB_HOME" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$WB_STATE_DIR" >> "$GITHUB_ENV"
          uv sync --locked --group dev --group browser
          if [ "$DESKTOP_HEADER_ONLY" = true ]; then
            readarray -t source < <(.venv/bin/python -c 'from opendde_workbench.examples.stat6_bundle_release import URL; print("\n".join(URL.rsplit("/", 2)[-2:]))')
            test "${#source[@]}" -eq 2
            [[ "${source[0]}" =~ ^examples-v[0-9]+$ ]]
            [[ "${source[1]}" =~ ^stat6-reviewed-results-v[0-9]+\.zip$ ]]
            gh release download "${source[0]}" --repo "$GITHUB_REPOSITORY" --pattern "${source[1]}" --dir "$RUNNER_TEMP"
            .venv/bin/python server_tests/prepare_reviewed_stat6_cases.py "$RUNNER_TEMP/${source[1]}"
          else
            gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
            .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          fi
      - name: Verify the approved header-only CI scope
        if: needs.utility-scope.outputs.mobile_header_only == 'true' || env.DESKTOP_HEADER_ONLY == 'true'
        run: |
          uv run --locked ruff check scripts/molecular-utility-scope.py tests/test_molecular_utility_scope.py
          uv run --locked pytest -q tests/test_molecular_utility_scope.py
      - name: Real page navigation, modal focus and task search in Chromium
        run: |
          profile=archive
          if [ "$DESKTOP_HEADER_ONLY" = true ]; then profile=current; fi
          .venv/bin/python server_tests/prepare_shell_history.py --profile "$profile"
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/navigation-shell
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/navigation-shell/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null
          args=()
          if [ "$DESKTOP_HEADER_ONLY" = true ]; then args+=(-k desktop_header); fi
          .venv/bin/python -m pytest -q server_tests/test_navigation_shell_browser.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-navigation-shell-evidence
          path: server_tests/evidence/navigation-shell
          if-no-files-found: warn
