name: Optional 3D template instruction checks
on:
  pull_request:
    paths: &guidance_paths
      - "frontend/src/guided/Questionnaire.tsx"
      - "frontend/src/guided/QuestionnaireGuidance.test.tsx"
      - "frontend/src/integrations/ScientificForm.tsx"
      - "frontend/src/simulations/SimulationForm.tsx"
      - ".github/workflows/restraint-guidance-checks.yml"
      - "scripts/restraint-guidance-scope.py"
      - "tests/test_restraint_guidance_scope.py"
      - ".github/workflows/task-layout-checks.yml"
      - ".github/workflows/user-interface-checks.yml"
      - ".github/workflows/structure-layout-checks.yml"
  push:
    branches: [main]
    paths: *guidance_paths
  workflow_dispatch:
  workflow_call:
    inputs:
      scope_only:
        type: boolean
        default: false
    outputs:
      guidance_only:
        value: ${{ jobs.scope.outputs.guidance_only }}
      file_navigation_only:
        value: ${{ jobs.workspace-scope.outputs.file_navigation_only }}
permissions:
  contents: read
jobs:
  workspace-scope:
    uses: ./.github/workflows/workspace-preview-checks.yml
    with:
      scope_only: true
  utility-scope:
    uses: ./.github/workflows/molecular-utility-checks.yml
    with:
      scope_only: true
  scope:
    runs-on: ubuntu-24.04
    outputs:
      guidance_only: ${{ steps.select.outputs.guidance_only }}
      interaction_only: ${{ steps.interaction.outputs.interaction_only }}
      admet_result_only: ${{ steps.admet.outputs.admet_result_only }}
      target_evidence_only: ${{ steps.target.outputs.target_evidence_only }}
      receptor_workspace_only: ${{ steps.receptors.outputs.receptor_workspace_only }}
      prepared_inputs_only: ${{ steps.preparation.outputs.prepared_inputs_only }}
      project_only: ${{ steps.project.outputs.project_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/restraint-guidance-scope.py
      - id: interaction
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/interaction-workspace-scope.py
      - id: admet
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/admet-workspace-scope.py
      - id: target
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/target-evidence-scope.py
      - id: receptors
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/receptor-workspace-scope.py
      - id: preparation
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/prepared-input-scope.py
      - id: project
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/project-workspace-scope.py
  frontend-guidance:
    needs: [scope, utility-scope, workspace-scope]
    if: needs.scope.outputs.project_only != 'true' && needs.workspace-scope.outputs.file_navigation_only != 'true' && needs.utility-scope.outputs.utility_only != 'true' && (!inputs.scope_only && needs.scope.outputs.prepared_inputs_only != 'true' && needs.scope.outputs.receptor_workspace_only != 'true' && needs.scope.outputs.interaction_only != 'true' && needs.scope.outputs.admet_result_only != 'true' && needs.scope.outputs.target_evidence_only != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Exact bounded scope contract
        run: |
          uv run --locked pytest -q tests/test_restraint_guidance_scope.py
          uv run --locked ruff check scripts/restraint-guidance-scope.py tests/test_restraint_guidance_scope.py
      - name: Exact bilingual optional-step instructions and direct form consumers; no calculations
        working-directory: frontend
        run: >-
          npx vitest run src/guided/QuestionnaireGuidance.test.tsx
          src/guided/Questionnaire.test.tsx src/examples/TemplateStepHelp.test.tsx
          src/integrations/ScientificForm.test.tsx src/simulations/SimulationForm.test.tsx
          src/integrations/Mol1Form.test.tsx
