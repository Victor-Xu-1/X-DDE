name: Molecular view workspace alignment
on:
  workflow_dispatch:
  push:
    paths: &structure_paths
      - "frontend/src/operations/NativeReport.tsx"
      - "frontend/src/operations/EpitopeResults.tsx"
      - "frontend/src/operations/EpitopeResults.test.tsx"
      - "frontend/src/operations/EpitopeWorkspace.test.tsx"
      - "frontend/src/operations/EpitopeContactList.tsx"
      - "frontend/src/operations/epitope.css"
      - "frontend/src/operations/StructureComparisonResults.tsx"
      - "frontend/src/admet/AdmetResults.tsx"
      - "frontend/src/admet/admet.css"
      - "frontend/src/chemistry/StateCollectionPreview.tsx"
      - "frontend/src/datasets/CandidateView.tsx"
      - "frontend/src/datasets/IndexedLibraryResults.tsx"
      - "frontend/src/datasets/datasets.css"
      - "frontend/src/diffsbdd/FixedAtomPicker.tsx"
      - "frontend/src/diffsbdd/GeneratedCandidates.tsx"
      - "frontend/src/diffsbdd/InteractionResults.tsx"
      - "frontend/src/diffsbdd/PocketPicker.tsx"
      - "frontend/src/diffsbdd/ReferencePocketResults.tsx"
      - "frontend/src/diffsbdd/interaction-results.css"
      - "frontend/src/discovery/ReferenceImportResults*"
      - "frontend/src/discovery/ReferenceArchivePreview.tsx"
      - "frontend/src/discovery/reference-import.css"
      - "server_tests/test_reference_preview_browser.py"
      - "server_tests/reference_archive_replay.py"
      - "tests/test_reference_replay.py"
      - "tests/fixtures/reference_import/*"
      - "frontend/src/presentation/MoleculeImage*"
      - "frontend/src/presentation/depiction-renderer*"
      - "frontend/src/viewer/structure-bytes*"
      - "frontend/src/docking/DockingResults.tsx"
      - "frontend/src/docking/SearchRegion.tsx"
      - "frontend/src/evidence/EvidenceResults.tsx"
      - "frontend/src/evidence/evidence.css"
      - "frontend/src/examples/ExampleJobResult.tsx"
      - "frontend/src/examples/CampaignCasePreview.tsx"
      - "frontend/src/examples/campaign-preview.css"
      - "frontend/src/examples/StudyInputPreview.tsx"
      - "frontend/src/examples/examples.css"
      - "frontend/src/integrations/InteractionResults*"
      - "frontend/src/integrations/ProteinInterfaceResults*"
      - "frontend/src/integrations/ProteinInterfaceContacts.tsx"
      - "frontend/src/integrations/interaction-residue*"
      - "frontend/src/integrations/interaction-workspace.css"
      - "scripts/interaction-workspace-scope.py"
      - "tests/test_interaction_workspace_scope.py"
      - "server_tests/test_interaction_workspace_browser.py"
      - "server_tests/test_protein_interface_workspace_browser.py"
      - "server_tests/test_epitope_workspace_browser.py"
      - "server_tests/interaction_workspace_case.py"
      - "frontend/src/integrations/PotentialResults.tsx"
      - "frontend/src/integrations/ScaffoldSelection.tsx"
      - "frontend/src/integrations/ScientificResults.tsx"
      - "frontend/src/integrations/StructureTargetSelection.tsx"
      - "frontend/src/integrations/target-selection.css"
      - "frontend/src/operations/CandidateSequenceResults.tsx"
      - "frontend/src/operations/CampaignMonitor.tsx"
      - "frontend/src/operations/CovalentEditor.tsx"
      - "frontend/src/operations/PropertyResults.tsx"
      - "frontend/src/pockets/PocketResults.tsx"
      - "frontend/src/pockets/pocket-results.css"
      - "frontend/src/poses/ClusterResults.tsx"
      - "frontend/src/poses/PoseResults.tsx"
      - "frontend/src/poses/cluster.css"
      - "frontend/src/presentation/ensemble-results.css"
      - "frontend/src/proximity/AttachmentDirections.tsx"
      - "frontend/src/proximity/BindingRegion.tsx"
      - "frontend/src/proximity/PartnerStep.tsx"
      - "frontend/src/proximity/Results.tsx"
      - "frontend/src/proximity/proximity.css"
      - "frontend/src/quality/QualityResults.tsx"
      # Assessment-only result changes have native layout coverage in sequence-result-checks.yml.
      - "!frontend/src/quality/QualityResults.tsx"
      - "frontend/src/receptors/ReceptorResults.tsx"
      - "frontend/src/receptors/StructurePrepareForm.tsx"
      - "frontend/src/receptors/SurfaceRegionPicker.tsx"
      - "frontend/src/receptors/SurfaceResults.tsx"
      - "frontend/src/receptors/surface.css"
      - "frontend/src/regions/AtomSelection.tsx"
      - "frontend/src/regions/RegionResult.tsx"
      - "frontend/src/research/ResearchWorkspace.tsx"
      - "frontend/src/research/research.css"
      - "frontend/src/simulations/DynamicsResults.tsx"
      - "frontend/src/simulations/FreeEnergyResults.tsx"
      - "frontend/src/space/ChannelResults.tsx"
      - "frontend/src/space/channels.css"
      - "frontend/src/studio/PredictionResults.tsx"
      - "frontend/src/viewer/MinimizedPoseResults.tsx"
      - "frontend/src/viewer/viewer.css"
      - "frontend/src/presentation/StructureWorkbench.tsx"
      - "frontend/src/presentation/structure-workbench.css"
      - "server_tests/test_structure_workbench_browser.py"
      - "server_tests/test_result_visuals_browser.py"
      - "server_tests/test_target_selection_browser.py"
      - "server_tests/test_epitope_browser.py"
      - ".github/workflows/structure-layout-checks.yml"
      # Pair selection does not change shared sizing; its native views use the cluster gate.
      - "!frontend/src/poses/ClusterResults.tsx"
      - "!.github/workflows/structure-layout-checks.yml"
      # Generated-candidate counts/handoff have exact native desktop/narrow checks.
      - "!frontend/src/diffsbdd/GeneratedCandidates.tsx"
      # Native prepared/indexed member layouts have their own browser gate.
      - "!frontend/src/datasets/IndexedLibraryResults.tsx"
      # Fixed-case stage checks verify these exact native preview layouts.
      - "!frontend/src/datasets/CandidateView.tsx"
      - "!frontend/src/examples/ExampleJobResult.tsx"
      # Docking defaults and linked native geometry have exact pose-continuity coverage.
      - "!frontend/src/docking/DockingResults.tsx"
      # Pocket presentation and both continuation forms have native browser coverage in pocket-result-checks.
      - "!frontend/src/pockets/PocketResults.tsx"
      - "!frontend/src/pockets/pocket-results.css"
      # Receptor alignment, its direct controls and exact native sources have a focused viewer gate.
      - "!frontend/src/receptors/ReceptorResults.tsx"
      # Saved preparation views use the same native viewer gate.
      - "!frontend/src/receptors/StructurePrepareResults*"
      - "!frontend/src/operations/PreparedInputResults*"
      # Native ternary tabs, exact coordinates and desktop widths use proximity-checks.
      - "!frontend/src/proximity/Results.tsx"
  pull_request:
    paths: *structure_paths
permissions:
  contents: read
jobs:
  workspace-scope:
    uses: ./.github/workflows/workspace-preview-checks.yml
    with:
      scope_only: true
  utility-scope:
    uses: ./.github/workflows/molecular-utility-checks.yml
    with:
      scope_only: true
  guidance-scope:
    uses: ./.github/workflows/restraint-guidance-checks.yml
    with:
      scope_only: true
  prediction-scope:
    uses: ./.github/workflows/prediction-workspace-checks.yml
    with:
      scope_only: true
  model-context:
    uses: ./.github/workflows/property-model-review-checks.yml
    with:
      scope_only: true
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      del_only: ${{ steps.change.outputs.del_only }}
      native_receptor_only: ${{ steps.case_scope.outputs.native_receptor_only }}
      interaction_only: ${{ steps.interaction.outputs.interaction_only }}
      epitope_only: ${{ steps.interaction.outputs.epitope_only }}
      epitope_changed: ${{ steps.interaction.outputs.epitope_changed }}
      reference_only: ${{ steps.interaction.outputs.reference_only }}
      admet_result_only: ${{ steps.admet.outputs.admet_result_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: change
        env:
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: python3 scripts/del-ci-scope.py
      - id: case_scope
        env:
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: python3 scripts/case-data-scope.py
      - id: interaction
        env:
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: python3 scripts/interaction-workspace-scope.py
      - id: admet
        env:
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: python3 scripts/admet-workspace-scope.py
  interaction-workspace:
    needs: scope
    if: needs.scope.outputs.interaction_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Native contact identity, repeated selection and exact table consumers
        if: needs.scope.outputs.reference_only != 'true' && needs.scope.outputs.epitope_only != 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/integrations/InteractionResults.test.tsx
          src/integrations/interaction-residue.test.ts
          src/integrations/ProteinInterfaceResults.test.tsx
          src/integrations/ScientificResults.test.tsx src/presentation/ResearchTable.test.tsx
      - name: Exact epitope source, unique loaded residue focus and docked sequence controls
        if: needs.scope.outputs.epitope_changed == 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/operations/EpitopeResults.test.tsx
          src/operations/EpitopeWorkspace.test.tsx src/integrations/interaction-residue.test.ts
      - run: uv sync --locked --group dev --group browser
      - name: Closed result scope and native-browser source contracts
        if: needs.scope.outputs.reference_only != 'true'
        run: |
          uv run --locked pytest -q tests/test_interaction_workspace_scope.py tests/test_protein_interface_scope.py
          uv run --locked ruff check scripts/interaction-workspace-scope.py scripts/protein-interface-scope.py tests/test_interaction_workspace_scope.py tests/test_protein_interface_scope.py server_tests/test_interaction_workspace_browser.py server_tests/test_protein_interface_workspace_browser.py server_tests/interaction_workspace_case.py
          uv run --locked ruff check server_tests/test_epitope_workspace_browser.py
      - name: Reference source integrity, native renderer defaults and direct preview consumers
        if: needs.scope.outputs.reference_only == 'true'
        run: |
          cd frontend
          npx vitest run src/discovery/ReferenceImportResults.test.tsx src/presentation/MoleculeImage.test.tsx src/presentation/depiction-renderer.test.ts src/viewer/structure-bytes.test.ts src/viewer/StructureViewer.test.tsx src/research/SelectedAssetPreview.test.tsx src/publication/molecular-vector.test.ts src/publication/FigureExport.test.tsx
          cd ..
          uv run --locked python -m pytest -q tests/test_interaction_workspace_scope.py tests/test_reference_replay.py tests/test_reference_import.py tests/test_source_transport.py tests/test_source_proxy.py
          uv run --locked ruff check scripts/interaction-workspace-scope.py tests/test_interaction_workspace_scope.py server_tests/test_reference_preview_browser.py server_tests/reference_archive_replay.py tests/test_reference_replay.py
      - name: Obtain sealed STAT6 outputs; do not execute scientific engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          readarray -t source < <(uv run --locked python -c 'from opendde_workbench.examples.stat6_bundle_release import URL; print("\n".join(URL.rsplit("/", 2)[-2:]))')
          test "${#source[@]}" -eq 2
          [[ "${source[0]}" =~ ^examples-v[0-9]+$ ]]
          [[ "${source[1]}" =~ ^stat6-reviewed-results-v[0-9]+\.zip$ ]]
          gh release download "${source[0]}" --repo "$GITHUB_REPOSITORY" --pattern "${source[1]}" --dir "$RUNNER_TEMP"
          echo "WB_REVIEWED_STAT6_ARCHIVE=$RUNNER_TEMP/${source[1]}" >> "$GITHUB_ENV"
      - name: Browser dependencies for focused epitope preview checks
        if: needs.scope.outputs.epitope_only == 'true'
        run: uv run --locked playwright install-deps chromium
      - name: Browser for other affected contact or reference views
        if: needs.scope.outputs.epitope_only != 'true'
        run: |
          uv run --locked playwright install chromium --with-deps
          if [[ '${{ needs.scope.outputs.reference_only }}' == 'true' ]]; then
            uv run --locked playwright install chrome --with-deps
          fi
      - name: Actual bilingual saved contact rows, native 3D focus and source downloads
        if: needs.scope.outputs.reference_only != 'true' && needs.scope.outputs.epitope_only != 'true'
        run: uv run --locked python -m pytest -x -q server_tests/test_interaction_workspace_browser.py server_tests/test_protein_interface_workspace_browser.py
      - name: Actual bilingual epitope preview integrity, docked sequence and native downloads
        if: needs.scope.outputs.epitope_changed == 'true'
        run: uv run --locked python -m pytest -x -q server_tests/test_epitope_workspace_browser.py
      - name: Google Chrome native archive pipeline with sealed public transport, retry and export
        if: needs.scope.outputs.reference_only == 'true'
        run: uv run --locked python -m pytest -x -q --basetemp "$RUNNER_TEMP/reference-preview" server_tests/test_reference_preview_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interaction-workspace-evidence
          path: |
            outputs/interaction-workspace
            outputs/protein-interface-workspace
            outputs/epitope-workspace
            outputs/reference-preview
            server_tests/evidence/hydrogen-policy
  view-alignment:
    needs: [scope, model-context, prediction-scope, guidance-scope, utility-scope, workspace-scope]
    if: needs.workspace-scope.outputs.file_navigation_only != 'true' && needs.utility-scope.outputs.utility_only != 'true' && needs.prediction-scope.outputs.target_evidence_only != 'true' && (needs.scope.outputs.admet_result_only != 'true' && needs.scope.outputs.interaction_only != 'true' && needs.scope.outputs.del_only != 'true' && needs.model-context.outputs.model_context_only != 'true' && needs.scope.outputs.native_receptor_only != 'true' && needs.prediction-scope.outputs.prediction_only != 'true' && needs.guidance-scope.outputs.guidance_only != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Changed molecular result and selection consumers only
        working-directory: frontend
        run: >-
          npx vitest run
          src/admet/AdmetResults.test.tsx
          src/chemistry/StateResults.test.tsx
          src/datasets/IndexedLibraryResults.test.tsx
          src/datasets/DatasetResults.test.tsx
          src/diffsbdd/GeneratedCandidates.test.tsx
          src/diffsbdd/DiffResults.test.tsx
          src/diffsbdd/InteractionResults.test.tsx
          src/diffsbdd/DiffForm.test.tsx
          src/docking/DockingResults.test.tsx
          src/docking/DockingForm.test.tsx
          src/evidence/EvidenceResults.test.tsx
          src/examples/ExampleJobResult.test.tsx
          src/examples/CampaignCasePreview.test.tsx
          src/operations/PreparedInputResults.test.tsx
          src/integrations/StructureTargetSelection.test.tsx
          src/operations/CandidateSequenceResults.test.tsx
          src/operations/CovalentEditor.test.tsx
          src/operations/PropertyResults.test.tsx
          src/operations/EpitopeResults.test.tsx
          src/operations/StructureComparisonResults.test.tsx
          src/operations/HarnessResults.test.tsx
          src/pockets/PocketResults.test.tsx
          src/poses/ClusterResults.test.tsx
          src/poses/PoseResults.test.tsx
          src/receptors/ReceptorResults.test.tsx
          src/receptors/SurfaceResults.test.tsx
          src/receptors/StructurePrepareForm.test.tsx
          src/regions/RegionWorkspace.test.tsx
          src/research/ResearchWorkspace.test.tsx
          src/simulations/SimulationResults.test.tsx
          src/studio/PredictionResults.test.tsx
          src/quality/tests/QualityResults.test.tsx
      - name: Retain actual reviewed results without scientific calculations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-structure-layout" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-structure-layout/state" >> "$GITHUB_ENV"
          version=$(.venv/bin/python -c 'from opendde_workbench.examples.stat6_bundle_release import VERSION; print(VERSION)')
          gh release download examples-v2 --pattern "stat6-reviewed-results-v${version}.zip" --dir "$RUNNER_TEMP"
          export WB_HOME="$RUNNER_TEMP/x-dde-structure-layout" WB_STATE_DIR="$RUNNER_TEMP/x-dde-structure-layout/state"
          .venv/bin/python -c 'import os; from pathlib import Path; from opendde_workbench.examples.bundle import restore_bundle; from opendde_workbench.examples.stat6_bundle_release import SHA256, VERSION; from opendde_workbench.settings import Settings; print(restore_bundle(Path(os.environ["RUNNER_TEMP"])/f"stat6-reviewed-results-v{VERSION}.zip", Settings.from_env(), SHA256))'
          .venv/bin/python server_tests/prepare_visual_components.py --components ketcher
      - run: uv run --locked playwright install chromium --with-deps
      - name: Native STAT6 layout geometry and preserved task identity, desktop and narrow
        run: uv run --locked python -m pytest -x -q server_tests/test_structure_workbench_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structure-workbench-evidence
          path: outputs/structure-workbench/**
  adjacent-result-consumers:
    needs: [scope, model-context, prediction-scope, guidance-scope, utility-scope, workspace-scope]
    if: needs.workspace-scope.outputs.file_navigation_only != 'true' && needs.prediction-scope.outputs.confidence_frame != 'true' && needs.utility-scope.outputs.utility_only != 'true' && needs.prediction-scope.outputs.target_evidence_only != 'true' && (needs.scope.outputs.admet_result_only != 'true' && needs.scope.outputs.interaction_only != 'true' && needs.scope.outputs.del_only != 'true' && needs.model-context.outputs.model_context_only != 'true' && needs.scope.outputs.native_receptor_only != 'true' && needs.guidance-scope.outputs.guidance_only != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WB_AUTO_DEPLOY: "0"
      WB_BROWSER_URL: http://127.0.0.1:4330
      WB_LAYOUT_WIDTH: "1440"
      WB_LAYOUT_SHARD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Restore retained sources for the three changed consumers only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export WB_HOME="$RUNNER_TEMP/x-dde-adjacent-layout" WB_STATE_DIR="$RUNNER_TEMP/x-dde-adjacent-layout/state"
          echo "WB_HOME=$WB_HOME" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$WB_STATE_DIR" >> "$GITHUB_ENV"
          gh release download examples-v1 --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
          .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          .venv/bin/python server_tests/prepare_visual_components.py
          .venv/bin/python server_tests/prepare_indexed_preview_poses.py
      - name: Native state and indexed pose views, target picking and epitope selection
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/task-layout
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/task-layout/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null
          .venv/bin/python -m pytest -q server_tests/test_result_visuals_browser.py server_tests/test_target_selection_browser.py server_tests/test_epitope_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adjacent-molecular-consumer-evidence
          path: server_tests/evidence/task-layout/**
