name: Owned localhost lifecycle checks
on:
  workflow_dispatch:
  push:
    paths: &lifecycle_paths
      - "src/opendde_workbench/service_control.py"
      - "tests/test_service_control.py"
      - ".github/workflows/service-control-checks.yml"
  pull_request:
    paths: *lifecycle_paths
permissions:
  contents: read
jobs:
  localhost:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Build the frontend required by the installable platform package
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Loopback transport and existing shutdown protections
        run: |
          uv run --locked ruff check src/opendde_workbench/service_control.py tests/test_service_control.py
          uv run --locked pytest -q tests/test_service_control.py
