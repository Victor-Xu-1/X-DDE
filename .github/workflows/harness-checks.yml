name: Native Harness bridge checks
on:
  push:
    paths:
      - 'src/opendde_workbench/harness_*.py'
      - 'tests/test_harness_standalone.py'
      - '.github/workflows/harness-checks.yml'
  pull_request:
    paths:
      - 'src/opendde_workbench/harness_*.py'
      - 'tests/test_harness_standalone.py'
      - '.github/workflows/harness-checks.yml'
  workflow_dispatch:
jobs:
  native-bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Build required package assets
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          uv sync --locked --group dev
      - name: Verify standalone contracts and related Harness dispatch
        run: |
          uv run --locked ruff check src/opendde_workbench/harness_contract.py src/opendde_workbench/harness_tools.py src/opendde_workbench/harness_bridge.py src/opendde_workbench/harness_compute.py tests/test_harness_standalone.py
          uv run --locked pytest -q tests/test_harness_standalone.py tests/test_operations.py tests/test_environment_roles.py
