name: Native Harness bridge checks
on:
  push:
    paths:
      - 'src/opendde_workbench/harness_*.py'
      - 'src/opendde_workbench/native_arguments.py'
      - 'tests/test_gpu_admission.py'
      - 'tests/test_campaign_handoff.py'
      - 'tests/test_harness_standalone.py'
      - 'tests/test_harness_process.py'
      - 'tests/test_harness_stop.py'
      - 'src/opendde_workbench/settings.py'
      - 'tests/test_interpreter_paths.py'
      - 'tests/test_harness_sequences.py'
      - 'src/opendde_workbench/assets.py'
      - '.github/workflows/harness-checks.yml'
  pull_request:
    paths:
      - 'src/opendde_workbench/harness_*.py'
      - 'src/opendde_workbench/native_arguments.py'
      - 'tests/test_gpu_admission.py'
      - 'tests/test_campaign_handoff.py'
      - 'tests/test_harness_standalone.py'
      - 'tests/test_harness_process.py'
      - 'tests/test_harness_stop.py'
      - 'src/opendde_workbench/settings.py'
      - 'tests/test_interpreter_paths.py'
      - 'tests/test_harness_sequences.py'
      - 'src/opendde_workbench/assets.py'
      - '.github/workflows/harness-checks.yml'
  workflow_dispatch:
jobs:
  managed-compute-scope:
    runs-on: ubuntu-24.04
    outputs:
      managed_compute_only: ${{ steps.managed.outputs.managed_compute_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: managed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/managed_compute_scope.py
  native-bridge:
    needs: managed-compute-scope
    if: needs.managed-compute-scope.outputs.managed_compute_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Build required package assets
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          uv sync --locked --group dev
      - name: Verify standalone contracts and related Harness dispatch
        run: |
          uv run --locked ruff check src/opendde_workbench/harness_contract.py src/opendde_workbench/harness_tools.py src/opendde_workbench/harness_bridge.py src/opendde_workbench/harness_compute.py src/opendde_workbench/harness_process.py tests/test_harness_standalone.py tests/test_harness_process.py tests/test_harness_stop.py
          uv run --locked pytest -q tests/test_harness_standalone.py tests/test_harness_process.py tests/test_harness_stop.py tests/test_operations.py tests/test_environment_roles.py tests/test_interpreter_paths.py tests/test_harness_sequences.py
      - name: Verify bounded campaign and GPU admission contracts without native computation
        run: |
          uv run --locked ruff check src/opendde_workbench/native_arguments.py src/opendde_workbench/harness_service.py tests/test_gpu_admission.py tests/test_campaign_handoff.py
          uv run --locked pytest -q tests/test_gpu_admission.py tests/test_campaign_handoff.py tests/test_dataset_contracts.py tests/test_dataset_worker.py tests/test_integrated_science.py tests/test_diffsbdd_contract.py tests/test_docking.py
