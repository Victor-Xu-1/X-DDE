name: Induced proximity scoped checks
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Native method checks or the bounded memory investigation
        type: choice
        options: [native, memory_profile]
        default: native
  push:
    paths:
      - 'src/opendde_workbench/proximity/**'
      - 'src/opendde_workbench/integrations/recipes/deepternary*'
      - 'server_tests/deepternary*'
      - 'server_tests/proximity*'
      - 'server_tests/protac_initialization_checks.py'
      - 'server_tests/molecular_glue*'
      - 'server_tests/test_proximity_browser.py'
      - 'tests/test_proximity*'
      - 'frontend/src/proximity/**'
      # Study-only prefills use the STAT6 template gate, without native model execution.
      - '!frontend/src/proximity/useProximityDraft.ts'
      # Form-only budgets use the focused form gate; native model/geometry is unchanged.
      - '!frontend/src/proximity/Form*'
      - '!frontend/src/proximity/Plan.tsx'
      - '!frontend/src/proximity/ExecutionSettings.tsx'
      - '!frontend/src/proximity/execution.ts'
permissions:
  contents: read
  actions: read
concurrency:
  group: proximity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'memory_profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12 --group dev --group browser
      - name: Focused task, scientific contract and source-backed example checks
        run: >-
          uv run --locked pytest -q tests/test_proximity_contract.py
          tests/test_proximity_attachments.py
          tests/test_integrated_science.py tests/test_native_resources.py
          tests/test_receptor_contract.py tests/test_capabilities.py tests/test_examples.py
      - name: Independent binary pocket frames and alternate-anchor coordinate recovery
        run: uv run --locked --python 3.12 --with numpy==1.26.4 pytest -q tests/test_proximity_frames.py
      - name: Bilingual fixed-partner choices and actual questionnaire submission
        working-directory: frontend
        run: npx vitest run src/proximity/Form.test.tsx src/proximity/Plan.test.tsx
      - name: Official native CPU baseline on the complete MZ1 ternary case
        run: uv run --locked python server_tests/deepternary_native_probe.py --output "$RUNNER_TEMP/deepternary"
      - name: Review real ternary result displays and downloads
        env:
          WB_PROXIMITY_CASE: ${{ runner.temp }}/deepternary/platform
        run: |
          uv run --locked --group browser python -m playwright install --with-deps chromium
          uv run --locked --group browser pytest -q server_tests/test_proximity_browser.py
      - name: Verify accepted data installation preserves historical state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked python scripts/stage-release-examples.py --tag v0.4.37 --destination "$RUNNER_TEMP/proximity-release-inputs"
          gh release download examples-v1 --repo Victor-Xu-1/X-DDE --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
          uv run --locked python server_tests/channel_case_install_acceptance.py --case proximity --archive "$RUNNER_TEMP/proximity-release-inputs/x-dde-proximity-cases-v1.zip" --base "$RUNNER_TEMP/x-dde-public-cases-v1.zip" --output "$RUNNER_TEMP/proximity-data-install"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepternary-native-evidence
          path: |
            ${{ runner.temp }}/deepternary/*.log
            ${{ runner.temp }}/deepternary/*.json
            ${{ runner.temp }}/deepternary/output/*.log
            ${{ runner.temp }}/deepternary/output/*.json
            ${{ runner.temp }}/deepternary/output/native/*.pdb
            ${{ runner.temp }}/deepternary/output/native/*.csv
            ${{ runner.temp }}/deepternary/adapter-job/execution.log
            ${{ runner.temp }}/deepternary/adapter-job/acceptance.json
            ${{ runner.temp }}/deepternary/adapter-job/request.json
            ${{ runner.temp }}/deepternary/adapter-job/bindings.json
            ${{ runner.temp }}/deepternary/adapter-job/assets/*
            ${{ runner.temp }}/deepternary/adapter-job/output/*.json
            ${{ runner.temp }}/deepternary/adapter-job/output/*.csv
            ${{ runner.temp }}/deepternary/adapter-job/output/*.pdb
            ${{ runner.temp }}/deepternary/adapter-job/output/*.sdf
            ${{ runner.temp }}/deepternary/*-adapter-job/*.json
            ${{ runner.temp }}/deepternary/*-adapter-job/execution.log
            ${{ runner.temp }}/deepternary/*-adapter-job/output/*.json
            ${{ runner.temp }}/deepternary/*-adapter-job/output/*.pdb
            ${{ runner.temp }}/deepternary/*-adapter-job/output/*.sdf
            ${{ runner.temp }}/deepternary/*-adapter-job/assets/*
            ${{ runner.temp }}/deepternary/binary-inputs/**/*
            ${{ runner.temp }}/deepternary/glue-inputs/*/source.json
            ${{ runner.temp }}/deepternary/platform/*.log
            ${{ runner.temp }}/deepternary/platform/*.json
            ${{ runner.temp }}/deepternary/platform/*.pdb
            ${{ runner.temp }}/deepternary/platform/*.sdf
            ${{ runner.temp }}/deepternary/platform/*.zip
            ${{ runner.temp }}/deepternary/platform/*.png
            ${{ runner.temp }}/proximity-data-install/*.json

  memory-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'memory_profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Required frontend assets for the canonical package build hook
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12 --group dev
      - name: Static checks for native profiling instrumentation
        run: uv run --locked ruff check server_tests/deepternary_native_probe.py server_tests/ternary_memory_profile.py server_tests/ternary_memory_entry.py
      - name: Isolated STAT6 kernel-cap measurement; production request remains four GiB
        run: uv run --locked python server_tests/deepternary_native_probe.py --output "$RUNNER_TEMP/ternary-memory" --profile-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stat6-native-memory-evidence
          path: |
            ${{ runner.temp }}/ternary-memory/*.json
            ${{ runner.temp }}/ternary-memory/*.log
            ${{ runner.temp }}/ternary-memory/stat6-*/request.json
            ${{ runner.temp }}/ternary-memory/stat6-*/native-exit.json
            ${{ runner.temp }}/ternary-memory/stat6-*/execution.log
            ${{ runner.temp }}/ternary-memory/stat6-*/review.json
            ${{ runner.temp }}/ternary-memory/stat6-*/output/*.json
            ${{ runner.temp }}/ternary-memory/stat6-*/output/*.pdb
            ${{ runner.temp }}/ternary-memory/stat6-*/output/*.sdf
