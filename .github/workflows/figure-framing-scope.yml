name: Native molecular figure framing scope
on:
  workflow_call:
    outputs:
      framing_only:
        value: ${{ jobs.scope.outputs.framing_only }}
      compact_only:
        value: ${{ jobs.scope.outputs.compact_only }}
      compact_changed:
        value: ${{ jobs.scope.outputs.compact_changed }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      framing_only: ${{ steps.paths.outputs.framing_only }}
      compact_only: ${{ steps.paths.outputs.compact_only }}
      compact_changed: ${{ steps.paths.outputs.compact_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          only=false
          compact=false
          compact_changed=false
          if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == pull_request ]]; then
            if [[ "$GITHUB_REF_NAME" != main || ! "$BASE" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE=$(git merge-base HEAD origin/main)
            fi
            only=true
            capture=false
            while IFS= read -r path; do
              case "$path" in
                frontend/src/viewer/capture.ts|server_tests/test_figure_framing_browser.py) capture=true ;;
                frontend/src/viewer/StructureViewport.tsx)
                  # Leave unrelated viewer controls with their existing owners.
                  edits=$(git diff --unified=0 "$BASE" HEAD -- "$path" | sed -n '/^[+-][^+-]/p')
                  [[ "$edits" =~ ^\+[[:blank:]]+structureFraming$ ]] || only=false
                  ;;
                frontend/src/viewer/capture.test.ts|frontend/src/publication/settings.ts|frontend/src/publication/FigureDialog.tsx|frontend/src/publication/FigureExport.tsx|frontend/src/publication/FigureExport.test.tsx) ;;
                .github/workflows/figure-framing-scope.yml|.github/workflows/publication-checks.yml|.github/workflows/pose-handoff-checks.yml|.github/workflows/generated-candidate-checks.yml|.github/workflows/prediction-workspace-checks.yml|.github/workflows/simulation-view-checks.yml) ;;
                pyproject.toml|uv.lock|frontend/package.json|frontend/package-lock.json|install.sh|install.ps1) ;;
                *) only=false ;;
              esac
            done < <(git diff --name-only "$BASE" HEAD)
            [[ "$capture" == true ]] || only=false
            compact=true
            while IFS= read -r path; do
              case "$path" in
                frontend/src/publication/publication.css)
                  compact_changed=true
                  # Limit the layout-only replay to the reviewed preview-first layout delta.
                  [[ "$(git rev-parse "$BASE:$path")" == 85978131e4d3371102a191a53ab01044f621d667 &&
                     "$(git rev-parse "HEAD:$path")" == baef61987752d67e34bc2780168388cf684b14c8 ]] ||
                    compact=false
                  ;;
                frontend/src/publication/FigureDialog.tsx)
                  [[ "$(git rev-parse "$BASE:$path")" == 3335dd7925820e4a7bef4b7fc57408b9fbd517c2 &&
                     "$(git rev-parse "HEAD:$path")" == f663e3e022173a3d2755323ecf30d8642bbb6f2a ]] ||
                    compact=false
                  ;;
                docs/design/README.md)
                  [[ "$(git rev-parse "$BASE:$path")" == 0d2a9a78bcd1f0863f98b3da17c47c4664fae25f &&
                     "$(git rev-parse "HEAD:$path")" == f9dd51477a93537959ce699e0cc6e8f09a6a922a ]] ||
                    compact=false
                  ;;
                server_tests/test_compact_figure_dialog_browser.py) compact_changed=true ;;
                .github/workflows/figure-framing-scope.yml|pyproject.toml|uv.lock|frontend/package.json|frontend/package-lock.json|install.sh|install.ps1) ;;
                *) compact=false ;;
              esac
            done < <(git diff --name-only "$BASE" HEAD)
            [[ "$compact_changed" == true ]] || compact=false
          fi
          echo "framing_only=$only" >> "$GITHUB_OUTPUT"
          echo "compact_only=$compact" >> "$GITHUB_OUTPUT"
          echo "compact_changed=$compact_changed" >> "$GITHUB_OUTPUT"
