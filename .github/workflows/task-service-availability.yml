name: Task service availability and retry controls
on:
  pull_request:
    paths: &paths
      - "frontend/src/TaskDetail*"
      - "frontend/src/presentation/research-content*"
      - "frontend/src/studio/TaskWorkspace*"
      - "frontend/src/studio/PredictionResults*"
      - "frontend/src/studio/prediction-workspace.ts"
      - "frontend/src/studio/RuntimeStatus*"
      - "frontend/src/studio/ApplicationScope.tsx"
      - "frontend/src/viewer/PreviewAvailability.test.tsx"
      - "frontend/src/viewer/usePoseOptimization*"
      - "frontend/src/viewer/InitialPoseStatus.tsx"
      - "frontend/src/viewer/viewer.css"
      - "frontend/src/viewer/PoseOptimizationControls.tsx"
      - "src/opendde_workbench/research/pose_contract.py"
      - "src/opendde_workbench/research/pose_routes.py"
      - "src/opendde_workbench/research/initial_pose.py"
      - "tests/test_pose_preview_availability.py"
      - "server_tests/test_initial_pose_power_browser.py"
      - "frontend/src/App.tsx"
      - ".github/workflows/task-service-availability.yml"
  push:
    paths: *paths
permissions:
  contents: read
jobs:
  utility-scope:
    uses: ./.github/workflows/molecular-utility-checks.yml
    with:
      scope_only: true
  availability:
    needs: utility-scope
    if: needs.utility-scope.outputs.utility_only != 'true' || needs.utility-scope.outputs.initial_pose_power_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: preview
        name: Detect changed initial-pose consumers
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          touched=false
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null || ! git diff --quiet "$BASE" HEAD -- \
            frontend/src/viewer/InitialPoseStatus.tsx frontend/src/viewer/usePoseOptimization.ts \
            src/opendde_workbench/research/initial_pose.py src/opendde_workbench/research/pose_routes.py \
            src/opendde_workbench/research/pose_contract.py frontend/src/viewer/viewer.css \
            server_tests/test_initial_pose_power_browser.py .github/workflows/task-service-availability.yml; then
            touched=true
          fi
          echo "touched=$touched" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Retry blocking, recovery, bilingual failures and module consumers
        if: needs.utility-scope.outputs.initial_pose_power_only != 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/TaskDetail.test.tsx src/TaskDetail.actions.test.tsx
          src/presentation/research-content.test.ts src/studio/TaskWorkspace.test.tsx
          src/studio/PredictionResults.test.tsx src/studio/RuntimeStatus.test.tsx src/App.test.tsx
          src/viewer/PreviewAvailability.test.tsx src/viewer/usePoseOptimization.test.tsx
          src/viewer/StructureViewer.test.tsx src/viewer/PoseSession.test.tsx
      - uses: astral-sh/setup-uv@v6
      - name: Cache-only admission and retained computed-coordinate contracts
        if: needs.utility-scope.outputs.initial_pose_power_only != 'true'
        run: >-
          uv run --locked --group dev pytest -q tests/test_pose_preview_availability.py
          tests/test_pose_minimization.py tests/test_stat6_geometry.py
      - name: Initial conformer switch and preview consumers
        if: needs.utility-scope.outputs.initial_pose_power_only == 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/viewer/PreviewAvailability.test.tsx src/viewer/usePoseOptimization.test.tsx
          src/viewer/StructureViewer.test.tsx
      - name: Cache lookup and default-off API
        if: needs.utility-scope.outputs.initial_pose_power_only == 'true'
        run: |
          uv sync --locked --group dev
          uv run --locked ruff check src/opendde_workbench/research/initial_pose.py src/opendde_workbench/research/pose_routes.py tests/test_pose_preview_availability.py scripts/molecular-utility-scope.py tests/test_molecular_utility_scope.py server_tests/test_initial_pose_browser.py server_tests/test_native_initial_pose.py
          uv run --locked python -m pytest -q tests/test_pose_preview_availability.py tests/test_molecular_utility_scope.py tests/test_pose_minimization.py tests/test_stat6_geometry.py
      - name: Actual Chrome preview with a default-off backend
        if: steps.preview.outputs.touched == 'true'
        env:
          WB_AUTO_DEPLOY: "0"
        run: |
          uv sync --locked --group dev --group browser
          uv run --locked ruff check server_tests/test_initial_pose_power_browser.py
          uv run --locked python -m pytest -q server_tests/test_initial_pose_power_browser.py
