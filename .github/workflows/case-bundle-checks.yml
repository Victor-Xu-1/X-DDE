name: Case bundle and managed compute checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/opendde_workbench/examples/bundle*.py'
      - 'src/opendde_workbench/examples/surface_bundle_release.py'
      - 'src/opendde_workbench/examples/stat6_bundle_release.py'
      - 'scripts/stage-release-examples.py'
      - 'tests/test_dataset_resources.py'
      - 'tests/ci/test_case_bundle_scope.py'
      - 'tests/portable/test_bundle_archive.py'
      - 'src/opendde_workbench/deployment/**'
      - 'src/opendde_workbench/settings.py'
      - 'tests/test_case_bundle.py'
      - 'tests/test_stat6_case_bundle.py'
      - 'tests/test_case_retry_history.py'
      - 'tests/test_case_bundle_sources.py'
      - 'tests/test_compute_service.py'
      - 'frontend/src/deployment/**'
      # Group membership changes use the focused component-group integration tests.
      - '!frontend/src/deployment/component-groups.ts'
      - '.github/workflows/case-bundle-checks.yml'
  pull_request:
    paths:
      - 'src/opendde_workbench/examples/bundle*.py'
      - 'src/opendde_workbench/examples/surface_bundle_release.py'
      - 'src/opendde_workbench/examples/stat6_bundle_release.py'
      - 'scripts/stage-release-examples.py'
      - 'tests/test_dataset_resources.py'
      - 'tests/ci/test_case_bundle_scope.py'
      - 'tests/test_case_bundle.py'
      - 'tests/test_stat6_case_bundle.py'
      - 'tests/test_case_retry_history.py'
      - 'tests/portable/test_bundle_archive.py'
      - 'src/opendde_workbench/deployment/**'
      - 'src/opendde_workbench/settings.py'
      - 'frontend/src/deployment/**'
      - '!frontend/src/deployment/component-groups.ts'
permissions:
  contents: read
  actions: read
jobs:
  scoped-delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify consumer selection
        run: python3 -m unittest discover -s tests/ci -p test_case_bundle_scope.py
      - name: Select checks for affected consumers
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'deployment=true' >> "$GITHUB_OUTPUT"
          else
            # Keep diff errors out of a conditional; errexit must stop this step.
            changed_files=$(git diff --name-only "$BASE" "$HEAD")
            # Consume all input, and distinguish no match from a command error.
            if grep -E '^(src/opendde_workbench/(deployment/|settings.py)|frontend/src/deployment/)' <<< "$changed_files" > /dev/null; then
              echo 'deployment=true' >> "$GITHUB_OUTPUT"
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                exit "$status"
              fi
              echo 'deployment=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest -q tests/portable/test_bundle_archive.py tests/test_case_bundle.py tests/test_stat6_case_bundle.py tests/test_case_retry_history.py tests/test_case_bundle_sources.py tests/test_example_pins.py tests/test_example_records.py tests/test_api_security.py
      - name: Changed deployment consumers
        if: steps.scope.outputs.deployment == 'true'
        run: uv run --locked pytest -q tests/test_reference_import.py tests/test_compute_service.py tests/test_deployment.py
      - name: Verify case installation into the active state
        run: uv run --locked pytest -q tests/test_dataset_resources.py -k case_component_queue_restores_into_current_state
      - name: Stage the exact accepted release data without scientific recomputation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(uv run --locked python -c 'from opendde_workbench import __version__; print(__version__)')
          uv run --locked python scripts/stage-release-examples.py --tag "v$version" --destination "$RUNNER_TEMP/staged-cases"
      - working-directory: frontend
        if: steps.scope.outputs.deployment == 'true'
        run: npx vitest run src/deployment/deployment.test.tsx src/deployment/DeploymentActivity.test.tsx src/deployment/ComputeServicePanel.test.tsx

  archive-publication-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      # The package build requires its web resources; no scientific engines run here.
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Verify no-clobber archive publication, interrupted exports and same-path retry
        run: uv run --locked pytest -q --confcutdir=tests/portable tests/portable/test_bundle_archive.py
