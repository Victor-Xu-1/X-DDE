  workflow_dispatch:
jobs:
  presentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked frontend dependencies and build
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Check changed presentation and direct user-page consumers
        working-directory: frontend
        run: >-
          npx vitest run
          src/presentation/ResearchTable.test.tsx
          src/presentation/FileSelect.test.tsx
          src/integrations/StructureTargetSelection.test.tsx
          src/integrations/PropertyModelSelection.test.tsx
