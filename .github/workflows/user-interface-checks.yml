name: User interface checks
on:
  push:
    branches: ['**']
    paths:
      - 'frontend/src/presentation/**'
      - 'frontend/src/integrations/**'
      - 'frontend/src/App.tsx'
      - 'frontend/src/App.test.tsx'
      - 'frontend/src/TaskDetail*'
      - 'frontend/src/useWorkbench*'
      - 'frontend/src/studio/RuntimeStatus*'
      - 'frontend/src/studio/EnvironmentStatusTable*'
      - 'frontend/src/studio/runtime-status.css'
      - 'frontend/src/operations/filter*'
      - 'frontend/src/**/*Results*'
      - 'frontend/src/research/ResearchWorkspace*'
      - 'frontend/src/operations/ToolCenter*'
      - 'frontend/src/studio/HomeWorkspace*'
      - 'frontend/src/deployment/**'
      - 'frontend/src/design/**'
      - 'frontend/src/humanization/**'
      - 'frontend/src/guided/questionnaire.css'
      - 'frontend/src/guided/Questionnaire*'
      - 'frontend/src/TaskForm*'
      - 'frontend/src/operations/AssetPicker*'
      - 'frontend/src/operations/HarnessForm*'
      - 'frontend/src/operations/CampaignForm*'
      - 'frontend/src/datasets/DatasetPicker*'
      - 'frontend/src/datasets/SourcePicker*'
      - 'frontend/src/datasets/useDatasetSources*'
      - 'frontend/src/datasets/DEL*'
      - 'frontend/src/receptors/SurfaceForm*'
      - 'frontend/src/editors/Editors*'
      - 'frontend/src/workflow.css'
      - 'frontend/src/research/ObjectInspector*'
      - 'frontend/src/research/research.css'
      - '.github/workflows/user-interface-checks.yml'
  pull_request:
    paths:
      - 'frontend/src/presentation/**'
      - 'frontend/src/integrations/**'
      - 'frontend/src/App.tsx'
      - 'frontend/src/App.test.tsx'
      - 'frontend/src/TaskDetail*'
      - 'frontend/src/useWorkbench*'
      - 'frontend/src/studio/RuntimeStatus*'
      - 'frontend/src/studio/EnvironmentStatusTable*'
      - 'frontend/src/studio/runtime-status.css'
      - 'frontend/src/operations/filter*'
      - 'frontend/src/**/*Results*'
      - 'frontend/src/research/ResearchWorkspace*'
      - 'frontend/src/operations/ToolCenter*'
      - 'frontend/src/studio/HomeWorkspace*'
      - 'frontend/src/deployment/**'
      - 'frontend/src/design/**'
      - 'frontend/src/humanization/**'
      - 'frontend/src/guided/questionnaire.css'
      - 'frontend/src/guided/Questionnaire*'
      - 'frontend/src/TaskForm*'
      - 'frontend/src/operations/AssetPicker*'
      - 'frontend/src/operations/HarnessForm*'
      - 'frontend/src/operations/CampaignForm*'
      - 'frontend/src/datasets/DatasetPicker*'
      - 'frontend/src/datasets/SourcePicker*'
      - 'frontend/src/datasets/useDatasetSources*'
      - 'frontend/src/datasets/DEL*'
      - 'frontend/src/receptors/SurfaceForm*'
      - 'frontend/src/editors/Editors*'
      - 'frontend/src/workflow.css'
      - 'frontend/src/research/ObjectInspector*'
      - 'frontend/src/research/research.css'
      - '.github/workflows/user-interface-checks.yml'
  workflow_dispatch:
jobs:
  presentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked frontend dependencies and build
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Check changed presentation and direct user-page consumers
        working-directory: frontend
        run: >-
          npx vitest run
          src/presentation/ResearchTable.test.tsx
          src/presentation/FileSelect.test.tsx
          src/integrations/StructureTargetSelection.test.tsx
          src/integrations/PropertyModelSelection.test.tsx
          src/integrations/ScientificChoices.test.tsx
          src/datasets/SourcePicker.test.tsx
          src/receptors/SurfaceForm.test.tsx
          src/operations/AssetPicker.test.tsx
          src/TaskForm.test.tsx
          src/guided/workflows.test.tsx
          src/operations/CampaignForm.test.tsx
          src/presentation/MetricScatter.test.tsx
          src/presentation/InteractionDiagram.test.tsx
          src/presentation/depiction-renderer.test.ts
          src/viewer/useViewerSnapshot.test.ts
          src/viewer/capture.test.ts
          src/presentation/research-files.test.tsx
          src/presentation/research-graph.test.ts
          src/research/ResearchWorkspace.test.tsx
          src/TaskDetail.test.tsx
          src/useWorkbench.test.ts
          src/App.test.tsx
          src/studio/Navigation.test.tsx
          src/studio/ResearchEntry.test.tsx
          src/studio/research-modules.test.ts
          src/studio/TaskWorkspace.test.tsx
          src/studio/PredictionResults.test.tsx
          src/studio/CandidatePanel.test.tsx
          src/studio/InterfaceSettings.test.tsx
          src/studio/RuntimeStatus.test.tsx
          src/diffsbdd/DesignInputContext.test.tsx
          src/studio/HomeWorkspace.test.tsx
          src/operations/ToolCenter.test.tsx
          src/examples/ExampleActions.test.tsx
          src/operations/filter.test.ts
          src/operations/ToolQuestionnaires.test.tsx
          src/operations/OperationResults.test.tsx
          src/admet/AdmetResults.test.tsx
          src/quality/tests/QualityResults.test.tsx
          src/antibodies/AntibodyNumberResults.test.tsx
          src/chemistry/LibraryScreenResults.test.tsx
          src/chemistry/StateResults.test.tsx
          src/humanization/HumanizationResults.test.tsx
          src/docking/DockingResults.test.tsx
          src/deployment/deployment.test.tsx
          src/deployment/component-groups.test.ts
          src/deployment/ComputeServicePanel.test.tsx
