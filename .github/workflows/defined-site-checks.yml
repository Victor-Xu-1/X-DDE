name: Defined pocket exploration checks
on:
  workflow_dispatch:
  push:
    paths:
      - "src/opendde_workbench/sites/**"
      - "src/opendde_workbench/receptors/alignment_evidence.py"
      - "src/opendde_workbench/pose_ensembles/contracts.py"
      - "src/opendde_workbench/pose_ensembles/planning.py"
      - "src/opendde_workbench/pose_ensembles/sources.py"
      - "src/opendde_workbench/pose_ensembles/storage.py"
      - "src/opendde_workbench/research/graph_records.py"
      - "tests/test_defined*"
      - "tests/fixtures/stat6/9big-ak1690*"
      - ".github/workflows/defined-site-checks.yml"
permissions:
  contents: read
jobs:
  definitions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Restore only the immutable public data fixture; no tasks run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.77 --repo "$GITHUB_REPOSITORY" --pattern stat6-reviewed-results-v7.zip --dir "$RUNNER_TEMP/defined-site-data"
          echo "WB_DEFINED_SITE_ARCHIVE=$RUNNER_TEMP/defined-site-data/stat6-reviewed-results-v7.zip" >> "$GITHUB_ENV"
      - name: Defined conditions, existing native-site contracts and real retained-frame API
        run: >-
          uv run --locked --with biopython==1.88 --with numpy==1.26.4 pytest -q
          tests/test_defined_pose_regions.py tests/test_defined_site_api.py
          tests/test_pose_exploration_contract.py tests/test_pose_exploration_api.py
          tests/test_site_association.py tests/test_receptor_contract.py
      - name: Only changed source authorities and direct consumers
        run: >-
          uv run --locked ruff check src/opendde_workbench/sites
          src/opendde_workbench/receptors/alignment_evidence.py
          src/opendde_workbench/pose_ensembles/contracts.py
          src/opendde_workbench/pose_ensembles/planning.py
          src/opendde_workbench/pose_ensembles/sources.py
          src/opendde_workbench/pose_ensembles/storage.py
          src/opendde_workbench/research/graph_records.py
          tests/test_defined_pose_regions.py tests/test_defined_site_api.py
