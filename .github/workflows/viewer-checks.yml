name: Molecular preview and ensemble checks
on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/src/viewer/**"
      - "frontend/src/poses/PoseResults*"
      - "frontend/src/poses/PoseList*"
      - "frontend/src/poses/PoseOutcomeList*"
      - "frontend/src/poses/PoseDetail*"
      - "frontend/src/receptors/ReceptorResults*"
      - "frontend/src/receptors/ReceptorMember*"
      - "frontend/src/receptors/receptors.css"
      - "frontend/src/presentation/ensemble-results.css"
      - "frontend/src/diffsbdd/ScientificDetails*"
      - "frontend/src/diffsbdd/InteractionResults*"
      - "frontend/src/diffsbdd/interaction-results.css"
      - "frontend/src/diffsbdd/diffsbdd.css"
      - "server_tests/test_ensemble_results_browser.py"
      - "server_tests/test_context_camera_browser.py"
      - "server_tests/ensemble_browser_helpers.py"
      - "server_tests/prepare_visual_components.py"
      - "frontend/src/docking/poseScore*"
      - "frontend/src/docking/DockingResults*"
      - "frontend/src/docking/types.ts"
      - "frontend/src/editors/molstar*"
      - "frontend/src/editors/ketcher*"
      - "frontend/src/editors/Editors.tsx"
      - "frontend/src/editors/scientificEditor*"
      - "frontend/src/regions/AtomSelection.tsx"
      - "frontend/src/regions/RegionResult.tsx"
      # Print export and shared entry motion use publication-checks.yml.
      - "!frontend/src/viewer/StructureViewer.tsx"
      - "!frontend/src/viewer/StructureViewer.test.tsx"
      - "!frontend/src/viewer/capture.test.ts"
      - "!frontend/src/viewer/capture.ts"
      - "!frontend/src/viewer/contact-labels.ts"
      - "!frontend/src/viewer/contact-labels.test.ts"
      - "!frontend/src/viewer/viewer.css"
      - "!frontend/src/viewer/frame.ts"
      - "!frontend/src/viewer/useViewerSnapshot.test.ts"
      - "!frontend/src/viewer/useViewerSnapshot.ts"
      # Shared interactive charts and appearance use chart-quality-checks.yml.
      - "!frontend/src/viewer/appearance.ts"
      - "!frontend/src/viewer/scene.ts"
      - "!frontend/src/datasets/PlotFrame.tsx"
      - "!frontend/src/datasets/DatasetHeatmaps.tsx"
      - "!frontend/src/viewer/style.ts"
      - "!frontend/src/viewer/style.test.ts"
      # Native stick geometry and its editor consumer use simulation-view-checks.yml.
      - "!frontend/src/viewer/molstar-sticks.ts"
      - "!frontend/src/editors/molstar-appearance*"
      # Shared hydrogen display has focused native Ketcher/3D checks.
      - "!frontend/src/viewer/donor-hydrogens*"
      - "!frontend/src/editors/ketcher-hydrogens*"
      - "!frontend/src/editors/Editors.tsx"
      - "!frontend/src/editors/scientificEditor.ts"
      - "!frontend/src/receptors/ReceptorMemberTable.tsx"
      - "!frontend/src/poses/PoseList.tsx"
      # Pocket prototype removal belongs to the focused selection gate.
      - "!frontend/src/viewer/source-depth*"
permissions:
  contents: read
jobs:
  molecular-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WB_AUTO_DEPLOY: "0"
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - uses: astral-sh/setup-uv@v6
      - name: Choose isolated preview state
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-preview" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-preview/state" >> "$GITHUB_ENV"
      - run: uv sync --locked --group dev --group browser
      - name: Verify preview bootstrap freshness and existing origin boundaries
        run: >-
          uv run --locked --group dev pytest -q
          tests/test_api_security.py::test_ui_bootstrap_is_not_stored_across_releases
          tests/test_api_security.py::test_csrf_origin_and_host_boundaries
      - name: Verify source atom maps, viewer messages and selection controls
        working-directory: frontend
        run: >-
          npx vitest run src/viewer/atom-region.test.ts src/viewer/channel-geometry.test.ts
          src/viewer/attachment-geometry.test.ts
          src/viewer/donor-hydrogens.test.ts
          src/viewer/StructureViewer.test.tsx src/viewer/geometry.test.ts src/viewer/initial-geometry.test.ts
          src/viewer/ViewerControls.test.tsx src/viewer/style.test.ts
          src/viewer/contacts.test.ts src/viewer/source-layout.test.ts src/viewer/focus-layout.test.ts
          src/viewer/charge-surface.test.ts src/viewer/SurfaceLegend.test.tsx
          src/viewer/InteractionControls.test.tsx src/viewer/PoseScore.test.tsx
          src/docking/poseScore.test.ts src/docking/DockingResults.test.tsx
          src/editors/molstar-appearance.test.ts src/editors/ketcher-appearance.test.ts
          src/editors/scientificEditor.test.ts
          src/viewer/capture.test.ts
          src/viewer/context-focus.test.ts src/viewer/camera-resize.test.ts
          src/poses/PoseResults.test.tsx src/receptors/ReceptorResults.test.tsx
          src/poses/PoseWorkspace.test.tsx src/poses/PoseScoreComparison.test.tsx
          src/operations/OperationResults.test.tsx src/examples/ExampleJobResult.test.tsx
          src/viewer/contact-label-layout.test.ts src/viewer/contact-labels.test.ts
          src/viewer/native-contact-labels.test.ts
          src/diffsbdd/InteractionResults.test.tsx src/diffsbdd/DiffResults.test.tsx
      - name: Restore exact native cases and graphical editor without inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
          .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          .venv/bin/python server_tests/prepare_visual_components.py --components ketcher public-pose-examples
      - name: Native paired results and residue camera in Chromium
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/ensemble
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/ensemble/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null
          .venv/bin/python -m pytest -q server_tests/test_ensemble_results_browser.py server_tests/test_context_camera_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ensemble-preview-evidence
          path: server_tests/evidence/ensemble
          if-no-files-found: error
