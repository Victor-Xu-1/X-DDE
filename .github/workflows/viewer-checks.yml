name: Molecular preview checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/src/viewer/**'
      - 'frontend/src/docking/poseScore*'
      - 'frontend/src/docking/DockingResults*'
      - 'frontend/src/docking/types.ts'
      - 'frontend/src/editors/molstar*'
      - 'frontend/src/editors/ketcher*'
      - 'frontend/src/editors/Editors.tsx'
      - 'frontend/src/editors/scientificEditor*'
      - 'frontend/src/regions/AtomSelection.tsx'
      - 'frontend/src/regions/RegionResult.tsx'
      - '.github/workflows/viewer-checks.yml'
permissions:
  contents: read
jobs:
  molecular-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - uses: astral-sh/setup-uv@v6
      - name: Verify preview bootstrap freshness and existing origin boundaries
        run: >-
          uv run --locked --group dev pytest -q
          tests/test_api_security.py::test_ui_bootstrap_is_not_stored_across_releases
          tests/test_api_security.py::test_csrf_origin_and_host_boundaries
      - name: Verify source atom maps, viewer messages and selection controls
        working-directory: frontend
        run: >-
          npx vitest run src/viewer/atom-region.test.ts
          src/viewer/StructureViewer.test.tsx src/viewer/geometry.test.ts
          src/viewer/ViewerControls.test.tsx src/viewer/style.test.ts
          src/viewer/contacts.test.ts src/viewer/source-layout.test.ts
          src/viewer/charge-surface.test.ts src/viewer/SurfaceLegend.test.tsx
          src/viewer/InteractionControls.test.tsx src/viewer/PoseScore.test.tsx
          src/docking/poseScore.test.ts src/docking/DockingResults.test.tsx
          src/editors/molstar-appearance.test.ts src/editors/ketcher-appearance.test.ts
          src/editors/scientificEditor.test.ts
          src/viewer/capture.test.ts
