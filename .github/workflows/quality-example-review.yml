name: Evidence-derived quality example review
on:
  pull_request:
    paths: &review_paths
      - 'src/opendde_workbench/examples/quality_review.py'
      - 'src/opendde_workbench/examples/routes.py'
      - 'tests/test_example_quality_review.py'
      - '.github/workflows/quality-example-review.yml'
  push:
    paths: *review_paths
permissions:
  contents: read
jobs:
  quality-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-install-project --group dev
      - run: uv run --no-sync ruff check src/opendde_workbench/examples/quality_review.py src/opendde_workbench/examples/routes.py tests/test_example_quality_review.py
      - run: PYTHONPATH=src uv run --no-sync python -m pytest -q tests/test_example_quality_review.py
