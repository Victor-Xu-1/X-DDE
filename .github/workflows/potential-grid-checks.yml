name: Native APBS potential grid parsing
on:
  push:
    paths: &potential_paths
      - 'frontend/src/viewer/scientific-data.ts'
      - 'frontend/src/viewer/scientific-overlay.ts'
      - 'frontend/src/viewer/scientific-overlay.test.ts'
      - 'server_tests/test_potential_sdk_browser.py'
      - 'frontend/src/viewer/potential-range.ts'
      - 'server_tests/test_apbs_range_browser.py'
      - '.github/workflows/potential-grid-checks.yml'
  pull_request:
    paths: *potential_paths
permissions:
  contents: read
jobs:
  potential-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - working-directory: frontend
        run: >-
          npx vitest run src/viewer/scientific-overlay.test.ts src/viewer/source-layout.test.ts
          src/viewer/StructureViewer.test.tsx src/viewer/display-readiness.test.ts
          src/publication/FigureExport.test.tsx
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --group browser
      - name: Build the exact production SDK consumer for Chromium
        working-directory: frontend
        run: |
          node --input-type=module - <<'JS'
          import { build } from 'vite';
          import path from 'node:path';
          await build({configFile:false,build:{outDir:process.env.RUNNER_TEMP+'/potential-sdk',
            lib:{entry:path.resolve('src/viewer/scientific-overlay.ts'),name:'XDDEPotential',
              formats:['iife'],fileName:()=> 'sdk.js'}}});
          JS
      - name: Real native volume parser, without scientific execution
        env:
          WB_POTENTIAL_SDK: ${{ runner.temp }}/potential-sdk/sdk.js
        run: |
          google-chrome --version
          .venv/bin/python -m pytest -x -q server_tests/test_potential_sdk_browser.py tests/test_molecular_utility_scope.py
      - name: Retained STAT6 surface, camera continuity and original APBS files
        env:
          GH_TOKEN: ${{ github.token }}
          WB_HOME: ${{ runner.temp }}/x-dde-apbs
          WB_STATE_DIR: ${{ runner.temp }}/x-dde-apbs/state
        run: |
          readarray -t source < <(.venv/bin/python -c 'from opendde_workbench.examples.stat6_bundle_release import URL; print("\n".join(URL.rsplit("/", 2)[-2:]))')
          test "${#source[@]}" -eq 2
          gh release download "${source[0]}" --repo "$GITHUB_REPOSITORY" --pattern "${source[1]}" --dir "$RUNNER_TEMP"
          .venv/bin/python server_tests/prepare_reviewed_stat6_cases.py "$RUNNER_TEMP/${source[1]}"
          uv run --locked ruff check scripts/molecular-utility-scope.py server_tests/test_apbs_range_browser.py
          .venv/bin/python -m pytest -x -q server_tests/test_apbs_range_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apbs-range-evidence
          path: outputs/apbs-range/
