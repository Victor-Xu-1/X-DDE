name: Exact molecular property preview checks
on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/src/operations/PropertyResults*"
      - "frontend/src/operations/property-source*"
      - "server_tests/prepare_property_preview_case.py"
      - "server_tests/test_property_preview_browser.py"
      - ".github/workflows/property-preview-checks.yml"
permissions:
  contents: read
jobs:
  property-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WB_AUTO_DEPLOY: "0"
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Only the changed file identity, selection and pose consumers
        working-directory: frontend
        run: npx vitest run src/operations/PropertyResults.test.tsx src/operations/property-source.test.ts src/viewer/PoseSession.test.tsx src/viewer/donor-hydrogens.test.ts
      - name: One bounded native descriptor result from the two actual STAT6 input files
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-properties" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-properties/state" >> "$GITHUB_ENV"
      - run: uv run --locked python server_tests/prepare_property_preview_case.py
      - run: uv run --locked python server_tests/prepare_visual_components.py --components ketcher
      - name: Native calculated 2D and 3D, both source files and both languages
        run: |
          uv run --locked playwright install --with-deps chromium
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/property-preview/service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/session" > /dev/null && break; sleep 1; done
          .venv/bin/python -m pytest -x -q server_tests/test_property_preview_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-property-preview-evidence
          path: server_tests/evidence/property-preview
