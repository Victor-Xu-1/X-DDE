name: Native reference pocket result checks
on:
  push:
    paths: &reference_paths
      - "frontend/src/diffsbdd/ReferencePocketResults*"
      - "frontend/src/diffsbdd/reference-pocket*"
      - "frontend/src/diffsbdd/ScientificDetails.tsx"
      - "frontend/src/diffsbdd/DiffResults*"
      - "frontend/src/viewer/scene.ts"
      - "frontend/src/viewer/style.test.ts"
      - "server_tests/test_reference_pocket_browser.py"
      - ".github/workflows/reference-pocket-checks.yml"
  pull_request:
    paths: *reference_paths
permissions:
  contents: read
jobs:
  reference-pocket:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WB_AUTO_DEPLOY: "0"
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - working-directory: frontend
        run: npx vitest run src/diffsbdd/reference-pocket.test.ts src/diffsbdd/DiffResults.test.tsx src/viewer/residue-region.test.ts src/viewer/style.test.ts src/viewer/StructureViewer.test.tsx
      - run: uv run --locked ruff check server_tests/test_reference_pocket_browser.py
      - name: Restore only reviewed native evidence, with no scientific execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export WB_HOME="$RUNNER_TEMP/x-dde-reference-pocket"
          export WB_STATE_DIR="$WB_HOME/state"
          echo "WB_HOME=$WB_HOME" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$WB_STATE_DIR" >> "$GITHUB_ENV"
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
          .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
      - name: Native single view and residue identities, English desktop and Chinese mobile
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/reference-pocket
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/reference-pocket/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" >/dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" >/dev/null
          .venv/bin/python -m pytest -x -q server_tests/test_reference_pocket_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-pocket-evidence
          path: server_tests/evidence/reference-pocket
