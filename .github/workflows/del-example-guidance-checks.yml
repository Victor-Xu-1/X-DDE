name: DEL study guidance and archive scoped checks
on:
  push:
    paths: &del_guidance_paths
      - 'src/opendde_workbench/examples/del6/guidance.py'
      - 'src/opendde_workbench/examples/del6/stage_hints.py'
      - 'src/opendde_workbench/examples/del6/current-inputs.json'
      - 'src/opendde_workbench/examples/del6/compatibility.py'
      - 'src/opendde_workbench/examples/del6/catalogue-profiles.json'
      - 'src/opendde_workbench/examples/del6/manifest-v1.json'
      - 'src/opendde_workbench/examples/catalogue_profiles.py'
      - 'tests/test_del_current_examples.py'
      - 'tests/test_del_bundle_compatibility.py'
      - '.github/workflows/del-example-guidance-checks.yml'
  pull_request:
    paths: *del_guidance_paths
permissions:
  contents: read
jobs:
  del-guidance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WB_AUTO_DEPLOY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Build the required packaged frontend
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Fetch the exact previously published DEL Data1 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.6.29 --repo "$GITHUB_REPOSITORY" --pattern del6-reviewed-results-v1.zip --dir "$RUNNER_TEMP"
      - name: Check DEL evidence scope, cohort metadata and sealed replay only
        env:
          WB_REVIEWED_DEL_DATA1: ${{ runner.temp }}/del6-reviewed-results-v1.zip
        run: >-
          uv run --locked pytest -q
          tests/test_del_current_examples.py tests/test_del_bundle_compatibility.py
          tests/test_stat6_source_revisions.py::test_published_study_profiles_keep_their_exact_historical_sources
          tests/test_stat6_source_revisions.py::test_modified_historical_manifest_is_rejected_before_it_can_admit_a_bundle
          tests/test_stat6_case_bundle.py::test_current_study_roundtrip_preserves_reviews_and_excludes_history
          tests/test_stat6_case_bundle.py::test_current_study_identity_and_declared_scope_are_not_replaceable
