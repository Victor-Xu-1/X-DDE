name: Native resource scope checks
on:
  workflow_dispatch:
    inputs:
      opendde_limits_only:
        description: Check the OpenDDE container boundary without unrelated model inference
        type: boolean
        default: false
  workflow_call:
    inputs:
      opendde_limits_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  resource-lifecycle:
    if: ${{ !inputs.opendde_limits_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Owned resource policies, admission and related existing process contracts
        run: >-
          uv run --locked pytest -q tests/test_local_scope.py tests/test_local_process.py
          tests/test_environment_roles.py tests/test_diffsbdd_contract.py tests/test_dataset_worker.py
      - name: Prepare only the ephemeral runner user's resource manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          test -S "/run/user/$(id -u)/bus"
      - name: Actual cgroup memory cap, detached-child cancellation, recovery and wall time
        env:
          WB_NATIVE_LOCAL_SCOPE: "1"
        run: >-
          uv run --locked pytest -x -q server_tests/test_local_resource_scopes.py
          --basetemp "$RUNNER_TEMP/x-dde-scope-fixtures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-resource-scope-evidence
          path: |
            server_tests/evidence/local-resource-scopes
            ${{ runner.temp }}/x-dde-scope-fixtures/**/scope-ready.json
            ${{ runner.temp }}/x-dde-scope-fixtures/**/scope-exit.json
            ${{ runner.temp }}/x-dde-scope-fixtures/**/scope-cleanup.json
            ${{ runner.temp }}/x-dde-scope-fixtures/**/scope-launch-closed.json
            ${{ runner.temp }}/x-dde-scope-fixtures/**/scope-launch.log
          if-no-files-found: warn
  opendde-container-limits:
    if: ${{ inputs.opendde_limits_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Resource admission, configured settings and directly affected consumers
        run: |
          uv run --locked ruff check src/opendde_workbench/opendde_limits.py src/opendde_workbench/engine.py src/opendde_workbench/settings.py src/opendde_workbench/execution_environment.py tests/test_opendde_limits.py server_tests/test_opendde_limits.py
          uv run --locked python -m pytest -q tests/test_opendde_limits.py tests/test_native_resources.py tests/test_environment_roles.py tests/test_interpreter_paths.py tests/test_operations.py
      - name: Pull the existing digest-pinned small probe image
        run: |
          image=$(uv run --locked python -c 'from opendde_workbench.chemistry.image import PYTHON_IMAGE; print(PYTHON_IMAGE)')
          docker pull "$image"
      - name: Actual kernel memory, no-swap, CPU and PID caps plus isolated OOM
        run: uv run --locked python -m pytest -x -q server_tests/test_opendde_limits.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opendde-resource-limit-evidence
          path: server_tests/evidence/opendde-limits
          if-no-files-found: warn
