name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Web dependencies and checks
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Backend dependencies and checks
        run: |
          uv sync --locked --group dev
          uv run --locked ruff check src tests server_tests
          uv run --locked pytest -q
      - name: Build installable wheel
        run: |
          uv build --wheel
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          with ZipFile(glob('dist/*.whl')[0]) as wheel:
              files = set(wheel.namelist())
          assert 'opendde_workbench/web/index.html' in files
          assert 'opendde_workbench/web/viewer.html' in files
          assert any('/assets/viewer-' in path and path.endswith('.js') for path in files)
          PY

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows launcher and WSL arguments
        shell: pwsh
        run: ./tests/test_windows_installer.ps1

  scientific-handoffs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Real chemical parser and selected-version handoff (remote CPU only)
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-project --python 3.10
          --with pytest==9.1.1 --with numpy==1.26.4 --with rdkit==2023.9.6
          python -m pytest -q server_tests/test_scientific_handoff.py
