name: Docking result presentation scope
on:
  workflow_call:
    outputs:
      presentation_only:
        value: ${{ jobs.scope.outputs.presentation_only }}
      desktop_layout_only:
        value: ${{ jobs.scope.outputs.desktop_layout_only }}
      paired_comparison_only:
        value: ${{ jobs.scope.outputs.paired_comparison_only }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      presentation_only: ${{ steps.paths.outputs.presentation_only }}
      desktop_layout_only: ${{ steps.paths.outputs.desktop_layout_only }}
      paired_comparison_only: ${{ steps.paths.outputs.paired_comparison_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/docking-result-scope.py
