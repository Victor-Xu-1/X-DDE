name: Docking result presentation scope
on:
  workflow_call:
    outputs:
      presentation_only:
        value: ${{ jobs.scope.outputs.presentation_only }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      presentation_only: ${{ steps.paths.outputs.presentation_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo 'presentation_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" != main || ! "$BASE" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base HEAD origin/main)
          fi
          only=true
          layout=false
          while IFS= read -r file; do
            case "$file" in
              frontend/src/docking/DockingResults.css) layout=true ;;
              frontend/src/docking/DockingResults.tsx|frontend/src/docking/DockingResults.test.tsx) ;;
              .github/workflows/docking-result-scope.yml|.github/workflows/pose-handoff-checks.yml|.github/workflows/selected-pose-checks.yml|.github/workflows/result-handoff-checks.yml) ;;
              pyproject.toml|uv.lock|frontend/package.json|frontend/package-lock.json|install.sh|install.ps1) ;;
              *) only=false ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          [[ "$layout" == true ]] || only=false
          echo "presentation_only=$only" >> "$GITHUB_OUTPUT"
