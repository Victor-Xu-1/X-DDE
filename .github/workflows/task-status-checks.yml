name: Live task status fault checks
on:
  push:
    paths: &status_paths
      - "frontend/src/App*.tsx"
      - "frontend/src/useWorkbench*"
      - "frontend/src/workbench-polling*"
      - "frontend/src/WorkbenchReadStatus*"
      - "server_tests/test_task_status_browser.py"
      - ".github/workflows/task-status-checks.yml"
  pull_request:
    paths: *status_paths
permissions:
  contents: read
jobs:
  task-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Independent read deadlines, races and direct consumers only
        working-directory: frontend
        run: >-
          npx vitest run src/workbench-polling.test.ts
          src/useWorkbench.test.ts src/useWorkbench.live.test.ts
          src/App.test.tsx src/App.live-status.test.tsx
          src/studio/TaskWorkspace.test.tsx src/studio/useTaskHistory.test.tsx
          src/TaskDetail.test.tsx src/TaskDetail.actions.test.tsx
          src/studio/HomeWorkspace.test.tsx src/studio/PredictionResults.test.tsx
      - name: Static checks and Chromium installation
        run: |
          uv run --locked ruff check server_tests/test_task_status_browser.py
          uv run --locked playwright install chromium --with-deps
      - name: Bilingual desktop/mobile health outage, artifact deadline, disconnection and selection cancellation
        run: |
          mkdir -p server_tests/evidence/task-status
          .venv/bin/python -m http.server 4330 --bind 127.0.0.1 --directory src/opendde_workbench/web > server_tests/evidence/task-status/service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/" >/dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/" >/dev/null
          .venv/bin/python -m pytest -x -q server_tests/test_task_status_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-status-fault-evidence
          path: server_tests/evidence/task-status
          if-no-files-found: warn
