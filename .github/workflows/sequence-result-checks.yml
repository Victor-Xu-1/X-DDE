name: Sequence and pose-quality result checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/src/presentation/SequenceTrack*'
      - 'frontend/src/presentation/sequence-track.css'
      - 'frontend/src/presentation/result-inspection.css'
      - 'frontend/src/operations/SequenceScoreResults*'
      - 'frontend/src/operations/sequence-scores.css'
      - 'frontend/src/antibodies/AntibodyNumberResults*'
      - 'frontend/src/antibodies/AntibodyDomainDetail*'
      - 'frontend/src/antibodies/AntibodyNumberingTable*'
      - 'frontend/src/antibodies/antibodies.css'
      - 'frontend/src/humanization/HumanizationResults*'
      - 'frontend/src/humanization/SequenceAlignment*'
      - 'frontend/src/humanization/SequenceComparison*'
      - 'frontend/src/humanization/ReferenceMetrics*'
      - 'frontend/src/humanization/humanization.css'
      - 'frontend/src/humanization/sequence-alignment.css'
      - 'frontend/src/quality/QualityResults*'
      - 'frontend/src/quality/QualityCheckList*'
      - 'frontend/src/quality/quality-results.css'
      - 'frontend/src/quality/tests/QualityResults.test.tsx'
      - 'server_tests/test_sequence_results_browser.py'
      - '.github/workflows/sequence-result-checks.yml'
permissions:
  contents: read
jobs:
  result-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WB_AUTO_DEPLOY: '0'
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Verify result interactions and direct sequence-view consumers
        working-directory: frontend
        run: >-
          npx vitest run
          src/presentation/SequenceTrack.test.tsx
          src/operations/SequenceScoreResults.test.tsx
          src/antibodies/AntibodyNumberResults.test.tsx
          src/humanization/HumanizationResults.test.tsx
          src/quality/tests/QualityResults.test.tsx
          src/operations/HarnessResults.test.tsx
          src/operations/PreparedInputResults.test.tsx
          src/operations/CandidateSequenceResults.test.tsx
          src/examples/CampaignCasePreview.test.tsx
          src/operations/OperationResults.test.tsx
          src/presentation/ResearchTable.test.tsx
          src/presentation/MetricScatter.test.tsx
      - name: Restore reviewed native public cases without inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-sequence-results" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-sequence-results/state" >> "$GITHUB_ENV"
          uv sync --locked --group dev --group browser
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
      - name: Native sequence, antibody and quality results in Chromium
        run: |
          .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/sequence-results
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/sequence-results/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null
          .venv/bin/python -m pytest -q server_tests/test_sequence_results_browser.py server_tests/test_protein_results_browser.py::test_campaign_template_previews_exact_inputs_without_generating_a_design
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sequence-result-evidence
          path: |
            server_tests/evidence/sequence-results
            server_tests/evidence/task-layout/campaign*
          if-no-files-found: error
