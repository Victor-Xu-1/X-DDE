name: Sequence and pose-quality result checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &sequence_result_paths
      - "frontend/src/presentation/SequenceTrack*"
      - "frontend/src/presentation/SequencePositions*"
      - "frontend/src/presentation/sequence-track.css"
      - "frontend/src/presentation/result-inspection.css"
      - "frontend/src/operations/SequenceScoreResults*"
      - "frontend/src/operations/PreparedInputResults*"
      - "frontend/src/operations/prepared-input-*.ts"
      - "frontend/src/operations/prepared-input-results.css"
      - "frontend/src/operations/usePreparedDocuments.ts"
      - "server_tests/test_prepared_input_workspace_browser.py"
      - "scripts/prepared-input-scope.py"
      - "frontend/src/operations/sequence-scores.css"
      - "frontend/src/antibodies/AntibodyNumberResults*"
      - "frontend/src/antibodies/AntibodyDomainDetail*"
      - "frontend/src/antibodies/AntibodyNumberingTable*"
      - "frontend/src/antibodies/antibodies.css"
      - "frontend/src/humanization/HumanizationResults*"
      - "frontend/src/humanization/SequenceAlignment*"
      - "frontend/src/humanization/SequenceComparison*"
      - "frontend/src/humanization/ReferenceMetrics*"
      - "frontend/src/humanization/humanization.css"
      - "frontend/src/humanization/sequence-alignment.css"
      - "frontend/src/quality/QualityResults*"
      - "frontend/src/quality/QualityPreview.tsx"
      - "frontend/src/quality/QualityCheckList*"
      - "frontend/src/quality/QualityAssessmentBar.tsx"
      - "frontend/src/quality/quality-results.css"
      - "frontend/src/quality/tests/QualityResults.test.tsx"
      - "frontend/src/quality/tests/QualityAssessment.test.tsx"
      - "frontend/src/quality/assessment.ts"
      - "frontend/src/quality/labels.ts"
      - "server_tests/prepare_quality_context_cases.py"
      - "server_tests/test_quality_context_browser.py"
      - "tests/test_pose_quality.py"
      - "server_tests/test_sequence_results_browser.py"
      - "server_tests/test_campaign_sequence_browser.py"
      - "server_tests/test_humanization_details_browser.py"
      - ".github/workflows/sequence-result-checks.yml"
  pull_request:
    paths: *sequence_result_paths
permissions:
  contents: read
jobs:
  utility-scope:
    uses: ./.github/workflows/molecular-utility-checks.yml
    with:
      scope_only: true
  workflow-scope:
    runs-on: ubuntu-24.04
    outputs:
      workflow_only: ${{ steps.scope.outputs.workflow_only }}
      prepared_inputs: ${{ steps.preparation.outputs.prepared_inputs }}
      prepared_inputs_only: ${{ steps.preparation.outputs.prepared_inputs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/workflow-quality-scope.py
      - id: preparation
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/prepared-input-scope.py
  prepared-inputs:
    needs: workflow-scope
    if: needs.workflow-scope.outputs.prepared_inputs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WB_AUTO_DEPLOY: "0"
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - working-directory: frontend
        run: npx vitest run src/operations/PreparedInputResults.test.tsx src/operations/OperationResults.test.tsx
      - name: Restore sealed input results without running any engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export WB_HOME="$RUNNER_TEMP/x-dde-prepared-inputs"
          export WB_STATE_DIR="$WB_HOME/state"
          echo "WB_HOME=$WB_HOME" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$WB_STATE_DIR" >> "$GITHUB_ENV"
          uv sync --locked --group dev --group browser
          version=$(.venv/bin/python -c 'from opendde_workbench.examples.stat6_bundle_release import VERSION; print(VERSION)')
          gh release download examples-v2 --pattern "stat6-reviewed-results-v${version}.zip" --dir "$RUNNER_TEMP"
          .venv/bin/python -c 'import os; from pathlib import Path; from opendde_workbench.examples.bundle import restore_bundle; from opendde_workbench.examples.stat6_bundle_release import SHA256, VERSION; from opendde_workbench.settings import Settings; print(restore_bundle(Path(os.environ["RUNNER_TEMP"])/f"stat6-reviewed-results-v{VERSION}.zip", Settings.from_env(), SHA256))'
      - name: Preview native materials and verify original JSON and FASTA
        run: |
          uv run --locked ruff check scripts/prepared-input-scope.py server_tests/test_prepared_input_workspace_browser.py
          google-chrome --version
          mkdir -p server_tests/evidence/prepared-inputs
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/prepared-inputs/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null
          .venv/bin/python -m pytest -q server_tests/test_prepared_input_workspace_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-input-workspace-evidence
          path: server_tests/evidence/prepared-inputs
  result-inspection:
    needs: [workflow-scope, utility-scope]
    if: >-
      needs.workflow-scope.outputs.prepared_inputs_only != 'true' &&
      needs.utility-scope.outputs.runtime_switch_only != 'true' &&
      needs.utility-scope.outputs.sequence_desktop_only != 'true' &&
      needs.utility-scope.outputs.spatial_review_only != 'true' &&
      needs.workflow-scope.outputs.workflow_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WB_AUTO_DEPLOY: "0"
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select only the changed result family
        id: scope
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os, subprocess
          from runpy import run_path
          base = os.environ.get("BASE_REVISION", "")
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines()) if base and set(base) != {"0"} else set()
          mirrors = {"pyproject.toml", "uv.lock", "frontend/package.json", "frontend/package-lock.json", "install.sh", "install.ps1"}
          own_checks = {"server_tests/test_humanization_details_browser.py", ".github/workflows/sequence-result-checks.yml"}
          only = bool(changed) and any(p.startswith("frontend/src/humanization/") for p in changed) and all(p.startswith("frontend/src/humanization/") or p in mirrors | own_checks for p in changed)
          quality_checks = {"server_tests/prepare_quality_context_cases.py", "server_tests/test_quality_context_browser.py", "tests/test_pose_quality.py", "docs/frontend-layout.md", ".github/workflows/sequence-result-checks.yml", ".github/workflows/structure-layout-checks.yml", ".github/workflows/user-interface-checks.yml", ".github/workflows/task-layout-checks.yml"}
          quality_checks.update({
              ".github/workflows/reference-input-checks.yml",
              "scripts/pose-quality-scope.py",
              "frontend/src/presentation/structure-workbench.css",
              "frontend/src/presentation/candidate-review-bar.css",
              "server_tests/reviewed_batch_preview.py", "server_tests/test_sequence_results_browser.py",
          })
          only_quality = (any(p.startswith("frontend/src/quality/") for p in changed)
                          and all(p.startswith("frontend/src/quality/") or p in mirrors | quality_checks for p in changed)
                          and run_path("scripts/pose-quality-scope.py")["reviewed_workflow_changes"](base, changed)
                          and run_path("scripts/docking-result-scope.py")["only_version_mirrors"](base, changed & mirrors))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("only_humanization=" + str(only).lower() + "\n")
              f.write("only_quality=" + str(only_quality).lower() + "\n")
          print("Pose-quality assessment only" if only_quality else "Human reference results only" if only else "Shared sequence-view consumers")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Verify result interactions and direct sequence-view consumers
        if: steps.scope.outputs.only_humanization != 'true' && steps.scope.outputs.only_quality != 'true'
        working-directory: frontend
        run: >-
          npx vitest run
          src/presentation/SequenceTrack.test.tsx
          src/operations/SequenceScoreResults.test.tsx
          src/antibodies/AntibodyNumberResults.test.tsx
          src/humanization/HumanizationResults.test.tsx
          src/quality/tests/QualityResults.test.tsx
          src/operations/HarnessResults.test.tsx
          src/operations/PreparedInputResults.test.tsx
          src/operations/CandidateSequenceResults.test.tsx
          src/examples/CampaignCasePreview.test.tsx
          src/operations/OperationResults.test.tsx
          src/presentation/ResearchTable.test.tsx
          src/presentation/MetricScatter.test.tsx
          src/humanization/ReferenceMetricsDetails.test.tsx
      - name: Native quality flags, actual measurement scope and direct result consumers
        if: steps.scope.outputs.only_quality == 'true'
        id: quality_unit
        continue-on-error: true
        working-directory: frontend
        run: npx vitest run src/quality/tests/QualityAssessment.test.tsx src/quality/tests/QualityResults.test.tsx src/quality/QualityReview.test.tsx src/operations/OperationResults.test.tsx
      - name: Native probabilities, linked residue positions and full-precision exports
        if: steps.scope.outputs.only_humanization == 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/humanization/ReferenceMetricsDetails.test.tsx
          src/humanization/HumanizationResults.test.tsx
          src/presentation/ResearchTable.test.tsx src/presentation/plots/InteractivePlot.test.tsx
      - name: Restore reviewed native public cases without inference
        if: steps.scope.outputs.only_quality != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-sequence-results" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-sequence-results/state" >> "$GITHUB_ENV"
          uv sync --locked --group dev --group browser
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
      - name: Native sequence, antibody and quality results in Chromium
        if: steps.scope.outputs.only_quality != 'true'
        run: |
          .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/sequence-results
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/sequence-results/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null
          if [ '${{ steps.scope.outputs.only_humanization }}' = 'true' ]; then
            .venv/bin/python -m pytest -x -q server_tests/test_humanization_details_browser.py
          else
            .venv/bin/python -m pytest -q server_tests/test_sequence_results_browser.py server_tests/test_campaign_sequence_browser.py server_tests/test_humanization_details_browser.py
          fi
      - name: Real retained STAT6 quality context in desktop English and narrow Chinese
        if: steps.scope.outputs.only_quality == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export WB_HOME="$RUNNER_TEMP/x-dde-quality-context"
          export WB_STATE_DIR="$WB_HOME/state"
          uv sync --locked --group dev --group browser
          uv run --locked ruff check server_tests/prepare_quality_context_cases.py server_tests/test_quality_context_browser.py
          uv run --locked python server_tests/prepare_quality_context_cases.py
          google-chrome --version
          uv run --locked python -m pytest -x -q tests/test_pose_quality.py server_tests/test_quality_context_browser.py
      - name: Require quality component checks after collecting native browser evidence
        if: always() && steps.scope.outputs.only_quality == 'true' && steps.quality_unit.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sequence-result-evidence
          path: |
            server_tests/evidence/sequence-results
            outputs/quality-context/en
            outputs/quality-context/zh
          if-no-files-found: error
