name: Physical storage capacity checks
on:
  workflow_dispatch:
  push:
    paths: &storage_capacity_paths
      - "src/opendde_workbench/disk_space.py"
      - "src/opendde_workbench/wsl_storage.*"
      - "src/opendde_workbench/wsl_mount.py"
      - "src/opendde_workbench/worker.py"
      - "src/opendde_workbench/asset*routes.py"
      - "src/opendde_workbench/asset_uploads.py"
      - "tests/test_disk_space.py"
      - "tests/test_wsl_mount.py"
      - "tests/test_storage_consumers.py"
      - "tests/test_asset_routes.py"
      - ".github/workflows/storage-capacity-checks.yml"
  pull_request:
    paths: *storage_capacity_paths
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Physical disk, unknown capacity, uploads and owned process protection only
        run: >-
          uv run --locked python -m pytest -q
          tests/test_disk_space.py tests/test_wsl_mount.py
          tests/test_storage_consumers.py tests/test_dataset_uploads.py
          tests/test_asset_routes.py
          tests/test_jobs.py::test_real_process_result_download_and_durable_request
          tests/test_jobs.py::test_running_cancel_stops_process_and_retry_creates_new_task
          tests/test_jobs.py::test_restart_marks_active_tasks_interrupted
          tests/test_jobs.py::test_failure_and_timeout_are_reported
          tests/test_deployment.py::test_uninstall_removes_only_owned_package_and_retains_models
      - name: Nullable capacity presentation and direct task status consumers
        working-directory: frontend
        run: npx vitest run src/studio/RuntimeStatus.test.tsx
