name: Installation checks
on:
  push:
    paths:
      - 'src/opendde_workbench/deployment/**'
      - 'frontend/src/deployment/**'
      # UI composition does not change native installation; use the component presentation gate.
      - '!frontend/src/deployment/ComponentLibrary*'
      - '!frontend/src/deployment/ComponentCard.tsx'
      - '!frontend/src/deployment/component-groups*'
      - '!frontend/src/deployment/component-content.ts'
      - '!frontend/src/deployment/components.css'
      - 'tests/test_deployment.py'
      - 'tests/test_install_network.py'
      - 'tests/test_native_resources.py'
      - 'src/opendde_workbench/engine.py'
      - '.github/workflows/installation-checks.yml'
  pull_request:
    paths:
      - 'src/opendde_workbench/deployment/**'
      - 'frontend/src/deployment/**'
      # UI composition does not change native installation; use the component presentation gate.
      - '!frontend/src/deployment/ComponentLibrary*'
      - '!frontend/src/deployment/ComponentCard.tsx'
      - '!frontend/src/deployment/component-groups*'
      - '!frontend/src/deployment/component-content.ts'
      - '!frontend/src/deployment/components.css'
      - 'tests/test_deployment.py'
      - 'tests/test_install_network.py'
      - 'tests/test_native_resources.py'
      - 'src/opendde_workbench/engine.py'
      - '.github/workflows/installation-checks.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted Linux runner for the focused installer checks
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, ubuntu-22.04]
jobs:
  deployment:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Build web assets required by the installable platform package
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Check installation activity and component controls
        working-directory: frontend
        run: npx vitest run src/deployment/DeploymentActivity.test.tsx src/deployment/deployment.test.tsx src/deployment/component-groups.test.ts src/deployment/installation.test.ts src/deployment/ComputeServicePanel.test.tsx
      - name: Check changed installer and related deployment behavior
        run: |
          uv sync --locked --group dev
          uv run --locked ruff check src/opendde_workbench/deployment/network.py src/opendde_workbench/deployment/process.py src/opendde_workbench/deployment/storage.py src/opendde_workbench/deployment/manager.py tests/test_install_network.py tests/test_deployment.py
          uv run --locked pytest -q tests/test_install_network.py tests/test_deployment.py tests/test_native_resources.py tests/test_scientific_archives.py
