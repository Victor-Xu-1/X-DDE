name: Surface exposure scoped checks
on:
  push:
    paths:
      - 'src/opendde_workbench/receptors/*surface*'
      - 'frontend/src/receptors/*Surface*'
      - 'frontend/src/receptors/surface*'
      - 'tests/test_surface_exposure.py'
      - 'server_tests/test_surface_science.py'
      - 'server_tests/test_native_surface.py'
      - 'server_tests/test_surface_browser.py'
      - '.github/workflows/surface-exposure-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  surface-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Surface envelope and direct registry, preparation, queue consumers
        run: |
          uv run --locked ruff check src/opendde_workbench/receptors/surface_contract.py src/opendde_workbench/receptors/surface_options.py src/opendde_workbench/receptors/surface_result.py src/opendde_workbench/receptors/native_surface.py tests/test_surface_exposure.py server_tests/test_surface_science.py server_tests/test_native_surface.py server_tests/test_surface_browser.py
          uv run --locked python scripts/generate-capability-catalog.py --check
          uv run --locked pytest -q tests/test_surface_exposure.py tests/test_method_choices.py tests/test_structure_preparation.py tests/test_receptor_contract.py tests/test_capabilities.py tests/test_native_contract.py tests/test_examples.py tests/test_example_pins.py tests/test_case_bundle.py tests/test_dataset_examples.py
      - name: Focused exposure questionnaire and direct preparation/entry consumers
        working-directory: frontend
        run: npx vitest run src/receptors/SurfaceForm.test.tsx src/receptors/StructurePrepareForm.test.tsx src/studio/BindingEntryDialog.test.tsx src/studio/MethodSwitch.test.tsx src/studio/research-modules.test.ts
  surface-native:
    needs: surface-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WB_AUTO_DEPLOY: '0'
      WB_TEST_NATIVE_SURFACE: '1'
      WB_SURFACE_BROWSER_URL: http://127.0.0.1:4334
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Isolate this capability's state
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-surface" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-surface/state" >> "$GITHUB_ENV"
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Analytic geometry and independent FreeSASA comparison
        run: uv run --locked --python 3.12 --with biopython==1.88 --with numpy==1.26.4 --with freesasa==2.2.1 pytest -q server_tests/test_surface_science.py
      - name: Actual installation and existing Router/Worker with real BRD4-JQ1
        run: uv run --locked pytest -q server_tests/test_native_surface.py
      - name: Native 3D, table, download and single-question pages in Chromium
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python -m opendde_workbench --port 4334 > server_tests/evidence/surface/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_SURFACE_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          .venv/bin/python -m pytest -q server_tests/test_surface_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-exposure-native-evidence
          path: server_tests/evidence/surface
