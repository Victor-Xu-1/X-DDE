name: Reviewed module example handoff and presentation
on:
  push:
    paths: &module_example_paths
      - 'src/opendde_workbench/examples/stat6/prepared_inputs.py'
      - 'src/opendde_workbench/examples/stat6/preparation.py'
      - 'src/opendde_workbench/examples/stat6/requests.py'
      - 'src/opendde_workbench/examples/stat6/catalogue.py'
      - 'src/opendde_workbench/examples/stat6/guidance.py'
      - 'src/opendde_workbench/examples/stat6_bundle_release.py'
      - 'src/opendde_workbench/examples/bundle.py'
      - 'src/opendde_workbench/examples/bundle_restore.py'
      - 'src/opendde_workbench/examples/bundle_pin_scope.py'
      - 'src/opendde_workbench/examples/bundle_pin_dependencies.py'
      - 'src/opendde_workbench/examples/pins.py'
      - 'src/opendde_workbench/examples/preparation.py'
      - 'src/opendde_workbench/examples/stat6/*_replay.py'
      - 'frontend/src/receptors/SurfaceResults*'
      - 'frontend/src/receptors/SurfaceForm*'
      - 'tests/test_stat6_prepared_handoff.py'
      - 'tests/test_stat6_design_replay.py'
      - 'tests/test_stat6_recipe_replay.py'
      - 'tests/test_example_pins.py'
      - 'frontend/src/examples/useExampleTemplate.ts'
      - 'frontend/src/examples/ExampleActions.test.tsx'
      - 'frontend/src/diffsbdd/DiffTemplateReplay.test.tsx'
      - 'frontend/src/examples/RecipeInputs.test.tsx'
      - 'server_tests/test_surface_region_replay_browser.py'
      - 'server_tests/test_pocket_results_browser.py'
      - 'server_tests/test_generation_case_stages_browser.py'
      - 'server_tests/prepare_quality_context_cases.py'
      - 'tests/test_stat6_case_data.py'
      - 'tests/stat6_original_port_case.py'
      - 'server_tests/test_original_port_case_browser.py'
      - 'tests/stat6_optimization_case.py'
      - 'tests/stat6_comparison_case.py'
      - '.github/workflows/module-example-checks.yml'
  pull_request:
    paths: *module_example_paths
permissions:
  contents: read
jobs:
  module-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WB_AUTO_DEPLOY: '0'
      WB_BROWSER_URL: http://127.0.0.1:4336
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the changed example consumer
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os, subprocess
          base = os.environ.get("BASE", "")
          changed = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines() if base and set(base) != {"0"} else []
          data = {
              "src/opendde_workbench/examples/stat6_bundle_release.py",
              "src/opendde_workbench/examples/bundle.py",
              "src/opendde_workbench/examples/bundle_restore.py",
              "src/opendde_workbench/examples/bundle_pin_scope.py",
              "src/opendde_workbench/examples/bundle_pin_dependencies.py",
              "server_tests/test_generation_case_stages_browser.py",
              "server_tests/prepare_quality_context_cases.py",
              "tests/test_stat6_case_data.py", "tests/test_stat6_recipe_replay.py",
              "tests/stat6_original_port_case.py", "server_tests/test_original_port_case_browser.py",
              "src/opendde_workbench/examples/pins.py",
              "src/opendde_workbench/examples/preparation.py",
              "src/opendde_workbench/examples/stat6/preparation.py",
              "src/opendde_workbench/examples/stat6/design_replay.py",
              "src/opendde_workbench/examples/stat6/request_replay.py",
              "tests/test_stat6_design_replay.py", "tests/test_example_pins.py",
              "tests/test_stat6_prepared_handoff.py",
              "tests/stat6_diversification_case.py",
              "tests/stat6_optimization_case.py",
              "tests/stat6_comparison_case.py",
          }
          companions = {
              "pyproject.toml", "uv.lock", "frontend/package.json", "frontend/package-lock.json",
              "install.sh", "install.ps1", ".github/workflows/module-example-checks.yml",
              ".github/workflows/examples-checks.yml", ".github/workflows/defined-site-checks.yml",
              ".github/workflows/library-screen-checks.yml", "docs/frontend-layout.md",
              "docs/design/research-examples.md",
              "docs/design/reference-conditioned-comparison.md",
              "src/opendde_workbench/space/image.py",
              "src/opendde_workbench/space/native-requirements.in",
              "src/opendde_workbench/space/native-requirements.txt",
              "scripts/generate-channel-lock.py", "tests/test_channel_runtime.py",
              "server_tests/channel_runtime_probe.py", ".github/workflows/space-analysis-checks.yml",
              "docs/design/space-analysis.md",
              "README.md", "README.en.md",
              "tests/test_record_example_supporting.py",
              "frontend/src/examples/useExampleTemplate.ts", "frontend/src/examples/ExampleActions.test.tsx",
              "frontend/src/diffsbdd/DiffForm.tsx", "frontend/src/diffsbdd/DiffTemplateReplay.test.tsx",
              "frontend/src/chemistry/LibraryScreenForm.tsx", "frontend/src/chemistry/LibraryScreenTemplate.test.tsx",
              "frontend/src/pockets/PocketForm.tsx", "frontend/src/chemistry/StateForm.tsx",
              "frontend/src/examples/RecipeInputs.test.tsx",
          }
          only_data = bool(set(changed) & data) and all(path in data | companions for path in changed)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("data_only=" + str(only_data).lower() + "\n")
          print("Reviewed design recipes and case-stage consumers" if only_data else "Changed module-input and surface consumers")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - if: steps.scope.outputs.data_only != 'true'
        run: uv run --locked pytest -q tests/test_stat6_prepared_handoff.py tests/test_stat6_templates.py tests/test_stat6_guidance.py
      - name: Exact authored recipe, integrity and preparation contracts
        if: steps.scope.outputs.data_only == 'true'
        run: uv run --locked pytest -q tests/test_examples.py tests/test_example_pins.py tests/test_stat6_prepared_handoff.py tests/test_stat6_design_replay.py
      - name: Exact published cohort, comparison result and sealed input replay
        if: steps.scope.outputs.data_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path
          from server_tests.prepare_quality_context_cases import download_archive
          archive = download_archive(Path(os.environ['RUNNER_TEMP']) / 'reviewed-stat6-data')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'WB_REVIEWED_STAT6_ARCHIVE={archive}\n')
          PY
      - if: steps.scope.outputs.data_only == 'true'
        run: uv run --locked --with biopython==1.88 --with numpy==1.26.4 pytest -q tests/test_stat6_case_data.py tests/test_stat6_recipe_replay.py
      - working-directory: frontend
        if: steps.scope.outputs.data_only != 'true'
        run: npx vitest run src/receptors/SurfaceResults.test.tsx src/receptors/SurfaceForm.test.tsx src/viewer/StructureViewer.test.tsx src/viewer/residue-region.test.ts
      - name: Retained case-stage navigation and example actions
        if: steps.scope.outputs.data_only == 'true'
        working-directory: frontend
        run: npx vitest run src/examples/ExampleResultSet.test.tsx src/examples/ExampleActions.test.tsx src/examples/RecipeInputs.test.tsx src/diffsbdd/DiffForm.test.tsx src/diffsbdd/DiffTemplateReplay.test.tsx src/pockets/PocketForm.test.tsx src/chemistry/StateForm.test.tsx
      - name: Restore exact reviewed result packages; no scientific workers
        if: steps.scope.outputs.data_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export WB_HOME="$RUNNER_TEMP/x-dde-module-examples"
          export WB_STATE_DIR="$WB_HOME/state"
          echo "WB_HOME=$WB_HOME" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$WB_STATE_DIR" >> "$GITHUB_ENV"
          .venv/bin/python - <<'PY'
          import json, os, subprocess, zipfile
          from pathlib import Path
          from opendde_workbench.examples.bundle import restore_bundle
          from opendde_workbench.examples import bundle_release, stat6_bundle_release, surface_bundle_release
          from opendde_workbench.settings import Settings
          settings = Settings.from_env()
          assert settings.state_dir.is_relative_to(Path(os.environ['RUNNER_TEMP']))
          for spec in (bundle_release, stat6_bundle_release, surface_bundle_release):
              tag, name = spec.URL.rsplit('/', 2)[-2:]
              subprocess.run(['gh', 'release', 'download', tag, '--repo', os.environ['GITHUB_REPOSITORY'], '--pattern', name, '--dir', os.environ['RUNNER_TEMP']], check=True)
              file = Path(os.environ['RUNNER_TEMP']) / name
              print(restore_bundle(file, settings, spec.SHA256))
              if spec is stat6_bundle_release:
                  with zipfile.ZipFile(file) as archive:
                      study_digest = json.loads(archive.read('manifest.json'))['catalogue_sha256']
          from opendde_workbench.assets import AssetStore
          from opendde_workbench.examples.pins import ExamplePins
          from opendde_workbench.examples.records import ExampleRecords
          from opendde_workbench.examples.catalogue_profiles import historical_study_catalogue
          from opendde_workbench.examples.stat6.preparation import prepare_stat6
          from opendde_workbench.research.storage import ScientificStore
          from opendde_workbench.store import Store
          store = Store(settings.state_dir / 'jobs.sqlite3')
          assets = AssetStore(store, settings.state_dir / 'assets')
          modules = historical_study_catalogue(study_digest).modules
          records = ExampleRecords(store, assets, settings, modules=modules)
          pinned = ExamplePins(store, settings.state_dir, modules=modules).get('gnina.dock', verify=True)
          before = len(store.list_jobs())
          prepared = prepare_stat6('gnina.dock', ScientificStore(store, assets), records=records, modules=modules)
          ref = store.get(str(pinned.job_id)).request.receptor.model_dump(mode='json')
          assert prepared.request['receptor'] == prepared.request['search']['frame'] == ref
          assert len(store.list_jobs()) == before
          print('Restored native docking preparation replays the exact receptor; no workers started.')
          PY
      - name: Real native region, table and downloads on English desktop and Chinese mobile
        if: steps.scope.outputs.data_only != 'true'
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/module-examples
          .venv/bin/python -m opendde_workbench --port 4336 > server_tests/evidence/module-examples/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" >/dev/null && break; sleep 1; done
          .venv/bin/python -m pytest -x -q server_tests/test_surface_region_replay_browser.py
          .venv/bin/python -m pytest -x -q server_tests/test_pocket_results_browser.py
      - name: Real generation, relaxation, receptor refinement and quality stages
        if: steps.scope.outputs.data_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export WB_HOME="$RUNNER_TEMP/x-dde-generation-case-stages"
          export WB_STATE_DIR="$WB_HOME/state"
          uv run --locked ruff check server_tests/test_generation_case_stages_browser.py
          uv run --locked python server_tests/prepare_quality_context_cases.py
          uv run --locked python server_tests/prepare_visual_components.py --components ketcher
          uv run --locked python -m playwright install --with-deps chromium
          uv run --locked python -m pytest -x -q server_tests/test_generation_case_stages_browser.py
          uv run --locked ruff check tests/stat6_original_port_case.py server_tests/test_original_port_case_browser.py
          uv run --locked python -m pytest -x -q server_tests/test_original_port_case_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-example-evidence
          path: |
            server_tests/evidence/module-examples
            outputs/generation-case-stages
            outputs/original-port-case
