name: Molecular view selection and native SMILES depiction
on:
  push:
    paths: &molecular_preview_paths
      - 'frontend/src/viewer/PoseSession*'
      - 'frontend/src/presentation/ResearchTabs*'
      - 'scripts/research-tabs-scope.py'
      - 'tests/test_research_tabs_scope.py'
      - 'frontend/src/presentation/MolecularPreview.tsx'
      - 'frontend/src/chemistry/StateCollectionPreview*'
      - 'frontend/src/presentation/depiction-renderer*'
      - 'frontend/src/editors/scientificEditor.ts'
      - 'server_tests/test_molecular_preview_browser.py'
      - 'server_tests/test_state_results_workspace_browser.py'
      - 'server_tests/fixtures/stat6-generated-states-v0645.*'
      - '.github/workflows/molecular-preview-checks.yml'
  pull_request:
    paths: *molecular_preview_paths
permissions:
  contents: read
jobs:
  utility-scope:
    uses: ./.github/workflows/molecular-utility-checks.yml
    with:
      scope_only: true
  reference-scope:
    runs-on: ubuntu-24.04
    outputs:
      reference_only: ${{ steps.scope.outputs.reference_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/interaction-workspace-scope.py
  molecular-preview:
    needs: [reference-scope, utility-scope]
    if: needs.reference-scope.outputs.reference_only != 'true' && needs.utility-scope.outputs.native_state_only != 'true' && needs.utility-scope.outputs.candidate_desktop_only != 'true' && needs.utility-scope.outputs.del_desktop_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WB_AUTO_DEPLOY: '0'
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: View preference, chemical ownership, source switching and native drawing queue
        working-directory: frontend
        run: >-
          npx vitest run src/viewer/PoseSession.test.tsx
          src/viewer/usePoseOptimization.test.tsx src/presentation/ResearchTabs.test.tsx
          src/chemistry/StateCollectionPreview.test.tsx src/chemistry/StateResults.test.tsx
          src/presentation/depiction-renderer.test.ts src/editors/ketcher-hydrogens.test.ts
      - run: uv sync --locked --group dev --group browser
      - run: uv run --locked ruff check server_tests/test_molecular_preview_browser.py
      - name: Prepare only the native chemical drawing component
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-molecular-preview" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-molecular-preview/state" >> "$GITHUB_ENV"
          WB_HOME="$RUNNER_TEMP/x-dde-molecular-preview" WB_STATE_DIR="$RUNNER_TEMP/x-dde-molecular-preview/state" uv run --locked python server_tests/prepare_visual_components.py --components ketcher
          uv run --locked playwright install chromium --with-deps
      - name: Real bilingual questionnaire, Ketcher native graph and pixels; no scientific inference
        run: |
          mkdir -p outputs/molecular-preview
          .venv/bin/python -m opendde_workbench --port 4330 > outputs/molecular-preview/service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" >/dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" >/dev/null
          uv run --locked --with rdkit==2026.3.6 python -m pytest -x -q server_tests/test_molecular_preview_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molecular-preview-evidence
          path: outputs/molecular-preview/**
  retained-state-preview:
    needs: utility-scope
    if: needs.utility-scope.outputs.native_state_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WB_AUTO_DEPLOY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Conformer ownership, verified rendering, undo and selection
        working-directory: frontend
        run: >-
          npx vitest run src/chemistry/StateCollectionPreview.test.tsx src/chemistry/StateResults.test.tsx
          src/viewer/usePoseOptimization.test.tsx src/viewer/pose-plan.test.ts src/viewer/pose-source.test.ts
          src/viewer/StructureViewer.test.tsx src/viewer/PoseSession.test.tsx src/presentation/ResearchTabs.test.tsx
          src/presentation/depiction-renderer.test.ts
          src/diffsbdd/GeneratedCandidateDownload.test.tsx src/presentation/molecular-record.test.ts
      - run: uv sync --locked --group dev --group browser
      - name: Only the reviewed native state diff takes this focused path
        run: |
          uv run --locked ruff check scripts/molecular-utility-scope.py tests/test_molecular_utility_scope.py server_tests/test_state_results_workspace_browser.py
          uv run --locked pytest -q tests/test_molecular_utility_scope.py
      - name: Replay previously calculated STAT6 conformers in Google Chrome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          google-chrome --version
          readarray -t source < <(uv run --locked python -c 'from opendde_workbench.examples.stat6_bundle_release import URL; print("\n".join(URL.rsplit("/", 2)[-2:]))')
          test "${#source[@]}" -eq 2
          [[ "${source[0]}" =~ ^examples-v[0-9]+$ ]]
          [[ "${source[1]}" =~ ^stat6-reviewed-results-v[0-9]+\.zip$ ]]
          gh release download "${source[0]}" --repo "$GITHUB_REPOSITORY" --pattern "${source[1]}" --dir "$RUNNER_TEMP"
          WB_REVIEWED_STAT6_ARCHIVE="$RUNNER_TEMP/${source[1]}" uv run --locked python -m pytest -x -q server_tests/test_state_results_workspace_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-state-workspace-evidence
          path: outputs/state-results/
