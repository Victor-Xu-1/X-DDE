name: Public case controls and context checks
on:
  workflow_dispatch:
  push:
    paths: &template_controls_paths
      - 'frontend/src/examples/ExampleActions*'
      - 'frontend/src/examples/ExampleToolbar*'
      # Study-specific labels are checked without replaying archived result fixtures.
      - '!frontend/src/examples/ExampleToolbar.tsx'
      - 'frontend/src/examples/ExampleGuide*'
      - '!frontend/src/examples/ExampleGuide.tsx'
      - 'frontend/src/examples/ExampleFeedback*'
      - 'frontend/src/examples/useExampleTemplate*'
      - 'frontend/src/examples/examples.css'
      - 'frontend/src/TaskForm*'
      - 'frontend/src/studio/HomeWorkspace*'
      - 'frontend/src/i18n.ts'
      - 'frontend/src/form-model.test.ts'
      - 'frontend/index.html'
      - 'frontend/src/presentation/result-layout.css'
      - 'server_tests/test_template_controls_browser.py'
      - 'server_tests/test_compact_example_guide_browser.py'
      - '.github/workflows/template-controls-checks.yml'
      # Retained-stage labels and unchanged drafts have example-result-set-checks.yml.
      - '!frontend/src/examples/ExampleActions.tsx'
  pull_request:
    paths: *template_controls_paths
permissions:
  contents: read
jobs:
  utility-scope:
    uses: ./.github/workflows/molecular-utility-checks.yml
    with:
      scope_only: true
  prediction-scope:
    uses: ./.github/workflows/prediction-workspace-checks.yml
    with:
      scope_only: true
  public-case-controls:
    needs: [prediction-scope, utility-scope]
    if: >-
      needs.prediction-scope.outputs.feature_settings != 'true' &&
      needs.prediction-scope.outputs.task_power_only != 'true' &&
      needs.utility-scope.outputs.compact_example_only != 'true' &&
      needs.utility-scope.outputs.desktop_header_only != 'true' &&
      needs.utility-scope.outputs.composed_power_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WB_AUTO_DEPLOY: '0'
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Build and check the changed controls and direct consumers
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          cd frontend
          npx vitest run src/examples/ExampleActions.test.tsx src/examples/ExampleJobResult.test.tsx src/examples/guide.test.ts src/TaskForm.test.tsx src/studio/HomeWorkspace.test.tsx src/operations/ToolCenter.test.tsx
          npx vitest run src/form-model.test.ts src/studio/InterfaceSettings.test.tsx src/App.test.tsx src/admet/AdmetResults.test.tsx src/docking/DockingResults.test.tsx src/chemistry/StateResults.test.tsx
      - name: Restore reviewed public results into isolated state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export WB_HOME="$RUNNER_TEMP/x-dde-case-controls"
          export WB_STATE_DIR="$WB_HOME/state"
          echo "WB_HOME=$WB_HOME" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$WB_STATE_DIR" >> "$GITHUB_ENV"
          uv sync --locked --group dev --group browser
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
          .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          .venv/bin/python server_tests/prepare_visual_components.py --components ketcher public-dataset-examples
      - name: Native case context, keyboard return and failure recovery
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/template-controls
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/template-controls/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null
          .venv/bin/python -m pytest -q server_tests/test_template_controls_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-template-controls-evidence
          path: server_tests/evidence/template-controls
          if-no-files-found: warn
  compact-example-guide:
    needs: utility-scope
    if: needs.utility-scope.outputs.compact_example_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WB_AUTO_DEPLOY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Guide, retained source and direct module consumers
        working-directory: frontend
        run: >-
          npx vitest run src/examples/ExampleActions.test.tsx src/examples/ExampleResultSet.test.tsx
          src/examples/ExampleRecordResult.test.tsx
          src/examples/ExampleJobResult.test.tsx src/examples/guide.test.ts src/utilities/UtilityWorkspace.test.tsx
          src/utilities/UtilityTask.test.tsx
          src/presentation/plots/InteractivePlot.test.tsx src/presentation/plots/InteractivePlot.frame.test.tsx
      - run: uv sync --locked --group dev --group browser
      - name: Validate scope and replay the retained examples in Chrome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked ruff check scripts/molecular-utility-scope.py tests/test_molecular_utility_scope.py server_tests/test_compact_example_guide_browser.py
          uv run --locked pytest -q tests/test_molecular_utility_scope.py
          google-chrome --version
          readarray -t source < <(uv run --locked python -c 'from opendde_workbench.examples.stat6_bundle_release import URL; print("\n".join(URL.rsplit("/", 2)[-2:]))')
          test "${#source[@]}" -eq 2
          [[ "${source[0]}" =~ ^examples-v[0-9]+$ ]]
          [[ "${source[1]}" =~ ^stat6-reviewed-results-v[0-9]+\.zip$ ]]
          gh release download "${source[0]}" --repo "$GITHUB_REPOSITORY" --pattern "${source[1]}" --dir "$RUNNER_TEMP"
          WB_REVIEWED_STAT6_ARCHIVE="$RUNNER_TEMP/${source[1]}" uv run --locked python -m pytest -x -q server_tests/test_compact_example_guide_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-example-evidence
          path: outputs/compact-example/
