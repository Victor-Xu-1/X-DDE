name: STAT6 successor receptor provenance
on:
  pull_request:
    paths: &paths
      - 'src/opendde_workbench/examples/pins.py'
      - 'src/opendde_workbench/examples/stat6/prepared_inputs.py'
      - 'tests/test_stat6_prepared_handoff.py'
      - '.github/workflows/stat6-successor-receptor.yml'
  push:
    paths: *paths
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check src/opendde_workbench/examples/pins.py src/opendde_workbench/examples/stat6/prepared_inputs.py tests/test_stat6_prepared_handoff.py
      - run: >-
          uv run --locked pytest -q tests/test_stat6_prepared_handoff.py
          -k 'docking_successor or successor_does_not_take_another_study or docking_template or generation_template or electrostatic_template'
