name: Property model review scoped checks
on:
  push:
    paths: &model_context_paths
      - "src/opendde_workbench/integrations/property_models.py"
      - "src/opendde_workbench/integrations/bindings.py"
      - "src/opendde_workbench/integrations/routes.py"
      - "frontend/src/integrations/PropertyModel*"
      - "frontend/src/integrations/property-model-evidence*"
      - "frontend/src/integrations/ScientificReview.tsx"
      - "frontend/src/integrations/ScientificResults.tsx"
      - "frontend/src/integrations/types.ts"
      - "tests/test_property_model_context.py"
      - "tests/test_property_model_scope.py"
      - "scripts/property-model-scope.py"
      - "tests/test_model_case_sources.py"
      - "server_tests/test_property_model_reuse_browser.py"
      - ".github/workflows/property-model-review-checks.yml"
  pull_request:
    paths: *model_context_paths
  workflow_call:
    inputs:
      scope_only:
        type: boolean
        default: false
      runner:
        type: string
        default: ubuntu-24.04
    outputs:
      model_context_only:
        value: ${{ jobs.scope.outputs.model_context_only }}
      managed_compute_only:
        value: ${{ jobs.scope.outputs.managed_compute_only }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      model_context_only: ${{ steps.select.outputs.model_context_only }}
      managed_compute_only: ${{ steps.compute.outputs.managed_compute_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/property-model-scope.py
      - id: compute
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/managed_compute_scope.py
  model-review:
    needs: scope
    if: inputs.scope_only != true && needs.scope.outputs.managed_compute_only != 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Exact model context, checkpoint admission and preserved historical evidence
        run: uv run --locked pytest -q tests/test_property_model_context.py tests/test_model_case_sources.py tests/test_property_model_scope.py
      - name: Explicit original-source and adjacent potential-transfer review
        if: github.event_name == 'workflow_dispatch'
        run: uv run --locked pytest -q tests/test_potential_case_sources.py tests/test_case_bundle_sources.py
      - name: Model selection, stale replies, submission review and prediction-result consumers
        working-directory: frontend
        run: >-
          npx vitest run src/integrations/property-model-evidence.test.ts
          src/integrations/PropertyModelEvidence.test.tsx src/integrations/PropertyModelSelection.test.tsx
          src/integrations/PropertyModelResults.test.tsx src/integrations/ScientificResults.test.tsx
          src/integrations/ScientificForm.test.tsx src/integrations/ReinventReview.test.tsx
          src/integrations/PlipReview.test.tsx
      - name: Get the current immutable public case data for cold restoration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-model-review" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-model-review/state" >> "$GITHUB_ENV"
          readarray -t source < <(uv run --locked python -c 'from opendde_workbench.examples.stat6_bundle_release import URL; print("\n".join(URL.rsplit("/", 2)[-2:]))')
          test "${#source[@]}" -eq 2
          tag="${source[0]}"
          asset="${source[1]}"
          [[ "$tag" == "examples-v2" || "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$asset" =~ ^stat6-reviewed-results-v[0-9]+\.zip$ ]]
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP"
          echo "WB_REVIEWED_STAT6_ARCHIVE=$RUNNER_TEMP/$asset" >> "$GITHUB_ENV"
      - name: Existing sealed pins remain portable without changing their bytes or executing history
        if: github.event_name == 'workflow_dispatch'
        run: uv run --locked pytest -q tests/test_stat6_case_data.py
      - name: Install native Ketcher only; no training or scientific engine
        run: uv run --locked python server_tests/prepare_visual_components.py --components ketcher
      - run: uv run --locked playwright install chromium --with-deps
      - name: Actual restored model reuse in English desktop and Chinese mobile without calculation
        run: uv run --locked pytest -x -q server_tests/test_property_model_reuse_browser.py
      - name: Explicit full model and region review remains available to its existing caller
        if: github.event_name == 'workflow_dispatch'
        run: uv run --locked pytest -x -q server_tests/test_property_model_review_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-model-review
          path: |
            server_tests/evidence/property-model-review
            server_tests/evidence/property-model-reuse
          if-no-files-found: warn
