          src/utilities/UtilitySinglePage.test.tsx
      - name: Chrome layout, focus and native 2D review
        run: |
          uv sync --locked --group dev --group browser
          google-chrome --version
          export WB_HOME="$RUNNER_TEMP/x-dde-review-controls"
          export WB_STATE_DIR="$WB_HOME/state"
          uv run --locked python server_tests/prepare_visual_components.py --components ketcher
          uv run --locked ruff check scripts/molecular-utility-scope.py server_tests/test_utility_navigation_browser.py server_tests/test_molecular_review_controls_browser.py
          uv run --locked python -m pytest -q tests/test_molecular_utility_scope.py server_tests/test_utility_navigation_browser.py server_tests/test_molecular_review_controls_browser.py
