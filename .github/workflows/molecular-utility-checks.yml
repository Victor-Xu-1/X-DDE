      potential_display_only:
        value: ${{ jobs.scope.outputs.potential_display_only }}
      runtime_switch_only:
        value: ${{ jobs.scope.outputs.runtime_switch_only }}
      backend_placement_only:
        value: ${{ jobs.scope.outputs.backend_placement_only }}
      composed_power_only:
        value: ${{ jobs.scope.outputs.composed_power_only }}
      task_power_only:
        value: ${{ jobs.scope.outputs.task_power_only }}
      native_state_only:
        value: ${{ jobs.scope.outputs.native_state_only }}
      compact_example_only:
        value: ${{ jobs.scope.outputs.compact_example_only }}
      mobile_header_only:
        value: ${{ jobs.scope.outputs.mobile_header_only }}
      desktop_header_only:
        value: ${{ jobs.scope.outputs.desktop_header_only }}
      desktop_complex_review_only:
        value: ${{ jobs.scope.outputs.desktop_complex_review_only }}
      initial_pose_power_only:
        value: ${{ jobs.scope.outputs.initial_pose_power_only }}
      mobile_viewer_only:
        value: ${{ jobs.scope.outputs.mobile_viewer_only }}
      recognition_power_only:
        value: ${{ jobs.scope.outputs.recognition_power_only }}
      utility_desktop_only:
        value: ${{ jobs.scope.outputs.utility_desktop_only }}
      result_header_only:
        value: ${{ jobs.scope.outputs.result_header_only }}
      refinement_desktop_only:
        value: ${{ jobs.scope.outputs.refinement_desktop_only }}
      spatial_desktop_only:
        value: ${{ jobs.scope.outputs.spatial_desktop_only }}
      spatial_review_only:
        value: ${{ jobs.scope.outputs.spatial_review_only }}
      short_structure_review_only:
        value: ${{ jobs.scope.outputs.short_structure_review_only }}
      sequence_desktop_only:
        value: ${{ jobs.scope.outputs.sequence_desktop_only }}
      protein_desktop_only:
        value: ${{ jobs.scope.outputs.protein_desktop_only }}
      history_desktop_only:
        value: ${{ jobs.scope.outputs.history_desktop_only }}
      candidate_desktop_only:
        value: ${{ jobs.scope.outputs.candidate_desktop_only }}
      del_desktop_only:
        value: ${{ jobs.scope.outputs.del_desktop_only }}
      simulation_desktop_only:
        value: ${{ jobs.scope.outputs.simulation_desktop_only }}
      proximity_desktop_only:
        value: ${{ jobs.scope.outputs.proximity_desktop_only }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      aligned_comparison_only: ${{ steps.select.outputs.aligned_comparison_only }}
      utility_only: ${{ steps.select.outputs.utility_only }}
      inline_recognition_only: ${{ steps.select.outputs.inline_recognition_only }}
      editor_drawing_only: ${{ steps.select.outputs.editor_drawing_only }}
      portable_smiles_only: ${{ steps.select.outputs.portable_smiles_only }}
      archived_pose_review_only: ${{ steps.select.outputs.archived_pose_review_only }}
      guided_desktop_only: ${{ steps.select.outputs.guided_desktop_only }}
      prediction_input_layout: ${{ steps.select.outputs.prediction_input_layout }}
      utility_query_only: ${{ steps.select.outputs.utility_query_only }}
      compact_material_only: ${{ steps.select.outputs.compact_material_only }}
      paired_figure_only: ${{ steps.select.outputs.paired_figure_only }}
      native_color_figure_only: ${{ steps.select.outputs.native_color_figure_only }}
      touch_controls_only: ${{ steps.select.outputs.touch_controls_only }}
      utility_navigation_only: ${{ steps.select.outputs.utility_navigation_only }}
      utility_desktop_only: ${{ steps.select.outputs.utility_desktop_only }}
      desktop_help_only: ${{ steps.select.outputs.desktop_help_only }}
      refinement_desktop_only: ${{ steps.select.outputs.refinement_desktop_only }}
      spatial_desktop_only: ${{ steps.select.outputs.spatial_desktop_only }}
      spatial_review_only: ${{ steps.select.outputs.spatial_review_only }}
      short_structure_review_only: ${{ steps.select.outputs.short_structure_review_only }}
      short_paired_comparison_only: ${{ steps.select.outputs.short_paired_comparison_only }}
      sequence_desktop_only: ${{ steps.select.outputs.sequence_desktop_only }}
      protein_desktop_only: ${{ steps.select.outputs.protein_desktop_only }}
      history_desktop_only: ${{ steps.select.outputs.history_desktop_only }}
      candidate_desktop_only: ${{ steps.select.outputs.candidate_desktop_only }}
      screening_desktop_only: ${{ steps.select.outputs.screening_desktop_only }}
      del_desktop_only: ${{ steps.select.outputs.del_desktop_only }}
      result_theme_only: ${{ steps.select.outputs.result_theme_only }}
      desktop_result_layout_only: ${{ steps.select.outputs.desktop_result_layout_only }}
      simulation_desktop_only: ${{ steps.select.outputs.simulation_desktop_only }}
      proximity_desktop_only: ${{ steps.select.outputs.proximity_desktop_only }}
      result_handoff_desktop_only: ${{ steps.select.outputs.result_handoff_desktop_only }}
      molecule_results_only: ${{ steps.select.outputs.molecule_results_only }}
      short_chemistry_desktop_only: ${{ steps.select.outputs.short_chemistry_desktop_only }}
      molecule_workbench_only: ${{ steps.select.outputs.molecule_workbench_only }}
      ligand_camera_only: ${{ steps.select.outputs.ligand_camera_only }}
      desktop_structure_focus_only: ${{ steps.select.outputs.desktop_structure_focus_only }}
      runtime_entry_only: ${{ steps.select.outputs.runtime_entry_only }}
      utility_result_desktop_only: ${{ steps.select.outputs.utility_result_desktop_only }}
      recognition_power_only: ${{ steps.select.outputs.recognition_power_only }}
      recognition_access_only: ${{ steps.select.outputs.recognition_access_only }}
      recognition_entry_only: ${{ steps.select.outputs.recognition_entry_only }}
      potential_display_only: ${{ steps.select.outputs.potential_display_only }}
      runtime_switch_only: ${{ steps.select.outputs.runtime_switch_only }}
      backend_placement_only: ${{ steps.select.outputs.backend_placement_only }}
      task_power_only: ${{ steps.select.outputs.task_power_only }}
      module_backend_only: ${{ steps.select.outputs.module_backend_only }}
      module_power_only: ${{ steps.select.outputs.module_power_only }}
      composed_power_only: ${{ steps.select.outputs.composed_power_only }}
      module_power_changed: ${{ steps.select.outputs.module_power_changed }}
      native_state_only: ${{ steps.select.outputs.native_state_only }}
      compact_example_only: ${{ steps.select.outputs.compact_example_only }}
      mobile_header_only: ${{ steps.select.outputs.mobile_header_only }}
      desktop_header_only: ${{ steps.select.outputs.desktop_header_only }}
      desktop_complex_review_only: ${{ steps.select.outputs.desktop_complex_review_only }}
      initial_pose_power_only: ${{ steps.select.outputs.initial_pose_power_only }}
      mobile_viewer_only: ${{ steps.select.outputs.mobile_viewer_only }}
      print_labels_only: ${{ steps.select.outputs.print_labels_only }}
      result_header_only: ${{ steps.select.outputs.result_header_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/molecular-utility-scope.py
  utility-inputs:
    needs: scope
    if: >-
      !inputs.scope_only && needs.scope.outputs.recognition_power_only != 'true' &&
      needs.scope.outputs.recognition_access_only != 'true' &&
      needs.scope.outputs.inline_recognition_only != 'true' &&
      needs.scope.outputs.editor_drawing_only != 'true' &&
      needs.scope.outputs.portable_smiles_only != 'true' &&
      needs.scope.outputs.archived_pose_review_only != 'true' &&
      needs.scope.outputs.guided_desktop_only != 'true' &&
      needs.scope.outputs.prediction_input_layout != 'true' &&
      needs.scope.outputs.utility_query_only != 'true' &&
      needs.scope.outputs.compact_material_only != 'true' &&
      needs.scope.outputs.paired_figure_only != 'true' &&
      needs.scope.outputs.native_color_figure_only != 'true' &&
      needs.scope.outputs.recognition_entry_only != 'true' &&
      needs.scope.outputs.touch_controls_only != 'true' && needs.scope.outputs.runtime_switch_only != 'true' &&
      needs.scope.outputs.result_header_only != 'true' && needs.scope.outputs.utility_navigation_only != 'true' &&
      needs.scope.outputs.potential_display_only != 'true' && needs.scope.outputs.native_state_only != 'true' &&
      needs.scope.outputs.compact_example_only != 'true' && needs.scope.outputs.mobile_header_only != 'true' &&
      needs.scope.outputs.desktop_header_only != 'true' &&
      needs.scope.outputs.initial_pose_power_only != 'true' &&
      needs.scope.outputs.mobile_viewer_only != 'true' && needs.scope.outputs.print_labels_only != 'true' &&
      needs.scope.outputs.utility_desktop_only != 'true' && needs.scope.outputs.desktop_help_only != 'true' &&
      needs.scope.outputs.refinement_desktop_only != 'true' &&
      needs.scope.outputs.spatial_desktop_only != 'true' &&
      needs.scope.outputs.short_structure_review_only != 'true' &&
      needs.scope.outputs.sequence_desktop_only != 'true' &&
      needs.scope.outputs.protein_desktop_only != 'true' &&
      needs.scope.outputs.history_desktop_only != 'true' &&
      needs.scope.outputs.candidate_desktop_only != 'true' &&
      needs.scope.outputs.del_desktop_only != 'true' &&
      needs.scope.outputs.simulation_desktop_only != 'true' &&
      needs.scope.outputs.proximity_desktop_only != 'true' &&
      needs.scope.outputs.result_handoff_desktop_only != 'true' &&
      needs.scope.outputs.desktop_structure_focus_only != 'true' &&
      needs.scope.outputs.aligned_comparison_only != 'true' &&
      needs.scope.outputs.runtime_entry_only != 'true' &&
      needs.scope.outputs.utility_result_desktop_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Exact committed catalogue, frontend and direct native ADMET contracts
        run: |
          uv run --locked python scripts/record-study-catalogue.py --check
          uv run --locked python scripts/generate-capability-catalog.py --check
          cd frontend
          npx vitest run \
            src/examples/ExampleActions.test.tsx \
            src/guided/MolecularReview.test.tsx \
            src/guided/Questionnaire.test.tsx \
            src/guided/QuestionnaireGuidance.test.tsx \
            src/guided/SinglePageTask.test.tsx \
            src/App.test.tsx \
            src/operations/PropertyForm.test.tsx \
            src/operations/PropertyFormFileVerification.test.tsx \
            src/chemistry/StateForm.test.tsx \
            src/chemistry/LibraryScreenForm.test.tsx \
            src/chemistry/LibraryScreenTemplate.test.tsx \
            src/chemistry/MolecularToolReview.test.tsx \
            src/utilities/ImageMoleculeInput.test.tsx \
            src/utilities/ImageMoleculeInput.action.test.tsx \
            src/utilities/useRecognitionBridge.test.tsx \
            src/utilities/useRecognitionRequest.test.tsx \
            src/utilities/recognition-foreground.test.ts \
            src/utilities/recognition-host-bridge.test.ts \
            src/utilities/recognition-host-foreground.test.ts \
            src/utilities/UtilityImageTask.test.tsx \
            src/utilities/ImageRecognition.test.tsx \
            src/utilities/recognition-locale.test.tsx \
            src/utilities/BackendControls.test.tsx \
            src/operations/AssetPicker.test.tsx \
            src/operations/AssetPickerSources.test.tsx \
            src/operations/AssetPickerImageSource.test.tsx \
            src/diffsbdd/ReferencePicker.test.tsx \
            src/diffsbdd/ReferencePickerUpload.test.tsx \
            src/diffsbdd/ReferencePickerLifecycle.test.tsx \
            src/diffsbdd/useReferenceSelection.test.tsx \
            src/editors/native-molecular-viewport.test.ts \
            src/editors/molecule-readiness.test.ts \
            src/editors/recognition-host-editor.test.ts \
            src/editors/ketcher-conversions.test.ts \
            src/operations/useAssetUpload.image.test.tsx \
            src/integrations/BoltzInputs.test.tsx \
            src/integrations/Mol1Form.test.tsx \
            src/presentation/PredictionEntityEditing.test.tsx \
            src/research/SdfRecordPicker.test.tsx \
            src/presentation/MoleculeImage.test.tsx \
            src/presentation/depiction-renderer.test.ts \
            src/publication/FigureExport.test.tsx \
            src/admet/AdmetForm.test.tsx \
            src/admet/AdmetResults.test.tsx \
            src/admet/EndpointValue.test.tsx \
            src/utilities/UtilityBrainSubmission.test.tsx \
            src/utilities/UtilityTask.test.tsx \
            src/utilities/UtilityTaskResult.test.tsx \
            src/utilities/UtilitySinglePage.test.tsx \
            src/admet/BrainScope.test.tsx \
            src/utilities/UtilityWorkspace.test.tsx \
            src/studio/Navigation.test.tsx \
            src/studio/MethodSwitch.test.tsx \
            src/studio/research-modules.test.ts \
            src/presentation/ResearchTable.test.tsx \
            src/presentation/MetricScatter.test.tsx \
            src/viewer/PoseSession.test.tsx \
            src/viewer/pose-plan.test.ts
          cd ..
          uv run --locked pytest -q tests/test_admet.py tests/test_brain_profile.py tests/test_molecular_utility_scope.py tests/test_capabilities.py tests/test_example_pins.py tests/test_library_screen.py tests/test_library_evidence.py
          uv run --locked ruff check src/opendde_workbench/recognition_companion.py tests/test_recognition_companion.py tests/test_recognition_companion_wheel.py server_tests/test_utility_image_browser.py
          uv build --wheel
          uv run --locked pytest -q tests/test_recognition_companion.py tests/test_recognition_companion_wheel.py tests/test_utility_tools.py tests/test_compute_service.py tests/test_compute_msa_protocol.py tests/test_harness_admission.py
          uv run --locked ruff check server_tests/utility_workspace_capture.py
          uv run --locked ruff check scripts/record-study-catalogue.py scripts/molecular-utility-scope.py tests/test_brain_profile.py tests/test_molecular_utility_scope.py server_tests/test_brain_profile_browser.py server_tests/test_molecular_review_workspace_browser.py server_tests/molecular_review_capture.py src/opendde_workbench/admet/contract.py src/opendde_workbench/admet/presentation.py src/opendde_workbench/capabilities/definitions.py src/opendde_workbench/capabilities/modalities.py src/opendde_workbench/task_history/kinds.py src/opendde_workbench/examples/stat6/task_requests.py src/opendde_workbench/examples/stat6/guidance.py src/opendde_workbench/examples/pin_validation.py
      - name: Retrieve sealed native outputs without starting a prediction engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked python - <<'PY'
          import os, urllib.request
          from pathlib import Path
          from opendde_workbench.examples.stat6_bundle_release import URL
          target = Path(os.environ["RUNNER_TEMP"]) / "stat6-reviewed-results.zip"
          urllib.request.urlretrieve(URL, target)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"WB_REVIEWED_STAT6_ARCHIVE={target}\n")
          PY
      - name: Native retained-output browser acceptance with prediction disabled
        run: |
          uv run --locked playwright install --with-deps chromium
          google-chrome --version
          uv run --locked python -c 'from server_tests.molecular_review_capture import verify_review_fonts; print(verify_review_fonts())'
          uv run --locked python -m pytest -q server_tests/test_brain_profile_browser.py server_tests/test_molecular_review_workspace_browser.py --basetemp "$RUNNER_TEMP/brain-profile-browser"
          uv run --locked python -m pytest -q server_tests/test_recognition_locale_browser.py server_tests/test_utility_image_browser.py --basetemp "$RUNNER_TEMP/utility-image-browser"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molecular-utility-native-evidence
          path: |
            outputs/brain-profile
            outputs/molecular-review-workspace
            outputs/recognition-locale
            outputs/utility-image
          if-no-files-found: warn

  recognition-backend-entry:
    needs: scope
    if: ${{ !inputs.scope_only && needs.scope.outputs.recognition_entry_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Shared backend controls and recognition workspace navigation
        working-directory: frontend
        run: >-
