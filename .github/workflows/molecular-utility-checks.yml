  pull_request:
    paths: *utility_paths
  workflow_dispatch:
  workflow_call:
    inputs:
      scope_only:
        type: boolean
        default: false
    outputs:
      aligned_comparison_only:
        value: ${{ jobs.scope.outputs.aligned_comparison_only }}
      desktop_structure_focus_only:
        value: ${{ jobs.scope.outputs.desktop_structure_focus_only }}
      result_handoff_desktop_only:
        value: ${{ jobs.scope.outputs.result_handoff_desktop_only }}
      molecule_results_only:
        value: ${{ jobs.scope.outputs.molecule_results_only }}
      ligand_camera_only:
        value: ${{ jobs.scope.outputs.ligand_camera_only }}
      utility_only:
        value: ${{ jobs.scope.outputs.utility_only }}
      editor_drawing_only:
