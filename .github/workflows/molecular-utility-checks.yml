name: Molecular utility input and BBB checks
on:
  push:
    paths: &utility_paths
      - "frontend/src/editors/ketcher-conversions*"
      - "frontend/src/utilities/ImageInputSource.ts"
      - "frontend/src/utilities/UtilityImage*"
      - "frontend/src/utilities/useRecognition*"
      - "frontend/src/utilities/recognition-foreground*"
      - "frontend/src/utilities/recognition-host*"
      - "frontend/src/utilities/image-molecule.*"
      - "frontend/src/operations/AssetPickerImageSource.test.tsx"
      - "src/opendde_workbench/recognition_companion.py"
      - "src/opendde_workbench/data/recognition_locale/patch.json"
      - "tests/test_recognition_companion*.py"
      - "tests/fixtures/utility_image/**"
      - "server_tests/test_utility_image_browser.py"
      - "frontend/src/diffsbdd/ReferencePicker.tsx"
      - "frontend/src/diffsbdd/useReferenceSelection.ts"
      - "frontend/src/operations/AssetPicker.tsx"
      - "frontend/src/operations/AssetPickerSources.ts"
      - "frontend/src/operations/AssetPickerUpload.tsx"
      - "frontend/src/utilities/ImageMoleculeInput*"
      - "frontend/src/utilities/ImageMoleculeDialog*"
      - "frontend/src/utilities/useImageInputSession*"
      - "frontend/src/admet/**"
      - "frontend/src/guided/MolecularReview*"
      - "frontend/src/guided/InputActionScope*"
      - "frontend/src/guided/useInputTaskSubmit*"
      - "frontend/src/guided/TaskPresentation*"
      - "frontend/src/guided/SinglePage*"
      - "frontend/src/examples/ExampleActions*"
      - "frontend/src/guided/molecular-review.css"
      - "frontend/src/operations/PropertyForm.tsx"
      - "frontend/src/chemistry/StateForm.tsx"
      - "frontend/src/chemistry/LibraryScreenForm.tsx"
      - "frontend/src/chemistry/LibraryScreenQuestions.tsx"
      - "frontend/src/chemistry/MolecularToolReview.test.tsx"
      - "frontend/src/utilities/UtilityWorkspace*"
      - "frontend/src/studio/HelpWorkspace*"
      - "server_tests/test_desktop_help_browser.py"
      - "frontend/src/integrations/RefinementSummary.tsx"
      - "frontend/src/integrations/refinement-summary.css"
      - "frontend/src/integrations/refinement-energy-labels.ts"
      - "server_tests/test_refinement_review_browser.py"
      - "frontend/src/presentation/SpatialResultSummary.tsx"
      - "frontend/src/presentation/spatial-results.css"
      - "server_tests/test_spatial_results_desktop.py"
      - "server_tests/test_sequence_review_desktop.py"
      - "server_tests/test_protein_review_desktop.py"
      - ".github/workflows/refinement-input-checks.yml"
      - "frontend/src/utilities/UtilityTask*"
      - "frontend/src/utilities/UtilitySinglePage*"
      - "frontend/src/utilities/utility-task.css"
      - "frontend/src/utilities/UtilityBrainSubmission.test.tsx"
      - "frontend/src/operations/ToolCenter.tsx"
      - "frontend/src/operations/catalog.ts"
      - "frontend/src/studio/research-modules.ts"
      - "frontend/src/studio/method-choices.ts"
      - "frontend/src/studio/task-kind-rules.ts"
      - "src/opendde_workbench/admet/contract.py"
      - "src/opendde_workbench/admet/presentation.py"
      - "src/opendde_workbench/capabilities/definitions.py"
      - "src/opendde_workbench/capabilities/modalities.py"
      - "src/opendde_workbench/task_history/kinds.py"
      - "src/opendde_workbench/examples/catalogue.json"
      - "src/opendde_workbench/examples/preparation.py"
      - "src/opendde_workbench/examples/pin_validation.py"
      - "src/opendde_workbench/examples/stat6/guidance.py"
      - "src/opendde_workbench/examples/stat6/task_requests.py"
      - "src/opendde_workbench/examples/stat6/catalogue-profiles.json"
      - "scripts/molecular-utility-scope.py"
      - "scripts/record-study-catalogue.py"
      - "tests/test_brain_profile*.py"
      - "tests/test_molecular_utility_scope.py"
      - "server_tests/test_brain_profile_browser.py"
      - "server_tests/test_molecular_review_workspace_browser.py"
      - "server_tests/molecular_review_capture.py"
      - "server_tests/utility_workspace_capture.py"
      - "server_tests/test_utility_navigation_browser.py"
      - "server_tests/test_molecular_review_controls_browser.py"
      - "src/opendde_workbench/runtime_controls.py"
      - "frontend/src/utilities/backend-runtime.ts"
      - "frontend/src/utilities/backend-control-scope.ts"
      - "frontend/src/utilities/BackendControls.tsx"
      - "frontend/src/utilities/BackendControls.test.tsx"
      - "frontend/src/utilities/RuntimeSwitch.tsx"
      - "frontend/src/utilities/TaskBackendControl.tsx"
      - "frontend/src/studio/TaskHistoryToolbar.tsx"
      - "frontend/src/utilities/runtime-switch.css"
      - "frontend/src/datasets/ScreeningForm*"
      - "server_tests/test_screening_power_browser.py"
      - "server_tests/test_module_backend_switch_browser.py"
      - "tests/test_utility_tools.py"
      - "tests/test_compute_power_admission.py"
      - ".github/workflows/molecular-utility-checks.yml"
  pull_request:
    paths: *utility_paths
  workflow_dispatch:
  workflow_call:
    inputs:
      scope_only:
        type: boolean
        default: false
    outputs:
      utility_only:
        value: ${{ jobs.scope.outputs.utility_only }}
      potential_display_only:
        value: ${{ jobs.scope.outputs.potential_display_only }}
      runtime_switch_only:
        value: ${{ jobs.scope.outputs.runtime_switch_only }}
      backend_placement_only:
        value: ${{ jobs.scope.outputs.backend_placement_only }}
      composed_power_only:
        value: ${{ jobs.scope.outputs.composed_power_only }}
      task_power_only:
        value: ${{ jobs.scope.outputs.task_power_only }}
      native_state_only:
        value: ${{ jobs.scope.outputs.native_state_only }}
      compact_example_only:
        value: ${{ jobs.scope.outputs.compact_example_only }}
      mobile_header_only:
        value: ${{ jobs.scope.outputs.mobile_header_only }}
      desktop_header_only:
        value: ${{ jobs.scope.outputs.desktop_header_only }}
      initial_pose_power_only:
        value: ${{ jobs.scope.outputs.initial_pose_power_only }}
      mobile_viewer_only:
        value: ${{ jobs.scope.outputs.mobile_viewer_only }}
      recognition_power_only:
        value: ${{ jobs.scope.outputs.recognition_power_only }}
      result_header_only:
        value: ${{ jobs.scope.outputs.result_header_only }}
      refinement_desktop_only:
        value: ${{ jobs.scope.outputs.refinement_desktop_only }}
      spatial_desktop_only:
        value: ${{ jobs.scope.outputs.spatial_desktop_only }}
      sequence_desktop_only:
        value: ${{ jobs.scope.outputs.sequence_desktop_only }}
      protein_desktop_only:
        value: ${{ jobs.scope.outputs.protein_desktop_only }}
      history_desktop_only:
        value: ${{ jobs.scope.outputs.history_desktop_only }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      utility_only: ${{ steps.select.outputs.utility_only }}
      touch_controls_only: ${{ steps.select.outputs.touch_controls_only }}
      utility_navigation_only: ${{ steps.select.outputs.utility_navigation_only }}
      utility_desktop_only: ${{ steps.select.outputs.utility_desktop_only }}
      desktop_help_only: ${{ steps.select.outputs.desktop_help_only }}
      refinement_desktop_only: ${{ steps.select.outputs.refinement_desktop_only }}
      spatial_desktop_only: ${{ steps.select.outputs.spatial_desktop_only }}
      sequence_desktop_only: ${{ steps.select.outputs.sequence_desktop_only }}
      protein_desktop_only: ${{ steps.select.outputs.protein_desktop_only }}
      history_desktop_only: ${{ steps.select.outputs.history_desktop_only }}
      recognition_power_only: ${{ steps.select.outputs.recognition_power_only }}
      potential_display_only: ${{ steps.select.outputs.potential_display_only }}
      runtime_switch_only: ${{ steps.select.outputs.runtime_switch_only }}
      backend_placement_only: ${{ steps.select.outputs.backend_placement_only }}
      task_power_only: ${{ steps.select.outputs.task_power_only }}
      module_backend_only: ${{ steps.select.outputs.module_backend_only }}
      module_power_only: ${{ steps.select.outputs.module_power_only }}
      composed_power_only: ${{ steps.select.outputs.composed_power_only }}
      module_power_changed: ${{ steps.select.outputs.module_power_changed }}
      native_state_only: ${{ steps.select.outputs.native_state_only }}
      compact_example_only: ${{ steps.select.outputs.compact_example_only }}
      mobile_header_only: ${{ steps.select.outputs.mobile_header_only }}
      desktop_header_only: ${{ steps.select.outputs.desktop_header_only }}
      initial_pose_power_only: ${{ steps.select.outputs.initial_pose_power_only }}
      mobile_viewer_only: ${{ steps.select.outputs.mobile_viewer_only }}
      print_labels_only: ${{ steps.select.outputs.print_labels_only }}
      result_header_only: ${{ steps.select.outputs.result_header_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/molecular-utility-scope.py
  utility-inputs:
    needs: scope
    if: >-
      !inputs.scope_only && needs.scope.outputs.recognition_power_only != 'true' &&
      needs.scope.outputs.touch_controls_only != 'true' && needs.scope.outputs.runtime_switch_only != 'true' &&
      needs.scope.outputs.result_header_only != 'true' && needs.scope.outputs.utility_navigation_only != 'true' &&
      needs.scope.outputs.potential_display_only != 'true' && needs.scope.outputs.native_state_only != 'true' &&
      needs.scope.outputs.compact_example_only != 'true' && needs.scope.outputs.mobile_header_only != 'true' &&
      needs.scope.outputs.desktop_header_only != 'true' &&
      needs.scope.outputs.initial_pose_power_only != 'true' &&
      needs.scope.outputs.mobile_viewer_only != 'true' && needs.scope.outputs.print_labels_only != 'true' &&
      needs.scope.outputs.utility_desktop_only != 'true' && needs.scope.outputs.desktop_help_only != 'true' &&
      needs.scope.outputs.refinement_desktop_only != 'true' &&
      needs.scope.outputs.spatial_desktop_only != 'true' &&
      needs.scope.outputs.sequence_desktop_only != 'true' &&
      needs.scope.outputs.protein_desktop_only != 'true' &&
      needs.scope.outputs.history_desktop_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Exact committed catalogue, frontend and direct native ADMET contracts
        run: |
          uv run --locked python scripts/record-study-catalogue.py --check
          uv run --locked python scripts/generate-capability-catalog.py --check
          cd frontend
          npx vitest run \
            src/examples/ExampleActions.test.tsx \
            src/guided/MolecularReview.test.tsx \
            src/guided/Questionnaire.test.tsx \
            src/guided/QuestionnaireGuidance.test.tsx \
            src/guided/SinglePageTask.test.tsx \
            src/App.test.tsx \
            src/operations/PropertyForm.test.tsx \
            src/operations/PropertyFormFileVerification.test.tsx \
            src/chemistry/StateForm.test.tsx \
            src/chemistry/LibraryScreenForm.test.tsx \
            src/chemistry/LibraryScreenTemplate.test.tsx \
            src/chemistry/MolecularToolReview.test.tsx \
            src/utilities/ImageMoleculeInput.test.tsx \
            src/utilities/ImageMoleculeInput.action.test.tsx \
            src/utilities/useRecognitionBridge.test.tsx \
            src/utilities/useRecognitionRequest.test.tsx \
            src/utilities/recognition-foreground.test.ts \
            src/utilities/recognition-host-bridge.test.ts \
            src/utilities/recognition-host-foreground.test.ts \
            src/utilities/UtilityImageTask.test.tsx \
            src/utilities/ImageRecognition.test.tsx \
            src/utilities/recognition-locale.test.tsx \
            src/utilities/BackendControls.test.tsx \
            src/operations/AssetPicker.test.tsx \
            src/operations/AssetPickerSources.test.tsx \
            src/operations/AssetPickerImageSource.test.tsx \
            src/diffsbdd/ReferencePicker.test.tsx \
            src/diffsbdd/ReferencePickerUpload.test.tsx \
            src/diffsbdd/ReferencePickerLifecycle.test.tsx \
            src/diffsbdd/useReferenceSelection.test.tsx \
            src/editors/native-molecular-viewport.test.ts \
            src/editors/molecule-readiness.test.ts \
            src/editors/recognition-host-editor.test.ts \
            src/editors/ketcher-conversions.test.ts \
            src/operations/useAssetUpload.image.test.tsx \
            src/integrations/BoltzInputs.test.tsx \
            src/integrations/Mol1Form.test.tsx \
            src/presentation/PredictionEntityEditing.test.tsx \
            src/research/SdfRecordPicker.test.tsx \
            src/presentation/MoleculeImage.test.tsx \
            src/presentation/depiction-renderer.test.ts \
            src/publication/FigureExport.test.tsx \
            src/admet/AdmetForm.test.tsx \
            src/admet/AdmetResults.test.tsx \
            src/admet/EndpointValue.test.tsx \
            src/utilities/UtilityBrainSubmission.test.tsx \
            src/utilities/UtilityTask.test.tsx \
            src/utilities/UtilityTaskResult.test.tsx \
            src/utilities/UtilitySinglePage.test.tsx \
            src/admet/BrainScope.test.tsx \
            src/utilities/UtilityWorkspace.test.tsx \
            src/studio/Navigation.test.tsx \
            src/studio/MethodSwitch.test.tsx \
            src/studio/research-modules.test.ts \
            src/presentation/ResearchTable.test.tsx \
            src/presentation/MetricScatter.test.tsx \
            src/viewer/PoseSession.test.tsx \
            src/viewer/pose-plan.test.ts
          cd ..
          uv run --locked pytest -q tests/test_admet.py tests/test_brain_profile.py tests/test_molecular_utility_scope.py tests/test_capabilities.py tests/test_example_pins.py tests/test_library_screen.py tests/test_library_evidence.py
          uv run --locked ruff check src/opendde_workbench/recognition_companion.py tests/test_recognition_companion.py tests/test_recognition_companion_wheel.py server_tests/test_utility_image_browser.py
          uv build --wheel
          uv run --locked pytest -q tests/test_recognition_companion.py tests/test_recognition_companion_wheel.py tests/test_utility_tools.py tests/test_compute_service.py tests/test_compute_msa_protocol.py tests/test_harness_admission.py
          uv run --locked ruff check server_tests/utility_workspace_capture.py
          uv run --locked ruff check scripts/record-study-catalogue.py scripts/molecular-utility-scope.py tests/test_brain_profile.py tests/test_molecular_utility_scope.py server_tests/test_brain_profile_browser.py server_tests/test_molecular_review_workspace_browser.py server_tests/molecular_review_capture.py src/opendde_workbench/admet/contract.py src/opendde_workbench/admet/presentation.py src/opendde_workbench/capabilities/definitions.py src/opendde_workbench/capabilities/modalities.py src/opendde_workbench/task_history/kinds.py src/opendde_workbench/examples/stat6/task_requests.py src/opendde_workbench/examples/stat6/guidance.py src/opendde_workbench/examples/pin_validation.py
      - name: Retrieve sealed native outputs without starting a prediction engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked python - <<'PY'
          import os, urllib.request
          from pathlib import Path
          from opendde_workbench.examples.stat6_bundle_release import URL
          target = Path(os.environ["RUNNER_TEMP"]) / "stat6-reviewed-results.zip"
          urllib.request.urlretrieve(URL, target)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"WB_REVIEWED_STAT6_ARCHIVE={target}\n")
          PY
      - name: Native retained-output browser acceptance with prediction disabled
        run: |
          uv run --locked playwright install --with-deps chromium
          google-chrome --version
          uv run --locked python -c 'from server_tests.molecular_review_capture import verify_review_fonts; print(verify_review_fonts())'
          uv run --locked python -m pytest -q server_tests/test_brain_profile_browser.py server_tests/test_molecular_review_workspace_browser.py --basetemp "$RUNNER_TEMP/brain-profile-browser"
          uv run --locked python -m pytest -q server_tests/test_recognition_locale_browser.py server_tests/test_utility_image_browser.py --basetemp "$RUNNER_TEMP/utility-image-browser"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molecular-utility-native-evidence
          path: |
            outputs/brain-profile
            outputs/molecular-review-workspace
            outputs/recognition-locale
            outputs/utility-image
          if-no-files-found: warn

  explicit-recognition-power:
    needs: scope
    if: ${{ !inputs.scope_only && needs.scope.outputs.recognition_power_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Image import, explicit service power and checked bridge state
        working-directory: frontend
        run: >-
          npx vitest run src/utilities/useRecognitionRequest.test.tsx
          src/utilities/useRecognitionBridge.test.tsx src/utilities/recognition-host-bridge.test.ts
          src/utilities/recognition-host-foreground.test.ts src/utilities/recognition-foreground.test.ts
          src/utilities/ImageMoleculeInput.test.tsx src/utilities/ImageMoleculeInput.action.test.tsx
          src/utilities/UtilityImageTask.test.tsx src/workflows/WorkflowCenter.test.tsx
      - name: Wheel resources and default-off task and import controls in Chrome
        run: |
          uv sync --locked --group dev --group browser
          google-chrome --version
          uv run --locked ruff check scripts/molecular-utility-scope.py server_tests/test_{utility_image,module_backend_switch}_browser.py
          uv build --wheel
          uv run --locked pytest -q tests/test_recognition_companion.py tests/test_recognition_companion_wheel.py tests/test_molecular_utility_scope.py
          uv run --locked python -m pytest -q server_tests/test_utility_image_browser.py server_tests/test_module_backend_switch_browser.py --basetemp "$RUNNER_TEMP/explicit-power"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explicit-backend-power-evidence
          path: |
            outputs/utility-image
            outputs/module-backend-switches
          if-no-files-found: warn

  contextual-backends:
    needs: scope
    if: >-
      !inputs.scope_only && needs.scope.outputs.runtime_switch_only == 'true' &&
      needs.scope.outputs.module_power_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Contextual backend, utility, workflow and example switches
        if: needs.scope.outputs.backend_placement_only == 'true' && needs.scope.outputs.module_backend_only != 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/utilities/BackendControls.test.tsx
          src/utilities/UtilityWorkspace.test.tsx src/studio/TaskWorkspace.test.tsx
          src/examples/ExampleActions.test.tsx src/examples/ExampleResultSet.test.tsx
          src/workflows/WorkflowCenter.test.tsx src/App.test.tsx
      - name: Module navigation, task switches and utility controls
        if: needs.scope.outputs.module_backend_only == 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/utilities/BackendControls.test.tsx
          src/utilities/UtilityWorkspace.test.tsx
          src/studio/TaskWorkspace.test.tsx src/studio/ModuleWorkspaceNavigation.test.tsx
          src/studio/MethodSwitch.test.tsx src/App.test.tsx
          src/discovery/TargetResearchForm.test.tsx
      - name: Backend switches and directly changed surfaces
        if: needs.scope.outputs.backend_placement_only != 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/utilities/BackendControls.test.tsx src/utilities/UtilityWorkspace.test.tsx
          src/studio/MethodSwitch.test.tsx src/studio/TaskWorkspace.test.tsx src/App.test.tsx
          src/workflows/WorkflowCenter.test.tsx src/poses/PosePlanRun.test.tsx
          src/poses/PoseWorkspace.test.tsx src/regions/RegionWorkspace.test.tsx
          src/viewer/PreviewAvailability.test.tsx src/discovery/TargetResearchForm.test.tsx
          src/editors/AlignedEditAction.test.tsx src/operations/CovalentEditor.test.tsx
          src/admet/AdmetResults.test.tsx src/chemistry/LibraryScreenResults.test.tsx
          src/chemistry/StateResults.test.tsx src/datasets/CandidateHandoff.test.tsx
          src/diffsbdd/DiffResults.test.tsx src/discovery/ReferenceImportResults.test.tsx
          src/discovery/TargetResearchResults.test.tsx src/docking/DockingResults.test.tsx
          src/humanization/HumanizationResults.test.tsx src/pockets/PocketResults.test.tsx
          src/pockets/PocketResults.return.test.tsx src/poses/PoseResults.test.tsx
          src/receptors/ReceptorResults.test.tsx src/research/ResearchWorkspace.test.tsx
          src/simulations/SimulationResults.test.tsx src/operations/StructureComparisonResults.test.tsx
      - name: Canonical mappings and default-off admission
        if: needs.scope.outputs.backend_placement_only != 'true'
        run: |
          uv sync --locked --group dev --group browser
          uv run --locked ruff check src/opendde_workbench/runtime_controls.py src/opendde_workbench/discovery/routes.py server_tests/test_module_backend_switch_browser.py tests/test_utility_tools.py scripts/molecular-utility-scope.py tests/test_molecular_utility_scope.py
          uv run --locked pytest -q tests/test_utility_tools.py tests/test_discovery.py tests/test_engine_registry.py tests/test_harness_admission.py tests/test_molecular_utility_scope.py
      - name: Check precise CI scope and browser test sources
        if: needs.scope.outputs.backend_placement_only == 'true'
        run: |
          uv sync --locked --group dev --group browser
          uv run --locked ruff check scripts/molecular-utility-scope.py server_tests/test_module_backend_switch_browser.py server_tests/test_result_handoff_browser.py tests/test_molecular_utility_scope.py
          uv run --locked pytest -q tests/test_molecular_utility_scope.py
      - name: Compute power admission protects unresolved native launches
        if: needs.scope.outputs.task_power_only == 'true'
        run: |
          uv run --locked ruff check src/opendde_workbench/api.py src/opendde_workbench/harness_service.py tests/test_compute_power_admission.py
          uv run --locked pytest -q tests/test_compute_power_admission.py
      - name: Exercise the actual backend switches in Chrome
        run: |
          google-chrome --version
          uv run --locked python -m pytest -x -q server_tests/test_module_backend_switch_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextual-backend-evidence
          path: outputs/module-backend-switches/

  module-power:
    needs: scope
    if: ${{ !inputs.scope_only && needs.scope.outputs.module_power_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Shared switches and selected screening stages
        if: needs.scope.outputs.composed_power_only != 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/utilities/BackendControls.test.tsx
          src/datasets/ScreeningForm.test.tsx src/datasets/screening-readiness.test.ts
          src/studio/ModuleWorkspaceNavigation.test.tsx src/studio/TaskWorkspace.test.tsx
      - name: Backend switches for compound tools, example previews and selected workflow steps
        if: needs.scope.outputs.composed_power_only == 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/utilities/BackendControls.test.tsx
          src/examples/ExampleActions.test.tsx src/operations/ToolCenter.test.tsx
          src/poses/PoseWorkspace.test.tsx src/regions/RegionWorkspace.test.tsx
          src/workflows/WorkflowCenter.test.tsx
      - name: Default-off behavior and operation-to-engine mapping
        if: needs.scope.outputs.composed_power_only == 'true'
        run: |
          uv sync --locked --group dev --group browser
          uv run --locked ruff check src/opendde_workbench/runtime_controls.py tests/test_utility_tools.py
          uv run --locked pytest -q tests/test_utility_tools.py
      - name: Contextual power controls in Chrome without scientific execution
        if: needs.scope.outputs.composed_power_only != 'true'
        run: |
          uv sync --locked --group dev --group browser
          uv run --locked ruff check scripts/molecular-utility-scope.py tests/test_molecular_utility_scope.py server_tests/browser_platform.py server_tests/test_{module_backend_switch,screening_power}_browser.py
          uv run --locked pytest -q tests/test_molecular_utility_scope.py
          uv run --locked python -m pytest -x -q server_tests/test_{module_backend_switch,screening_power}_browser.py
      - name: Verify every research module and task switch in Chrome
        if: needs.scope.outputs.composed_power_only == 'true'
        run: |
          uv run --locked ruff check scripts/molecular-utility-scope.py tests/test_molecular_utility_scope.py server_tests/test_module_backend_switch_browser.py
          uv run --locked pytest -q tests/test_molecular_utility_scope.py
          uv run --locked python -m pytest -x -q server_tests/test_module_backend_switch_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-power-evidence
          path: |
            outputs/module-backend-switches/
            outputs/screening-power/

