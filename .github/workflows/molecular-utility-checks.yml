          src/datasets/CandidateView.test.tsx src/integrations/InteractionResults.test.tsx
      - name: Restore reviewed retained candidates into isolated scope
        env:
          GH_TOKEN: ${{ github.token }}
          WB_HOME: ${{ runner.temp }}/x-dde-candidate-inspection
          WB_STATE_DIR: ${{ runner.temp }}/x-dde-candidate-inspection/state
        run: |
          uv sync --locked --group dev --group browser
          uv run --locked ruff check scripts/molecular-utility-scope.py tests/test_molecular_utility_scope.py server_tests/test_candidate_inspection_desktop.py
          if [[ '${{ needs.scope.outputs.screening_desktop_only }}' == 'true' ]]; then
            uv run --locked ruff check server_tests/test_del_desktop_review.py
          fi
          if [[ '${{ needs.scope.outputs.result_theme_only }}' == 'true' ]]; then
            uv run --locked ruff check server_tests/test_native_result_theme_browser.py
          fi
          if [[ '${{ needs.scope.outputs.desktop_result_layout_only }}' == 'true' ]]; then
            uv run --locked ruff check server_tests/test_compact_result_header_browser.py
          fi
          uv run --locked pytest -q tests/test_molecular_utility_scope.py
          families=(stat6 del)
          for family in "${families[@]}"; do
            readarray -t source < <(.venv/bin/python -c "from opendde_workbench.examples.${family}_bundle_release import URL; print('\\n'.join(URL.rsplit('/', 2)[-2:]))")
            test "${#source[@]}" -eq 2
            [[ "${source[0]}" == examples-v2 || "${source[0]}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "${source[1]}" =~ ^(stat6|del6)-reviewed-results-v[0-9]+\.zip$ ]]
            gh release download "${source[0]}" --repo "$GITHUB_REPOSITORY" --pattern "${source[1]}" --dir "$RUNNER_TEMP"
            .venv/bin/python -c "import sys; from pathlib import Path; from opendde_workbench.examples.${family}_bundle_release import SHA256; from opendde_workbench.examples.bundle import restore_bundle; from opendde_workbench.settings import Settings; print(restore_bundle(Path(sys.argv[1]), Settings.from_env(), SHA256))" "$RUNNER_TEMP/${source[1]}"
          done
          .venv/bin/python server_tests/prepare_visual_components.py --components ketcher
      - name: Native Chrome selection, original bytes and research figure
        env:
          WB_HOME: ${{ runner.temp }}/x-dde-candidate-inspection
          WB_STATE_DIR: ${{ runner.temp }}/x-dde-candidate-inspection/state
        run: |
          google-chrome --version
          scenarios=(server_tests/test_candidate_inspection_desktop.py::test_retained_candidate_desktop_workspaces)
          if [[ '${{ needs.scope.outputs.desktop_result_layout_only }}' == 'true' ]]; then
            scenarios=(server_tests/test_compact_result_header_browser.py::test_retained_result_headers_at_desktop_sizes)
          elif [[ '${{ needs.scope.outputs.result_theme_only }}' == 'true' ]]; then
            scenarios=(server_tests/test_native_result_theme_browser.py::test_native_result_controls_follow_theme)
          elif [[ '${{ needs.scope.outputs.screening_desktop_only }}' == 'true' ]]; then
            scenarios=(
              server_tests/test_candidate_inspection_desktop.py::test_retained_screening_desktop
              server_tests/test_del_desktop_review.py::test_del_first_screen_at_1024_by_600
            )
          fi
          uv run --locked python -m pytest -x -q "${scenarios[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-inspection-desktop
          path: outputs/candidate-inspection/

