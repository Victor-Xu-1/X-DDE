        working-directory: frontend
        run: >-
          npx vitest run src/integrations/ProteinInterfaceResults.test.tsx
          src/guided/Hint.test.tsx
          src/structure-comparison/ComparisonScene.test.ts
          src/presentation/ResearchTable.test.tsx src/presentation/ResearchTabs.test.tsx
      - name: Verify both retained protein workspaces in Chrome
        env:
          GH_TOKEN: ${{ github.token }}
          WB_HOME: ${{ runner.temp }}/x-dde-protein-review
          WB_STATE_DIR: ${{ runner.temp }}/x-dde-protein-review/state
        run: |
          uv sync --locked --group dev --group browser
          uv run --locked ruff check scripts/molecular-utility-scope.py tests/test_molecular_utility_scope.py server_tests/test_protein_review_desktop.py
          uv run --locked pytest -q tests/test_molecular_utility_scope.py
          readarray -t source < <(.venv/bin/python -c 'from opendde_workbench.examples.stat6_bundle_release import URL; print("\n".join(URL.rsplit("/", 2)[-2:]))')
          test "${#source[@]}" -eq 2
          [[ "${source[0]}" == examples-v2 || "${source[0]}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${source[1]}" =~ ^stat6-reviewed-results-v[0-9]+\.zip$ ]]
          gh release download "${source[0]}" --repo "$GITHUB_REPOSITORY" --pattern "${source[1]}" --dir "$RUNNER_TEMP"
          .venv/bin/python server_tests/prepare_reviewed_stat6_cases.py "$RUNNER_TEMP/${source[1]}"
          google-chrome --version
          .venv/bin/python -m pytest -x -q server_tests/test_protein_review_desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-protein-review-evidence
          path: outputs/protein-review-desktop/

