          WB_HOME="$RUNNER_TEMP/utility-graphics" WB_STATE_DIR="$RUNNER_TEMP/utility-graphics/state" \
            uv run --locked python server_tests/prepare_visual_components.py --components ketcher
          uv run --locked ruff check scripts/molecular-utility-scope.py tests/test_molecular_utility_scope.py server_tests/test_result_handoffs_desktop.py
          uv run --locked python -m pytest -x -q tests/test_molecular_utility_scope.py
          run_selection=()
          if [[ "$LIGAND_CAMERA_ONLY" == true ]]; then
            run_selection=(-k reviewed_property_poses_open_without_new_calculation)
          fi
          if [[ "$SHORT_CHEMISTRY_DESKTOP_ONLY" == true ]]; then
            uv run --locked ruff check server_tests/test_short_chemistry_desktop.py
            run_selection+=(server_tests/test_short_chemistry_desktop.py)
          fi
          uv run --locked python -m pytest -x -q server_tests/test_result_handoffs_desktop.py "${run_selection[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-handoff-desktop-evidence
          path: outputs/result-handoffs-desktop/
          if-no-files-found: warn

  utility-result-desktop:
    needs: scope
    if: ${{ !inputs.scope_only && needs.scope.outputs.utility_result_desktop_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Accepted results, exact input identity and direct questionnaire consumers
        working-directory: frontend
        run: >-
          npx vitest run src/utilities/UtilitySinglePage.test.tsx
          src/utilities/UtilityTaskResult.test.tsx src/utilities/UtilityWorkspace.test.tsx
          src/utilities/UtilityImageTask.test.tsx src/guided/SinglePageTask.test.tsx
          src/guided/Questionnaire.test.tsx
      - name: Verify the result workspace against a retained native utility result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv sync --locked --group dev --group browser
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
          export WB_RETAINED_UTILITY="$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          export WB_UTILITY_GRAPHICS="$RUNNER_TEMP/utility-graphics/state/deployment.json"
          WB_HOME="$RUNNER_TEMP/utility-graphics" WB_STATE_DIR="$RUNNER_TEMP/utility-graphics/state" \
            uv run --locked python server_tests/prepare_visual_components.py --components ketcher
          uv run --locked ruff check scripts/molecular-utility-scope.py tests/test_molecular_utility_scope.py server_tests/test_utility_result_desktop.py
          uv run --locked python -m pytest -x -q tests/test_molecular_utility_scope.py server_tests/test_utility_result_desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utility-result-desktop-evidence
          path: outputs/utility-result-desktop/
          if-no-files-found: warn

  utility-desktop:
    needs: scope
    if: ${{ !inputs.scope_only && needs.scope.outputs.utility_desktop_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Tool selection, input persistence and screenshot actions
        working-directory: frontend
        run: >-
