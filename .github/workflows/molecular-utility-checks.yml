          src/utilities/ImageRecognition.test.tsx src/utilities/ImageMoleculeInput.test.tsx
          src/utilities/UtilityImageTask.test.tsx
      - name: Desktop Chrome tool rail and native molecule review
        run: |
          uv sync --locked --group dev --group browser
          export WB_HOME="$RUNNER_TEMP/x-dde-desktop-utility"
          export WB_STATE_DIR="$WB_HOME/state"
          uv run --locked python server_tests/prepare_visual_components.py --components ketcher
          uv run --locked ruff check scripts/molecular-utility-scope.py server_tests/test_utility_{navigation,image}_browser.py
          uv build --wheel
          uv run --locked pytest -q tests/test_molecular_utility_scope.py tests/test_recognition_companion.py tests/test_recognition_companion_wheel.py
          uv run --locked python -m pytest -q server_tests/test_utility_navigation_browser.py::test_short_desktop_recognition_tools_remain_visible_together server_tests/test_utility_navigation_browser.py::test_desktop_tools_fit_one_strip_and_keep_a_large_preview
          uv run --locked python -m pytest -q server_tests/test_utility_image_browser.py::test_short_desktop_image_dialog_leaves_room_for_the_editor --basetemp "$RUNNER_TEMP/recognition-desktop"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utility-desktop-evidence
          path: outputs/utility-navigation/

  utility-navigation:
