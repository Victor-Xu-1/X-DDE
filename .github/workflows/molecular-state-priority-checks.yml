name: Bounded molecular state priority checks
on:
  push:
    paths: &state_paths
      - "src/opendde_workbench/chemistry/states.py"
      - "src/opendde_workbench/chemistry/options.py"
      - "frontend/src/chemistry/generated.ts"
      - "server_tests/test_molecular_states.py"
      - ".github/workflows/molecular-state-priority-checks.yml"
  pull_request:
    paths: *state_paths
permissions:
  contents: read
jobs:
  native-state-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Real state ordering, pH, mappings, defined stereo and native conformer consumers
        run: uv run --locked --with rdkit==2026.3.6 --with dimorphite-dl==2.1.0 pytest -q server_tests/test_molecular_states.py tests/test_chemistry_contract.py
      - name: Only generated setting consumers
        working-directory: frontend
        run: npx vitest run src/chemistry/model.test.ts src/chemistry/StateForm.test.tsx
      - run: uv run --locked ruff check src/opendde_workbench/chemistry/states.py server_tests/test_molecular_states.py
