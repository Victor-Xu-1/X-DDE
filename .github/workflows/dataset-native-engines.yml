name: Dataset native engines acceptance
on:
  workflow_dispatch:
    inputs:
      engine:
        description: Actual isolated engine; never a whole-repository suite
        type: choice
        default: drugclip
        options: [drugclip, deli, gnina]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Reserve space on this disposable CI runner for official model files
        if: inputs.engine == 'drugclip'
        run: |
          for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost; do
            if [ -d "$path" ] && [ ! -L "$path" ]; then sudo rm -rf -- "$path"; fi
          done
          df -h .
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Actual public scientific inputs through API, native container, Worker and downloads
        env:
          WB_DATASET_ENGINE: ${{ inputs.engine }}
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
        run: uv run --locked --with h5py==3.14.0 --with numpy==1.26.4 pytest -q -s server_tests/test_native_dataset_engines.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset-${{ inputs.engine }}-acceptance
          path: |
            server_tests/evidence/datasets
            /tmp/pytest-of-runner/pytest-*/**/install.log
            /tmp/pytest-of-runner/pytest-*/**/jobs/*/console.log
          if-no-files-found: ignore
          retention-days: 7
