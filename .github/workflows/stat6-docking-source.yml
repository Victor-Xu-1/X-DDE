name: STAT6 docking source lineage
on:
  pull_request:
    paths: &paths
      - 'src/opendde_workbench/examples/stat6/reference_inputs.py'
      - 'src/opendde_workbench/examples/receptor_provenance.py'
      - 'src/opendde_workbench/examples/stat6/prepared_inputs.py'
      - 'src/opendde_workbench/examples/stat6/module-revisions.json'
      - 'src/opendde_workbench/examples/stat6/catalogue-profiles.json'
      - 'src/opendde_workbench/examples/stat6_bundle_release.py'
      - 'tests/test_stat6_predicted_references.py'
      - 'tests/test_receptor_copy_provenance.py'
      - '.github/workflows/stat6-docking-source.yml'
  push:
    paths: *paths
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - run: >-
          uv run --locked ruff check src/opendde_workbench/examples/stat6/reference_inputs.py
          src/opendde_workbench/examples/receptor_provenance.py
          src/opendde_workbench/examples/stat6/prepared_inputs.py
          tests/test_stat6_predicted_references.py tests/test_receptor_copy_provenance.py
      - run: >-
          uv run --locked pytest -q tests/test_stat6_predicted_references.py
          tests/test_example_native_lineage.py tests/test_receptor_copy_provenance.py
          -k 'docking_retains_exact_prediction or predicted_references_are_opt_in or prediction_construct or native_graph_cannot_admit or ensemble_reference or docking_copies or unproved_or_modified_copies or identical_user_file'
