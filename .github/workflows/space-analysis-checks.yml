name: Native space analysis scoped checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/opendde_workbench/space/**'
      - 'src/opendde_workbench/receptors/image.py'
      - 'src/opendde_workbench/receptors/native-requirements.txt'
      - 'src/opendde_workbench/pockets/manifest.py'
      - 'server_tests/caver_native_probe.py'
      - 'tests/test_caver_profiles.py'
      - '.github/workflows/space-analysis-checks.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest -q tests/test_caver_profiles.py
      - name: Stable native protocol on official and real drug-complex inputs
        run: uv run --locked python server_tests/caver_native_probe.py --output "$RUNNER_TEMP/caver-native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caver-native-evidence
          path: |
            ${{ runner.temp }}/caver-native/protocol-acceptance.json
            ${{ runner.temp }}/caver-native/drug-channels.json
            ${{ runner.temp }}/caver-native/*/native.log
            ${{ runner.temp }}/caver-native/*/native/analysis/*.csv
