name: Shared hydrogen display policy
on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/src/editors/ketcher-hydrogens*'
      - 'frontend/src/editors/ketcher-appearance*'
      - 'frontend/src/editors/Editors.tsx'
      - 'frontend/src/editors/scientificEditor.ts'
      - 'frontend/src/editors/molstar-appearance*'
      - 'frontend/src/presentation/depiction-renderer*'
      - 'frontend/src/viewer/donor-hydrogens*'
      - 'frontend/src/viewer/style.ts'
      - 'frontend/src/viewer/scene.ts'
      - 'frontend/src/viewer/molstar-sticks.ts'
      - 'server_tests/*hydrogen*'
      - '.github/workflows/ketcher-depiction-checks.yml'
permissions:
  contents: read
jobs:
  display-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WB_AUTO_DEPLOY: '0'
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Check only shared display policy and its direct consumers
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          cd frontend
          npx vitest run src/editors/ketcher-hydrogens.test.ts src/editors/ketcher-appearance.test.ts src/editors/molstar-appearance.test.ts src/editors/scientificEditor.test.ts src/presentation/depiction-renderer.test.ts src/presentation/molecular-record.test.ts src/viewer/donor-hydrogens.test.ts src/viewer/style.test.ts src/viewer/source-layout.test.ts src/simulations/molstar-figure.test.ts
          cd ..
          uv sync --locked --group dev --group browser
      - name: Prepare native graphical service only
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-hydrogen" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-hydrogen/state" >> "$GITHUB_ENV"
          WB_HOME="$RUNNER_TEMP/x-dde-hydrogen" WB_STATE_DIR="$RUNNER_TEMP/x-dde-hydrogen/state" uv run --locked python server_tests/prepare_visual_components.py --components ketcher
          uv run --locked python -m playwright install --with-deps chromium
      - name: Inspect real explicit-H input and editor without scientific jobs
        run: |
          mkdir -p server_tests/evidence/hydrogen-policy
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/hydrogen-policy/service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" >/dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" >/dev/null
          .venv/bin/python -m pytest -q server_tests/test_hydrogen_policy_browser.py
          uv run --locked --with rdkit==2026.3.6 python server_tests/hydrogen_chemistry_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydrogen-policy-evidence
          path: server_tests/evidence/hydrogen-policy
