name: Ketcher molecule drawing checks
on:
  push:
    branches: ['**']
    paths:
      - 'frontend/src/presentation/depiction-renderer*'
      - 'frontend/src/editors/ketcher-appearance*'
      - 'frontend/src/editors/scientificEditor.ts'
      - 'server_tests/test_ketcher_depiction_browser.py'
      - '.github/workflows/ketcher-depiction-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-depiction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WB_AUTO_DEPLOY: '0'
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Isolated runner state
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-ketcher" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-ketcher/state" >> "$GITHUB_ENV"
      - name: Locked build and focused native drawing contracts
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          cd frontend
          npx vitest run src/presentation/depiction-renderer.test.ts src/presentation/molecular-record.test.ts src/editors/ketcher-appearance.test.ts src/editors/scientificEditor.test.ts
          cd ..
          uv sync --locked --group dev --group browser
      - name: Restore native reference outputs and Ketcher only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
          .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          .venv/bin/python server_tests/prepare_visual_components.py
      - name: Real browser chemistry and export verification
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/ketcher-depiction
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/ketcher-depiction/service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null
          .venv/bin/python -m pytest -q server_tests/test_ketcher_depiction_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ketcher-depiction-evidence
          path: server_tests/evidence/ketcher-depiction
