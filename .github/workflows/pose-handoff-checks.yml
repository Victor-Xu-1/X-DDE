name: Selected pose continuity checks
on:
  workflow_dispatch:
  push:
    paths: &pose_handoff_paths
      - "frontend/src/viewer/PoseSession*"
      - "frontend/src/viewer/PoseStudyInput*"
      - "frontend/src/viewer/usePoseHandoff*"
      - "frontend/src/viewer/pose-plan*"
      - "frontend/src/viewer/pose-study-input.css"
      - "frontend/src/viewer/StructureViewer*"
      - "frontend/src/viewer/StructureViewport*"
      - "frontend/src/viewer/pose-source*"
      - "frontend/src/viewer/pose-types.ts"
      - "frontend/src/viewer/usePoseOptimization*"
      - "frontend/src/presentation/MolecularPreview.tsx"
      - "frontend/src/presentation/ResearchTabs*"
      - "scripts/research-tabs-scope.py"
      - "tests/test_research_tabs_scope.py"
      - "server_tests/test_research_tabs_browser.py"
      - "frontend/src/docking/DockingResults*"
      - "frontend/src/docking/DockingPoseSummary.tsx"
      - "scripts/docking-result-scope.py"
      - "tests/test_docking_result_scope.py"
      - "frontend/src/presentation/CandidateReviewBar.tsx"
      - "frontend/src/presentation/candidate-review-bar.css"
      - "frontend/src/docking/PoseTable*"
      - "frontend/src/docking/PoseComparison*"
      - "frontend/src/datasets/CandidateHandoff*"
      - "frontend/src/datasets/CandidateView*"
      - "frontend/src/poses/PoseDetail*"
      - "frontend/src/poses/PoseResults*"
      - "frontend/src/admet/AdmetResults*"
      - "frontend/src/admet/AdmetSelectedMolecule*"
      - "frontend/src/chemistry/StateCollectionPreview*"
      - "frontend/src/chemistry/StateResults*"
      - "frontend/src/diffsbdd/DiffResults*"
      - "frontend/src/research/ObjectInspector*"
      - "frontend/src/research/ResearchWorkspace*"
      - "server_tests/prepare_pose_handoff.py"
      - "server_tests/test_pose_handoff_browser.py"
      - "server_tests/test_docking_table_browser.py"
      - ".github/workflows/pose-handoff-checks.yml"
      # Candidate-specific drafts use generated-candidate-checks.yml; shared continuity stays here.
      - "!frontend/src/diffsbdd/DiffResults*"
      # Fixed-case inspection and its personal-result defaults have exact stage checks.
      - "!frontend/src/datasets/CandidateView*"
      - "!frontend/src/presentation/MolecularPreview*"
      - "!frontend/src/viewer/PoseSession*"
      - "!frontend/src/viewer/StructureViewer*"
  pull_request:
    paths: *pose_handoff_paths
permissions:
  contents: read
jobs:
  workspace-scope:
    uses: ./.github/workflows/workspace-preview-checks.yml
    with:
      scope_only: true
  framing-scope:
    uses: ./.github/workflows/figure-framing-scope.yml
  result-scope:
    uses: ./.github/workflows/docking-result-scope.yml
  utility-scope:
    uses: ./.github/workflows/molecular-utility-checks.yml
    with:
      scope_only: true
  refinement-scope:
    runs-on: ubuntu-24.04
    outputs:
      refinement_only: ${{ steps.refinement.outputs.refinement_only }}
      admet_result_only: ${{ steps.admet.outputs.admet_result_only }}
      research_tabs_only: ${{ steps.tabs.outputs.research_tabs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: refinement
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/docking-refinement-scope.py
      - id: admet
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/admet-workspace-scope.py
      - id: tabs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/research-tabs-scope.py
  pose-continuity:
    needs: [refinement-scope, utility-scope, result-scope, framing-scope, workspace-scope]
    if: needs.workspace-scope.outputs.file_navigation_only != 'true' && needs.framing-scope.outputs.framing_only != 'true' && needs.utility-scope.outputs.utility_only != 'true' && (needs.refinement-scope.outputs.refinement_only != 'true' && needs.refinement-scope.outputs.admet_result_only != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Select retained docking result checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
        shell: bash
        run: |
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base HEAD origin/main)
          fi
          only=true
          found=false
          while IFS= read -r file; do
            case "$file" in
              frontend/src/docking/PoseComparison.tsx|frontend/src/docking/PoseComparison.css|frontend/src/docking/DockingResultsEvidence*|frontend/src/presentation/CandidateReviewBar.tsx) found=true ;;
              frontend/src/presentation/CandidateReviewBar.tsx|frontend/src/presentation/candidate-review-bar.css|frontend/src/presentation/StructureWorkbench.tsx|frontend/src/pockets/PocketResults.tsx|frontend/src/pockets/PocketResults.test.tsx|server_tests/test_stat6_pocket_handoff_browser.py|.github/workflows/pocket-result-checks.yml|.github/workflows/pose-handoff-checks.yml|.github/workflows/task-layout-checks.yml|.github/workflows/user-interface-checks.yml) ;;
              frontend/src/docking/DockingResults.tsx|frontend/src/docking/DockingResults.test.tsx|frontend/src/docking/PoseTable.tsx|frontend/src/presentation/ResearchTable.tsx|frontend/src/presentation/ResearchTable.test.tsx|server_tests/test_docking_table_browser.py|.github/workflows/pose-handoff-checks.yml|.github/workflows/user-interface-checks.yml|docs/user-guide.md|pyproject.toml|uv.lock|frontend/package.json|frontend/package-lock.json|install.sh|install.ps1) ;;
              *) only=false ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          [[ "$found" = true ]] || only=false
          echo "overlay_only=$only" >> "$GITHUB_OUTPUT"
          chain_focus_only=true
          chain_focus_found=false
          while IFS= read -r file; do
            case "$file" in
              frontend/src/viewer/chain-visibility.ts) chain_focus_found=true ;;
              frontend/src/viewer/chain-visibility.test.ts|frontend/src/viewer/StructureViewport.tsx|frontend/src/viewer/frame.ts|frontend/src/viewer/source-layout.ts|frontend/src/viewer/source-layout.test.ts|frontend/src/proximity/FormReview.tsx|server_tests/test_ternary_job_review_browser.py|.github/workflows/proximity-form-checks.yml|.github/workflows/pose-handoff-checks.yml|.github/workflows/task-layout-checks.yml|pyproject.toml|uv.lock|frontend/package.json|frontend/package-lock.json|install.sh|install.ps1) ;;
              *) chain_focus_only=false ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          [[ "$chain_focus_found" = true ]] || chain_focus_only=false
          echo "chain_focus_only=$chain_focus_only" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Build locked frontend and isolated runtime
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          uv sync --locked --group dev --group browser
      - name: Pose controller, explicit choices, record identity and direct research consumers
        working-directory: frontend
        env:
          OVERLAY_ONLY: ${{ steps.scope.outputs.overlay_only }}
          CHAIN_FOCUS_ONLY: ${{ steps.scope.outputs.chain_focus_only }}
          DOCKING_PRESENTATION_ONLY: ${{ needs.result-scope.outputs.presentation_only }}
          DESKTOP_LAYOUT_ONLY: ${{ needs.result-scope.outputs.desktop_layout_only }}
          PAIRED_COMPARISON_ONLY: ${{ needs.result-scope.outputs.paired_comparison_only }}
        run: |
          if [ "$PAIRED_COMPARISON_ONLY" = true ]; then
            npx vitest run src/docking/DockingResults.test.tsx src/docking/PoseTable.test.tsx \
              src/simulations/BoundPoseComparison.test.tsx src/simulations/MolecularViewport.test.tsx
            exit
          fi
          if [ "$DESKTOP_LAYOUT_ONLY" = true ]; then
            npx vitest run src/docking/DockingResults.test.tsx src/docking/PoseTable.test.tsx
            exit
          fi
          if [ "$DOCKING_PRESENTATION_ONLY" = true ]; then
            npx vitest run src/docking/DockingResults.test.tsx src/docking/PoseTable.test.tsx \
              src/docking/DockingResultsEvidence.test.tsx src/docking/ReferenceComparison.test.tsx \
              src/presentation/ResearchTable.test.tsx src/pockets/PocketResults.test.tsx \
              src/diffsbdd/GeneratedCandidates.test.tsx
            exit
          fi
          if [ "$CHAIN_FOCUS_ONLY" = true ]; then
            npx vitest run src/viewer/StructureViewer.test.tsx src/viewer/chain-visibility.test.ts src/viewer/source-layout.test.ts src/viewer/pose-plan.test.ts src/viewer/capture.test.ts src/docking/DockingResults.test.tsx
            exit
          fi
          if [ "$OVERLAY_ONLY" = true ]; then
            npx vitest run src/docking/DockingResultsEvidence.test.tsx src/docking/DockingResults.test.tsx src/docking/PoseTable.test.tsx src/presentation/ResearchTable.test.tsx src/viewer/pose-plan.test.ts src/viewer/source-layout.test.ts src/viewer/focus-layout.test.ts src/viewer/contacts.test.ts src/viewer/style.test.ts src/viewer/StructureViewer.test.tsx
            exit
          fi
          npx vitest run src/viewer/PoseSession.test.tsx src/viewer/pose-source.test.ts \
          src/viewer/pose-plan.test.ts \
          src/viewer/usePoseOptimization.test.tsx src/viewer/StructureViewer.test.tsx \
          src/presentation/ResearchTabs.test.tsx \
          src/viewer/capture.test.ts src/viewer/useViewerSnapshot.test.ts \
          src/docking/DockingResults.test.tsx src/datasets/CandidateHandoff.test.tsx \
          src/docking/PoseTable.test.tsx src/docking/ReferenceComparison.test.tsx \
          src/presentation/ResearchTable.test.tsx \
          src/docking/poseScore.test.ts src/quality/QualityForm.test.tsx \
          src/poses/PoseResults.test.tsx src/admet/AdmetResults.test.tsx \
          src/chemistry/StateResults.test.tsx src/diffsbdd/DiffResults.test.tsx \
          src/operations/PropertyForm.test.tsx \
          src/research/SelectedAssetPreview.test.tsx src/research/ResearchWorkspace.test.tsx
      - name: Isolated native Chemistry and existing managed Ketcher
        if: needs.result-scope.outputs.presentation_only != 'true' && needs.refinement-scope.outputs.research_tabs_only != 'true' && steps.scope.outputs.overlay_only != 'true' && steps.scope.outputs.chain_focus_only != 'true'
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-pose-handoff" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-pose-handoff/state" >> "$GITHUB_ENV"
          WB_HOME="$RUNNER_TEMP/x-dde-pose-handoff" WB_STATE_DIR="$RUNNER_TEMP/x-dde-pose-handoff/state" .venv/bin/python server_tests/prepare_pose_handoff.py
      - name: Prepare the ephemeral CI browser for retained-source inspection
        if: needs.result-scope.outputs.presentation_only != 'true'
        run: uv run --locked playwright install chromium --with-deps
      - name: Verify the selected presentation scope
        if: needs.result-scope.outputs.presentation_only == 'true'
        run: |
          google-chrome --version
          uv run --locked ruff check scripts/docking-result-scope.py tests/test_docking_result_scope.py server_tests/test_docking_table_browser.py
          uv run --locked pytest -q tests/test_docking_result_scope.py
      - name: Real STAT6 pose, current/original versions, undo/redo, form navigation and downloads
        if: needs.result-scope.outputs.presentation_only != 'true' && needs.refinement-scope.outputs.research_tabs_only != 'true' && steps.scope.outputs.overlay_only != 'true' && steps.scope.outputs.chain_focus_only != 'true'
        run: |
          .venv/bin/python server_tests/prepare_visual_components.py --components ketcher
          uv run --locked python -m pytest -x -q server_tests/test_pose_handoff_browser.py
      - name: Current sealed STAT6 docking results; no new scientific calculation
        env:
          GH_TOKEN: ${{ github.token }}
          WB_HOME: ${{ runner.temp }}/x-dde-docking-table
          WB_STATE_DIR: ${{ runner.temp }}/x-dde-docking-table/state
        run: |
          readarray -t source < <(uv run --locked python -c 'from opendde_workbench.examples.stat6_bundle_release import URL; print("\n".join(URL.rsplit("/", 2)[-2:]))')
          test "${#source[@]}" -eq 2
          tag="${source[0]}"
          asset="${source[1]}"
          [[ "$tag" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|examples-v[0-9]+)$ ]]
          [[ "$asset" =~ ^stat6-reviewed-results-v[0-9]+\.zip$ ]]
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP" --skip-existing
          echo "WB_REVIEWED_STAT6_ARCHIVE=$RUNNER_TEMP/$asset" >> "$GITHUB_ENV"
          uv run --locked python server_tests/prepare_visual_components.py --components ketcher
      - name: Bilingual native docking table, linked fullscreen and complete original downloads
        env:
          WB_HOME: ${{ runner.temp }}/x-dde-docking-table
          WB_STATE_DIR: ${{ runner.temp }}/x-dde-docking-table/state
        run: uv run --locked python -m pytest -q server_tests/test_docking_table_browser.py
      - name: Shared FEP comparison with saved views and export
        if: needs.result-scope.outputs.paired_comparison_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37797255499 --repo "$GITHUB_REPOSITORY" --name native-simulation-evidence --dir outputs/native-simulations
          uv run --locked python -m pytest -x -q server_tests/test_simulation_structure_focus.py -k openfe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-selected-pose-evidence
          path: |
            outputs/pose-handoff/**
            outputs/docking-table/**
            outputs/native-simulations/openfe.rbfe/browser/structure-focus/**
