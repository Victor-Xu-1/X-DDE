name: Selected pose continuity checks
on:
  workflow_dispatch:
  push:
    paths: &pose_handoff_paths
      - "frontend/src/viewer/PoseSession*"
      - "frontend/src/viewer/PoseStudyInput*"
      - "frontend/src/viewer/usePoseHandoff*"
      - "frontend/src/viewer/pose-plan*"
      - "frontend/src/viewer/pose-study-input.css"
      - "frontend/src/viewer/StructureViewer*"
      - "frontend/src/viewer/StructureViewport*"
      - "frontend/src/viewer/pose-source*"
      - "frontend/src/viewer/pose-types.ts"
      - "frontend/src/viewer/usePoseOptimization*"
      - "frontend/src/presentation/MolecularPreview.tsx"
      - "frontend/src/presentation/ResearchTabs*"
      - "frontend/src/docking/DockingResults*"
      - "frontend/src/docking/PoseTable*"
      - "frontend/src/docking/PoseComparison*"
      - "frontend/src/datasets/CandidateHandoff*"
      - "frontend/src/datasets/CandidateView*"
      - "frontend/src/poses/PoseDetail*"
      - "frontend/src/poses/PoseResults*"
      - "frontend/src/admet/AdmetResults*"
      - "frontend/src/admet/AdmetSelectedMolecule*"
      - "frontend/src/chemistry/StateCollectionPreview*"
      - "frontend/src/chemistry/StateResults*"
      - "frontend/src/diffsbdd/DiffResults*"
      - "frontend/src/research/ObjectInspector*"
      - "frontend/src/research/ResearchWorkspace*"
      - "server_tests/prepare_pose_handoff.py"
      - "server_tests/test_pose_handoff_browser.py"
      - "server_tests/test_docking_table_browser.py"
      - ".github/workflows/pose-handoff-checks.yml"
      # Candidate-specific drafts use generated-candidate-checks.yml; shared continuity stays here.
      - "!frontend/src/diffsbdd/DiffResults*"
      # Fixed-case inspection and its personal-result defaults have exact stage checks.
      - "!frontend/src/datasets/CandidateView*"
      - "!frontend/src/presentation/MolecularPreview*"
      - "!frontend/src/viewer/PoseSession*"
      - "!frontend/src/viewer/StructureViewer*"
  pull_request:
    paths: *pose_handoff_paths
permissions:
  contents: read
jobs:
  refinement-scope:
    runs-on: ubuntu-24.04
    outputs:
      refinement_only: ${{ steps.refinement.outputs.refinement_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: refinement
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/docking-refinement-scope.py
  pose-continuity:
    needs: refinement-scope
    if: needs.refinement-scope.outputs.refinement_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Select exact structural-comparison checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
        shell: bash
        run: |
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base HEAD origin/main)
          fi
          only=true
          found=false
          while IFS= read -r file; do
            case "$file" in
              frontend/src/docking/PoseComparison.tsx|frontend/src/docking/PoseComparison.css) found=true ;;
              frontend/src/docking/DockingResults.tsx|frontend/src/docking/DockingResults.test.tsx|frontend/src/docking/PoseTable.tsx|frontend/src/presentation/ResearchTable.tsx|frontend/src/presentation/ResearchTable.test.tsx|server_tests/test_docking_table_browser.py|.github/workflows/pose-handoff-checks.yml|.github/workflows/user-interface-checks.yml|docs/user-guide.md|pyproject.toml|uv.lock|frontend/package.json|frontend/package-lock.json|install.sh|install.ps1) ;;
              *) only=false ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          [[ "$found" = true ]] || only=false
          echo "overlay_only=$only" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Build locked frontend and isolated runtime
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          uv sync --locked --group dev --group browser
      - name: Pose controller, explicit choices, record identity and direct research consumers
        working-directory: frontend
        env:
          OVERLAY_ONLY: ${{ steps.scope.outputs.overlay_only }}
        run: |
          if [ "$OVERLAY_ONLY" = true ]; then
            npx vitest run src/docking/DockingResults.test.tsx src/docking/PoseTable.test.tsx src/presentation/ResearchTable.test.tsx src/viewer/pose-plan.test.ts src/viewer/source-layout.test.ts src/viewer/focus-layout.test.ts src/viewer/contacts.test.ts src/viewer/style.test.ts src/viewer/StructureViewer.test.tsx
            exit
          fi
          npx vitest run src/viewer/PoseSession.test.tsx src/viewer/pose-source.test.ts \
          src/viewer/pose-plan.test.ts \
          src/viewer/usePoseOptimization.test.tsx src/viewer/StructureViewer.test.tsx \
          src/presentation/ResearchTabs.test.tsx \
          src/viewer/capture.test.ts src/viewer/useViewerSnapshot.test.ts \
          src/docking/DockingResults.test.tsx src/datasets/CandidateHandoff.test.tsx \
          src/docking/PoseTable.test.tsx src/docking/ReferenceComparison.test.tsx \
          src/presentation/ResearchTable.test.tsx \
          src/docking/poseScore.test.ts src/quality/QualityForm.test.tsx \
          src/poses/PoseResults.test.tsx src/admet/AdmetResults.test.tsx \
          src/chemistry/StateResults.test.tsx src/diffsbdd/DiffResults.test.tsx \
          src/operations/PropertyForm.test.tsx \
          src/research/SelectedAssetPreview.test.tsx src/research/ResearchWorkspace.test.tsx
      - name: Isolated native Chemistry and existing managed Ketcher
        if: steps.scope.outputs.overlay_only != 'true'
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-pose-handoff" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-pose-handoff/state" >> "$GITHUB_ENV"
          WB_HOME="$RUNNER_TEMP/x-dde-pose-handoff" WB_STATE_DIR="$RUNNER_TEMP/x-dde-pose-handoff/state" .venv/bin/python server_tests/prepare_pose_handoff.py
      - name: Prepare the ephemeral CI browser for retained-source inspection
        run: uv run --locked playwright install chromium --with-deps
      - name: Real STAT6 pose, current/original versions, undo/redo, form navigation and downloads
        if: steps.scope.outputs.overlay_only != 'true'
        run: |
          .venv/bin/python server_tests/prepare_visual_components.py --components ketcher
          uv run --locked python -m pytest -x -q server_tests/test_pose_handoff_browser.py
      - name: Current sealed STAT6 docking results; no new scientific calculation
        env:
          GH_TOKEN: ${{ github.token }}
          WB_HOME: ${{ runner.temp }}/x-dde-docking-table
          WB_STATE_DIR: ${{ runner.temp }}/x-dde-docking-table/state
        run: |
          readarray -t source < <(uv run --locked python -c 'from opendde_workbench.examples.stat6_bundle_release import URL; print("\n".join(URL.rsplit("/", 2)[-2:]))')
          test "${#source[@]}" -eq 2
          tag="${source[0]}"
          asset="${source[1]}"
          [[ "$tag" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|examples-v[0-9]+)$ ]]
          [[ "$asset" =~ ^stat6-reviewed-results-v[0-9]+\.zip$ ]]
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP" --skip-existing
          echo "WB_REVIEWED_STAT6_ARCHIVE=$RUNNER_TEMP/$asset" >> "$GITHUB_ENV"
          uv run --locked python server_tests/prepare_visual_components.py --components ketcher
      - name: Bilingual native docking table, linked fullscreen and complete original downloads
        env:
          WB_HOME: ${{ runner.temp }}/x-dde-docking-table
          WB_STATE_DIR: ${{ runner.temp }}/x-dde-docking-table/state
        run: uv run --locked python -m pytest -q server_tests/test_docking_table_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-selected-pose-evidence
          path: |
            outputs/pose-handoff/**
            outputs/docking-table/**
