name: Native image download policy
on:
  workflow_dispatch:
  push:
    paths:
      - "src/opendde_workbench/integrations/image.py"
      - "src/opendde_workbench/integrations/recipes.json"
      - "tests/test_native_image_network.py"
      - "tests/test_scientific_entrypoint.py"
      - "scripts/verify-native-system-libraries.py"
      - ".github/workflows/native-image-network-checks.yml"
permissions:
  contents: read
jobs:
  native-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Exact native image transport, hash guards and direct download/archive consumers
        run: >-
          uv run --locked python -m pytest -q tests/test_native_image_network.py
          tests/test_install_network.py tests/test_scientific_archives.py
          tests/test_scientific_entrypoint.py
      - name: Install the exact system-library pins from both native base images
        run: >-
          python scripts/verify-native-system-libraries.py
          --program drugclip --program deli --program chemprop --program reinvent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-system-library-evidence
          path: server_tests/evidence/native-system-libraries.json
          if-no-files-found: error
