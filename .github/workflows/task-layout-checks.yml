name: Task layout and browser checks
on:
  push:
    branches: ['**']
    paths:
      - 'frontend/src/guided/**'
      - 'frontend/src/integrations/**'
      - 'frontend/src/datasets/SourcePicker*'
      - 'frontend/src/datasets/useDatasetSources*'
      - 'frontend/src/datasets/DEL*'
      - 'frontend/src/datasets/DatasetForm*'
      - 'frontend/src/receptors/SurfaceForm*'
      - 'frontend/src/receptors/SurfaceRegionPicker*'
      - 'frontend/src/receptors/surface.css'
      - 'frontend/src/datasets/datasets.css'
      - 'frontend/src/datasets/ModelValidationPlot*'
      - 'frontend/src/datasets/DatasetResults*'
      - 'frontend/src/datasets/DatasetCharts*'
      - 'frontend/src/datasets/DatasetHeatmaps*'
      - 'frontend/src/datasets/ResearchTable*'
      - 'frontend/src/datasets/chart-documents*'
      - 'frontend/src/datasets/useChartDocuments*'
      - 'frontend/src/datasets/IndexedLibraryResults*'
      - 'frontend/src/datasets/useIndexedMember*'
      - 'frontend/src/datasets/supplier-label*'
      - 'frontend/src/pockets/**'
      - 'frontend/src/operations/**'
      - 'frontend/src/research/**'
      - 'frontend/src/studio/**'
      - 'frontend/src/design/**'
      - 'frontend/src/humanization/**'
      - 'frontend/src/viewer/**'
      # Camera and paired-result changes are verified by viewer-checks.yml.
      - '!frontend/src/viewer/frame.ts'
      - '!frontend/src/viewer/scene.ts'
      - '!frontend/src/viewer/context-focus*'
      - '!frontend/src/viewer/style.test.ts'
      - '!frontend/src/viewer/contact-label*'
      - '!frontend/src/viewer/contacts*'
      - '!frontend/src/viewer/scientific-overlay*'
      - '!frontend/src/viewer/native-contact-labels*'
      - '!frontend/src/viewer/InteractionControls*'
      - 'frontend/src/presentation/**'
      - '!frontend/src/presentation/ensemble-results.css'
      - 'frontend/src/docking/DockingResults*'
      - 'frontend/src/editors/scientificEditor*'
      - 'frontend/src/antibodies/AntibodyNumberResults*'
      - 'frontend/src/quality/QualityResults*'
      - 'frontend/src/examples/ExampleActions*'
      - 'frontend/src/examples/guide-data.json'
      - 'frontend/src/App.tsx'
      - 'frontend/src/App.test.tsx'
      - 'frontend/src/TaskDetail.tsx'
      - 'frontend/src/styles.css'
      - 'frontend/src/deployment/*css'
      - 'frontend/src/deployment/ComponentLibrary*'
      - 'frontend/src/deployment/ComponentCard*'
      - 'frontend/src/deployment/ComponentBundle*'
      - 'frontend/src/deployment/ComputeServicePanel*'
      - 'frontend/src/diffsbdd/ReferencePicker*'
      - 'frontend/src/diffsbdd/DiffResults*'
      - 'frontend/src/diffsbdd/DesignInputContext*'
      - 'frontend/src/diffsbdd/CoreVerification*'
      - 'frontend/src/examples/examples.css'
      - 'frontend/src/poses/PoseWorkspace*'
      - 'frontend/src/poses/poses.css'
      - 'frontend/src/workflow.css'
      - 'server_tests/test_binding_entry_browser.py'
      - 'server_tests/test_target_selection_browser.py'
      - 'server_tests/test_epitope_browser.py'
      - 'server_tests/test_protein_results_browser.py'
      - 'frontend/src/examples/CampaignCasePreview*'
      - 'frontend/src/examples/campaign-preview*'
      - 'frontend/src/examples/ExampleJobResult*'
      - 'server_tests/*layout*'
      - 'server_tests/*researcher*'
      - 'server_tests/test_module_surfaces_browser.py'
      - 'server_tests/test_result_visuals_browser.py'
      - 'server_tests/depiction_browser_helpers.py'
      - 'server_tests/layout_browser_helpers.py'
      - 'server_tests/layout_coverage.py'
      # Sequence and QC inspections use their own focused native-result gate.
      - '!frontend/src/presentation/SequenceTrack*'
      - '!frontend/src/presentation/sequence-track.css'
      - '!frontend/src/presentation/result-inspection.css'
      - '!frontend/src/operations/SequenceScoreResults*'
      - '!frontend/src/operations/sequence-scores.css'
      - '!frontend/src/antibodies/AntibodyNumberResults*'
      - '!frontend/src/humanization/HumanizationResults*'
      - '!frontend/src/humanization/SequenceAlignment*'
      - '!frontend/src/humanization/SequenceComparison*'
      - '!frontend/src/humanization/ReferenceMetrics*'
      - '!frontend/src/humanization/humanization.css'
      - '!frontend/src/humanization/sequence-alignment.css'
      - '!frontend/src/quality/QualityResults*'
      # Shared research-shell changes have a focused native navigation gate.
      - '!frontend/src/studio/Navigation*'
      - '!frontend/src/studio/navigation-frame.css'
      - '!frontend/src/studio/Header*'
      - '!frontend/src/studio/header.css'
      - '!frontend/src/studio/TaskSearch*'
      - '!frontend/src/studio/TaskNotifications*'
      - '!frontend/src/studio/ModuleTaskPicker*'
      - '!frontend/src/studio.css'
      - '!frontend/src/design/workspaces.css'
      # Public case controls have a focused native gate.
      - '!frontend/src/examples/ExampleActions*'
      - '!frontend/src/examples/ExampleToolbar*'
      - '!frontend/src/examples/ExampleGuide*'
      - '!frontend/src/examples/ExampleFeedback*'
      - '!frontend/src/examples/useExampleTemplate*'
      - '!frontend/src/examples/examples.css'
      - '!frontend/src/TaskForm*'
      - '!frontend/src/studio/HomeWorkspace*'
      - '!frontend/src/presentation/result-layout.css'
      # Initial 3D qualification is covered by native pose and viewer gates.
      - '!frontend/src/viewer/StructureViewer*'
      - '!frontend/src/viewer/InitialPoseStatus*'
      - '!frontend/src/viewer/usePoseOptimization*'
      - '!frontend/src/viewer/pose-source*'
      - '!frontend/src/viewer/pose-errors*'
      - '!frontend/src/viewer/pose-types.ts'
      - '!frontend/src/viewer/source-layout*'
      - '!frontend/src/viewer/viewer.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [1440, 390]
        shard: [0, 1]
    env:
      WB_AUTO_DEPLOY: '0'
      WB_BROWSER_URL: http://127.0.0.1:4330
      WB_LAYOUT_WIDTH: ${{ matrix.viewport }}
      WB_LAYOUT_SHARD: ${{ matrix.shard }}
    steps:
      - name: Choose isolated runner state
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-layout" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-layout/state" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Build locked frontend and install browser check dependencies
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          uv sync --locked --group dev --group browser
      - name: Verify the authoritative capability catalogue
        run: .venv/bin/python -m pytest -q tests/test_capabilities.py
      - name: Focused task layout, input identity and presentation regressions
        working-directory: frontend
        run: >-
          npx vitest run
          src/presentation/ResearchTable.test.tsx
          src/presentation/MetricScatter.test.tsx
          src/presentation/InteractionDiagram.test.tsx
          src/presentation/depiction-renderer.test.ts
          src/viewer/useViewerSnapshot.test.ts
          src/viewer/capture.test.ts
          src/viewer/camera-resize.test.ts
          src/guided/Questionnaire.test.tsx
          src/integrations/StructureTargetSelection.test.tsx
          src/integrations/PropertyModelSelection.test.tsx
          src/integrations/ScientificChoices.test.tsx
          src/datasets/SourcePicker.test.tsx
          src/datasets/ModelValidationPlot.test.tsx
          src/datasets/DatasetCharts.test.tsx
          src/datasets/DatasetResults.test.tsx
          src/datasets/IndexedLibraryResults.test.tsx
          src/datasets/ResearchTable.test.tsx
          src/datasets/indexed-source.test.ts
          src/datasets/chart-documents.test.ts
          src/receptors/SurfaceForm.test.tsx
          src/operations/ToolQuestionnaires.test.tsx
          src/operations/StructuredResults.test.tsx
          src/diffsbdd/DiffResults.test.tsx
          src/diffsbdd/DesignInputContext.test.tsx
          src/diffsbdd/ReferencePicker.test.tsx
          src/research/HistoricalFileSelect.test.tsx
          src/research/SequencePicker.test.tsx
          src/research/ResearchWorkspace.test.tsx
          src/poses/PoseForm.test.tsx
          src/poses/PoseWorkspace.test.tsx
          src/sites/SiteWorkspace.test.tsx
          src/constraints/ConstraintPanel.test.tsx
          src/workflows/WorkflowCenter.test.tsx
          src/workflows/RunMonitor.test.tsx
          src/regions/RegionWorkspace.test.tsx
          src/studio/ProjectPanel.test.tsx
          src/studio/HomeWorkspace.test.tsx
          src/studio/Navigation.test.tsx
          src/studio/ResearchEntry.test.tsx
          src/studio/BindingEntryDialog.test.tsx
          src/studio/MethodSwitch.test.tsx
          src/studio/research-modules.test.ts
          src/design/module-theme.test.ts
          src/studio/TaskWorkspace.test.tsx
          src/studio/PredictionResults.test.tsx
          src/studio/CandidatePanel.test.tsx
          src/studio/InterfaceSettings.test.tsx
          src/App.test.tsx
          src/operations/ToolCenter.test.tsx
          src/viewer/ViewerControls.test.tsx
          src/presentation/research-files.test.tsx
          src/presentation/molecular-record.test.ts
          src/presentation/research-content.test.ts
          src/presentation/task-sources.test.ts
          src/operations/EpitopeResults.test.tsx
          src/examples/useTaskLabel.test.tsx
          src/examples/ExampleActions.test.tsx
          src/viewer/residue-region.test.ts
          src/viewer/source-layout.test.ts
          src/viewer/PoseScore.test.tsx
          src/operations/HarnessResults.test.tsx
          src/operations/CandidateSequenceResults.test.tsx
          src/operations/candidate-structures.test.ts
          src/operations/StructureComparisonResults.test.tsx
          src/examples/CampaignCasePreview.test.tsx
          src/examples/ExampleJobResult.test.tsx
          src/operations/OperationResults.test.tsx
          src/operations/PreparedInputResults.test.tsx
          src/operations/native-report.test.ts
          src/operations/sequence-result.test.ts
          src/research/asset-list.test.ts
          src/studio/RuntimeStatus.test.tsx
          src/docking/DockingResults.test.tsx
          src/chemistry/StateResults.test.tsx
          src/humanization/HumanizationResults.test.tsx
          src/editors/scientificEditor.test.ts
          src/antibodies/AntibodyNumberForm.test.tsx
          src/deployment/deployment.test.tsx
      - name: Restore fixed native case evidence without scientific execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
          uv run --locked --group browser python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          uv run --locked --group browser python server_tests/prepare_visual_components.py
          uv run --locked --group browser python server_tests/proximity_layout_inputs.py --state "$WB_STATE_DIR"
      - name: Check every task and archived example in real Chromium
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/task-layout
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/task-layout/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          if ! curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null; then cat server_tests/evidence/task-layout/service.log; exit 1; fi
          .venv/bin/python -m pytest -q server_tests/test_task_layout_browser.py
          if [ "$WB_LAYOUT_WIDTH" = 1440 ] && [ "$WB_LAYOUT_SHARD" = 0 ]; then
            .venv/bin/python -m pytest -q server_tests/test_researcher_browser.py server_tests/test_component_layout_browser.py server_tests/test_result_visuals_browser.py server_tests/test_module_surfaces_browser.py server_tests/test_binding_entry_browser.py server_tests/test_target_selection_browser.py server_tests/test_epitope_browser.py server_tests/test_protein_results_browser.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-layout-browser-evidence-${{ matrix.viewport }}-${{ matrix.shard }}
          path: server_tests/evidence/task-layout
          if-no-files-found: warn
  verify-coverage:
    needs: scoped-layout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Build the required frontend before installing the editable package
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: task-layout-browser-evidence-*
          path: server_tests/evidence/layout-groups
      - name: Require both widths, every task and the same reviewed revision
        run: uv run --locked python server_tests/layout_coverage.py server_tests/evidence/layout-groups "$GITHUB_SHA"
