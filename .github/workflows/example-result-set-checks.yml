name: Reviewed example result stages
on:
  push:
    paths: &stage_paths
      - "src/opendde_workbench/examples/supporting.py"
      - "src/opendde_workbench/examples/contracts.py"
      - "src/opendde_workbench/examples/pins.py"
      - "src/opendde_workbench/examples/routes.py"
      - "src/opendde_workbench/examples/library.py"
      - "tests/test_example_supporting.py"
      - "frontend/src/examples/ExampleResultSet*"
      - "frontend/src/examples/ExampleActions*"
      - "frontend/src/examples/types.ts"
      - ".github/workflows/example-result-set-checks.yml"
  pull_request:
    paths: *stage_paths
permissions:
  contents: read
jobs:
  immutable-stages:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Typed lineage, immutable outputs, portable closure and personal history
        run: >-
          uv run --locked pytest -q tests/test_example_supporting.py
          tests/test_example_pins.py tests/test_example_library.py
          tests/test_stat6_case_bundle.py
      - name: Bilingual stage switching, stale replies and preserved module draft
        working-directory: frontend
        run: >-
          npx vitest run src/examples/ExampleResultSet.test.tsx
          src/examples/ExampleActions.test.tsx src/examples/ExampleJobResult.test.tsx
