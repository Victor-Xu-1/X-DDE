name: Reviewed example result stages
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Verify the affected record opening path or the complete result-stage contracts
        type: choice
        default: all
        options: [all, record-results]
  push:
    paths: &stage_paths
      - "src/opendde_workbench/examples/supporting.py"
      - "src/opendde_workbench/examples/source_captions.py"
      - "src/opendde_workbench/examples/contracts.py"
      - "src/opendde_workbench/examples/pins.py"
      - "src/opendde_workbench/examples/records.py"
      - "src/opendde_workbench/examples/bundle.py"
      - "src/opendde_workbench/examples/routes.py"
      - "src/opendde_workbench/examples/library.py"
      - "src/opendde_workbench/examples/input_lineage.py"
      - "src/opendde_workbench/examples/pin_validation.py"
      # Shared catalogue compatibility uses del-example-guidance-checks.yml.
      - "src/opendde_workbench/examples/stat6_bundle_release.py"
      - "tests/test_example_supporting.py"
      - "tests/test_example_stage_names.py"
      - "tests/test_example_dataset_stage_names.py"
      - "tests/test_record_example_supporting.py"
      - "tests/test_example_native_lineage.py"
      - "tests/test_stat6_predicted_references.py"
      - "frontend/src/examples/ExampleResultSet*"
      - "frontend/src/examples/ExampleActions*"
      - "frontend/src/examples/review-highlights*"
      - "frontend/src/examples/reviewed-*"
      - "frontend/src/examples/ReviewedReceptorComparison*"
      - "frontend/src/examples/examples.css"
      - "frontend/src/examples/useExampleTemplate.ts"
      - "frontend/src/examples/ExampleJobResult*"
      - "frontend/src/datasets/CandidateView*"
      - "frontend/src/datasets/CandidateTable*"
      - "frontend/src/datasets/DatasetResults*"
      - "frontend/src/datasets/IndexedLibraryResults*"
      - "frontend/src/presentation/MolecularPreview*"
      - "frontend/src/viewer/PoseSession*"
      - "frontend/src/viewer/StructureViewer*"
      - "frontend/src/operations/OperationResults*"
      - "frontend/src/examples/types.ts"
      - "server_tests/test_reviewed_example_previews_browser.py"
      - "server_tests/test_receptor_case_comparison_browser.py"
      - "server_tests/reviewed_receptor_audit.py"
      - "server_tests/test_dataset_browser.py"
      - "server_tests/example_preview_actions.py"
      - "server_tests/reviewed_retrieval_preview.py"
      - "server_tests/reviewed_disease_preview.py"
      - "server_tests/reviewed_batch_preview.py"
      - "server_tests/reviewed_experimental_preview.py"
      - "frontend/src/datasets/candidate-table.css"
      - ".github/workflows/example-result-set-checks.yml"
  pull_request:
    paths: *stage_paths
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      del_only: ${{ steps.change.outputs.del_only }}
      review_only: ${{ steps.review_scope.outputs.review_only }}
      loader_changed: ${{ steps.review_scope.outputs.loader_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: change
        env:
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: python3 scripts/del-ci-scope.py
      - id: review_scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          review_only=true
          found=false
          loader_changed=false
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base HEAD origin/main)
          fi
          while IFS= read -r path; do
            case "$path" in
              frontend/src/examples/review-highlights*|frontend/src/examples/reviewed-*|frontend/src/examples/ReviewedReceptorComparison*|server_tests/test_receptor_case_comparison_browser.py|server_tests/reviewed_receptor_audit.py) found=true ;;
              frontend/src/examples/useExampleTemplate.ts) loader_changed=true ;;
              frontend/src/examples/ExampleResultSet.tsx|frontend/src/examples/ExampleResultSet.test.tsx|frontend/src/examples/ExampleActions.tsx|frontend/src/examples/ExampleActions.test.tsx|frontend/src/examples/examples.css|docs/design/research-examples.md|scripts/release-version.py|tests/test_versioning.py|.github/workflows/examples-checks.yml|.github/workflows/example-result-set-checks.yml|.github/workflows/structure-layout-checks.yml|pyproject.toml|uv.lock|frontend/package.json|frontend/package-lock.json|install.sh|install.ps1) ;;
              *) review_only=false ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          if [[ "$found" != true ]]; then review_only=false; fi
          echo "review_only=$review_only" >> "$GITHUB_OUTPUT"
          echo "loader_changed=$loader_changed" >> "$GITHUB_OUTPUT"
  review-highlights:
    needs: scope
    if: needs.scope.outputs.review_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Evidence-bound bilingual conclusions and module rendering
        working-directory: frontend
        run: >-
          npx vitest run src/examples/review-highlights.test.ts src/examples/review-highlights-view.test.tsx
          src/examples/ReviewedReceptorComparison.test.tsx src/examples/ExampleActions.test.tsx
          src/examples/ExampleResultSet.test.tsx src/examples/ExampleJobResult.test.tsx
      - uses: astral-sh/setup-uv@v6
      - name: Restore the exact scientific case without model or engine installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv sync --locked --group dev --group browser
          uv run --locked pytest -q tests/test_versioning.py
          echo "WB_AUTO_DEPLOY=0" >> "$GITHUB_ENV"
          echo "WB_HOME=$RUNNER_TEMP/x-dde-receptor-comparison" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-receptor-comparison/state" >> "$GITHUB_ENV"
          readarray -t source < <(uv run --locked python -c 'from opendde_workbench.examples.stat6_bundle_release import URL; print("\n".join(URL.rsplit("/", 2)[-2:]))')
          test "${#source[@]}" -eq 2
          tag="${source[0]}"
          asset="${source[1]}"
          [[ "$tag" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|examples-v[0-9]+)$ ]]
          [[ "$asset" =~ ^stat6-reviewed-results-v[0-9]+\.zip$ ]]
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP"
          echo "WB_REVIEWED_STAT6_ARCHIVE=$RUNNER_TEMP/$asset" >> "$GITHUB_ENV"
      - name: Ketcher and Chromium for native 2D/3D and downloads
        run: |
          uv run --locked python server_tests/prepare_visual_components.py --components ketcher
          uv run --locked playwright install chromium --with-deps
      - name: Independent native-coordinate audit and exact bilingual stage navigation
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: >-
          uv run --locked --with rdkit==2026.3.6 --with numpy==2.3.4
          python -m pytest -x -q server_tests/test_receptor_case_comparison_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-receptor-comparison
          path: outputs/receptor-case-comparison
  immutable-stages:
    needs: scope
    if: needs.scope.outputs.del_only != 'true' && needs.scope.outputs.review_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Typed lineage, immutable outputs, portable closure and personal history
        if: inputs.scope != 'record-results'
        run: >-
          uv run --locked pytest -q tests/test_example_supporting.py
          tests/test_record_example_supporting.py
          tests/test_example_stage_names.py
          tests/test_example_dataset_stage_names.py
          tests/test_example_native_lineage.py tests/test_stat6_predicted_references.py
          tests/test_stat6_source_revisions.py
          tests/test_example_records.py tests/test_example_pins.py tests/test_example_library.py
          tests/test_stat6_case_bundle.py
      - name: Exact corrected PROTAC source identity and unchanged coordinates
        if: inputs.scope != 'record-results'
        run: >-
          uv run --locked --with rdkit==2026.3.6 --with numpy==2.3.4
          pytest -q tests/test_stat6_source_revisions.py -k corrected_protac
      - name: Bilingual stage switching, stale replies and preserved module draft
        if: ${{ !cancelled() && inputs.scope != 'record-results' }}
        working-directory: frontend
        run: >-
          npx vitest run src/examples/ExampleResultSet.test.tsx
          src/examples/ExampleActions.test.tsx src/examples/ExampleJobResult.test.tsx
          src/datasets/CandidateView.test.tsx src/datasets/CandidateTable.test.tsx
          src/presentation/ResearchTable.test.tsx src/datasets/CandidateHandoff.test.tsx
          src/datasets/DatasetResults.test.tsx src/datasets/IndexedLibraryResults.test.tsx
          src/operations/OperationResults.test.tsx
          src/viewer/PoseSession.test.tsx src/viewer/StructureViewer.test.tsx
          src/viewer/pose-plan.test.ts src/viewer/pose-source.test.ts
          src/viewer/usePoseOptimization.test.tsx
      - name: Read-only record loading, immutable evidence and missing or changed results
        if: inputs.scope == 'record-results'
        run: uv run --locked pytest -q tests/test_record_example_supporting.py tests/test_example_records.py
      - name: Record result opening and retained stages preserve the module draft
        if: inputs.scope == 'record-results'
        working-directory: frontend
        run: npx vitest run src/examples/ExampleActions.test.tsx src/examples/ExampleResultSet.test.tsx
  native-preview:
    needs: scope
    if: needs.scope.outputs.del_only != 'true' && (needs.scope.outputs.review_only != 'true' || needs.scope.outputs.loader_changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Download the immutable reviewed native study package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-reviewed-previews" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-reviewed-previews/state" >> "$GITHUB_ENV"
          readarray -t source < <(uv run --locked python -c 'from opendde_workbench.examples.stat6_bundle_release import URL; print("\n".join(URL.rsplit("/", 2)[-2:]))')
          test "${#source[@]}" -eq 2
          tag="${source[0]}"
          asset="${source[1]}"
          [[ "$tag" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|examples-v[0-9]+)$ ]]
          [[ "$asset" =~ ^stat6-reviewed-results-v[0-9]+\.zip$ ]]
          echo "WB_TEST_REVIEWED_BUNDLE=$RUNNER_TEMP/$asset" >> "$GITHUB_ENV"
          echo "WB_REVIEWED_STAT6_ARCHIVE=$RUNNER_TEMP/$asset" >> "$GITHUB_ENV"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP"
      - name: Install and idempotently replay the exact native case data through the component queue
        run: uv run --locked pytest -q tests/test_stat6_case_data.py
      - name: Native Ketcher only; no model or scientific engine installation
        run: uv run --locked python server_tests/prepare_visual_components.py --components ketcher
      - run: uv run --locked playwright install chromium --with-deps
      - name: Cold-restored native structures, distinct stages, 2D/3D and downloads without calculation
        run: uv run --locked pytest -x -q server_tests/test_reviewed_example_previews_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-stat6-example-previews
          path: server_tests/evidence/reviewed-example-previews
          if-no-files-found: warn
