name: Dataset discovery scoped checks
on:
  push:
    paths:
      - 'src/opendde_workbench/asset_upload*'
      - 'src/opendde_workbench/dataset_inputs.py'
      - 'src/opendde_workbench/datasets/**'
      - 'frontend/src/datasets/**'
      - 'tests/test_dataset*'
      - 'tests/test_supplier*'
      - 'server_tests/*dataset*'
      # Shared interactive charts and appearance use chart-quality-checks.yml.
      - "!frontend/src/datasets/CountBars.tsx"
      - "!frontend/src/datasets/DatasetCharts.test.tsx"
      - "!frontend/src/datasets/DatasetCharts.tsx"
      - "!frontend/src/datasets/ModelValidationPlot.tsx"
      - "!frontend/src/datasets/SampleCorrelationPlot.tsx"
      - "!frontend/src/datasets/SequencingQualityPlot.tsx"
      - "!frontend/src/datasets/SeriesEnrichmentPlot.tsx"
      - "!frontend/src/datasets/chart-documents.ts"
      - "!frontend/src/datasets/series-map.test.ts"
      - "!frontend/src/datasets/series-map.ts"
      - "!frontend/src/datasets/statistical-plots.test.tsx"
  workflow_dispatch:
    inputs:
      engine:
        description: Changed contracts or one actual isolated scientific engine
        type: choice
        default: contracts
        options: [contracts, browser, images, supplier-files, drugclip, deli, gnina]
permissions:
  contents: read
jobs:
  contracts:
    if: github.event_name == 'push' || inputs.engine == 'contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Research upload and directly affected trust boundaries
        run: >-
          uv run --locked pytest -q tests/test_dataset_uploads.py
          tests/test_dataset_contracts.py tests/test_api_security.py
          tests/test_dataset_worker.py tests/test_dataset_resources.py
          tests/test_dataset_views.py tests/test_dataset_member_view.py
          tests/test_dataset_member_inspection.py
          tests/test_dataset_workflows.py tests/test_workflows.py
          tests/test_case_bundle.py tests/test_case_bundle_sources.py
          tests/test_example_library.py tests/test_example_pins.py tests/test_examples.py
          tests/test_dataset_examples.py tests/test_research_assets.py
          tests/test_plip_coordinates.py
          tests/test_supplier_resources.py
          tests/test_supplier_text.py
      - name: Changed data forms, upload and workflow UI only
        working-directory: frontend
        run: npx vitest run src/datasets src/studio/research-modules.test.ts src/deployment/component-groups.test.ts src/workflows/model.test.ts
  native-del-data:
    if: github.event_name == 'push' || inputs.engine == 'contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Install the reviewed independent DEL environment, without platform interpreter changes
        run: |
          uv venv --python 3.13 .dataset-native
          uv pip install --python .dataset-native/bin/python --require-hashes -r src/opendde_workbench/integrations/recipes/deli.txt
          uv pip install --python .dataset-native/bin/python -e . pytest==9.1.1 pydantic==2.13.0
      - name: Real compound libraries, public DEL chemistry/reads/counts and ranking boundaries only
        env:
          PYTHONPATH: src
          WB_TEST_DATASET_NATIVE: '1'
        run: .dataset-native/bin/python -m pytest -q server_tests/test_dataset_native.py server_tests/test_dataset_curation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset-native-check-evidence
          path: /tmp/pytest-of-runner/pytest-*/**/output
          if-no-files-found: ignore
          retention-days: 7
  native:
    if: github.event_name == 'workflow_dispatch' && (inputs.engine == 'drugclip' || inputs.engine == 'deli' || inputs.engine == 'gnina')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Reserve space on this disposable CI runner for official model files
        if: inputs.engine == 'drugclip'
        run: |
          for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost; do
            if [ -d "$path" ] && [ ! -L "$path" ]; then sudo rm -rf -- "$path"; fi
          done
          df -h .
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Actual public scientific inputs through API, native container, Worker and downloads
        env:
          WB_DATASET_ENGINE: ${{ inputs.engine }}
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
        run: uv run --locked --with h5py==3.14.0 --with numpy==1.26.4 pytest -q -s server_tests/test_native_dataset_engines.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset-${{ inputs.engine }}-acceptance
          path: |
            server_tests/evidence/datasets
            /tmp/pytest-of-runner/pytest-*/**/install.log
            /tmp/pytest-of-runner/pytest-*/**/jobs/*/run.log
          if-no-files-found: ignore
          retention-days: 7
  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - run: uv run --locked --with playwright==1.58.0 playwright install --with-deps chromium
      - name: Actual public-case API, questionnaire, Ketcher and 3D research pages
        env:
          WB_TEST_DATASET_BROWSER: '1'
          PYTHONPATH: src
        run: uv run --locked --with playwright==1.58.0 pytest -q -s server_tests/test_dataset_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset-browser-acceptance
          path: server_tests/evidence/dataset-browser
          if-no-files-found: ignore
          retention-days: 7
  images:
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'images'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Identical pinned runtimes for offline installation, without model redistribution
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
        run: uv run --locked python server_tests/export_dataset_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: dataset-reviewed-runtime-images
          path: server_tests/evidence/runtime-images
          retention-days: 7
  supplier-files:
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'supplier-files'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: The reviewed independent RDKit environment
        run: |
          uv venv --python 3.13 .dataset-native
          uv pip install --python .dataset-native/bin/python --require-hashes -r src/opendde_workbench/integrations/recipes/deli.txt
          uv pip install --python .dataset-native/bin/python -e . pytest==9.1.1 pydantic==2.13.0
      - name: Real supplier archives and original SDF identifiers
        env:
          WB_TEST_SUPPLIER_NATIVE: '1'
        run: .dataset-native/bin/python -m pytest -q server_tests/test_supplier_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplier-native-file-evidence
          path: server_tests/evidence/supplier-files
          if-no-files-found: ignore
          retention-days: 7
