name: Native task cleanup reconciliation
on:
  workflow_dispatch:
  push:
    paths: &cleanup_paths
      - 'src/opendde_workbench/container_runtime.py'
      - 'src/opendde_workbench/native_runtime_leases.py'
      - 'tests/test_native_runtime_leases.py'
      - 'src/opendde_workbench/prepared_container.py'
      - 'src/opendde_workbench/integrations/runtime.py'
      - 'src/opendde_workbench/docking/backend.py'
      - 'src/opendde_workbench/deployment/native_probe*.py'
      - 'src/opendde_workbench/deployment/installers.py'
      - 'src/opendde_workbench/deployment/network.py'
      - 'src/opendde_workbench/container_supervision.py'
      - 'src/opendde_workbench/native_container_cleanup.py'
      - 'tests/test_container_runtime.py'
      - 'tests/test_container_stop.py'
      - 'server_tests/test_container_stop_native.py'
      - 'tests/test_install_probe_lifecycle.py'
      - 'tests/test_install_network.py'
      - 'tests/test_native_container_cleanup.py'
      - 'tests/test_managed_containers.py'
      - 'server_tests/native_cleanup_probe.py'
      - '.github/workflows/native-container-checks.yml'
  pull_request:
    paths: *cleanup_paths
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      stop_only: ${{ steps.change.outputs.stop_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          stop_only=true
          found=false
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base HEAD origin/main)
          fi
          while IFS= read -r path; do
            case "$path" in
              tests/test_container_stop.py|server_tests/test_container_stop_native.py) found=true ;;
              src/opendde_workbench/prepared_container.py|src/opendde_workbench/docking/backend.py|src/opendde_workbench/container_supervision.py|.github/workflows/native-container-checks.yml|docs/user-guide.md|pyproject.toml|uv.lock|frontend/package.json|frontend/package-lock.json|install.sh|install.ps1) ;;
              *) stop_only=false ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          if [[ "$found" != true ]]; then stop_only=false; fi
          echo "stop_only=$stop_only" >> "$GITHUB_OUTPUT"
  cancellation:
    needs: scope
    if: needs.scope.outputs.stop_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - name: Cancellation modules only
        run: >-
          uv run --locked ruff check src/opendde_workbench/container_supervision.py
          src/opendde_workbench/prepared_container.py src/opendde_workbench/docking/backend.py
          tests/test_container_stop.py server_tests/test_container_stop_native.py
      - name: Only owned cancellation, frozen runtimes and durable worker recovery
        run: >-
          uv run --locked pytest -q tests/test_container_stop.py tests/test_container_runtime.py
          tests/test_native_container_cleanup.py tests/test_local_process.py
          tests/test_storage_consumers.py::test_cancel_and_unconfirmed_cleanup_preserve_halt_until_restart
      - name: One small official image for isolated lifecycle verification
        run: docker pull "$(uv run --locked python -c 'from opendde_workbench.receptors.image import PYTHON_IMAGE; print(PYTHON_IMAGE)')"
      - name: Real owned container and process-tree cleanup; no science or GPU
        env:
          WB_NATIVE_CONTAINER_STOP: "1"
        run: uv run --locked python -m pytest -x -q server_tests/test_container_stop_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-container-stop-evidence
          path: ${{ runner.temp }}/container-stop/**
  lifecycle:
    needs: scope
    if: needs.scope.outputs.stop_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check src/opendde_workbench/native_runtime_leases.py tests/test_native_runtime_leases.py src/opendde_workbench/container_runtime.py src/opendde_workbench/prepared_container.py src/opendde_workbench/integrations/runtime.py src/opendde_workbench/docking/backend.py src/opendde_workbench/deployment/native_probe*.py src/opendde_workbench/deployment/installers.py src/opendde_workbench/deployment/network.py src/opendde_workbench/container_supervision.py src/opendde_workbench/native_container_cleanup.py tests/test_container_runtime.py tests/test_native_container_cleanup.py server_tests/native_cleanup_probe.py
      - name: Shared supervision, exact namespace and native failure consumers
        run: uv run --locked pytest -q tests/test_native_runtime_leases.py tests/test_container_runtime.py tests/test_native_container_cleanup.py tests/test_managed_containers.py tests/test_install_probe_lifecycle.py tests/test_install_network.py tests/test_scientific_entrypoint.py tests/test_scientific_cache.py tests/test_deployment.py tests/test_integrated_science.py tests/test_docking.py
      - name: Real native process, artifacts, delayed cleanup observations and preserved sibling
        run: |
          uv run --locked python server_tests/native_cleanup_probe.py --output "$RUNNER_TEMP/native-cleanup/default"
          uv run --locked python server_tests/native_cleanup_probe.py --bind-local-daemon --output "$RUNNER_TEMP/native-cleanup/bound"
      - name: Real installation probe admission and frozen-host cleanup
        env:
          WB_TEST_NATIVE_INSTALL_PROBE: "1"
        run: uv run --locked pytest -x -q server_tests/test_install_probe_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cleanup-evidence
          path: ${{ runner.temp }}/native-cleanup/**
