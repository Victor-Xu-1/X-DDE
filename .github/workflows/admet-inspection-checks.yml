name: Molecular property inspection checks
on:
  workflow_dispatch:
  push:
    paths: &admet_inspection_paths
      - "frontend/src/admet/**"
      # Row selection is verified with native ADMET records in the shared selection gate.
      - "!frontend/src/admet/AdmetRecordTable.tsx"
      # Input review is covered with native drawings and readiness in publication-checks.yml.
      - "!frontend/src/admet/AdmetForm*"
      - "server_tests/test_admet_inspection_browser.py"
      - "server_tests/test_admet_workspace_browser.py"
      - "scripts/admet-workspace-scope.py"
      - "tests/test_admet_workspace_scope.py"
      - ".github/workflows/admet-inspection-checks.yml"
  pull_request:
    paths: *admet_inspection_paths
permissions:
  contents: read
jobs:
  utility-scope:
    uses: ./.github/workflows/molecular-utility-checks.yml
    with:
      scope_only: true
  property-inspection:
    if: needs.utility-scope.outputs.utility_only != 'true'
    needs: utility-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WB_AUTO_DEPLOY: "0"
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Check molecular results and their direct visual and pose consumers
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          cd frontend
          npx vitest run src/admet/AdmetResults.test.tsx src/admet/EndpointValue.test.tsx src/presentation/ResearchTable.test.tsx src/presentation/MetricScatter.test.tsx src/viewer/PoseSession.test.tsx src/viewer/pose-plan.test.ts
      - name: Restore original reviewed cases into isolated state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export WB_HOME="$RUNNER_TEMP/x-dde-property-inspection"
          export WB_STATE_DIR="$WB_HOME/state"
          echo "WB_HOME=$WB_HOME" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$WB_STATE_DIR" >> "$GITHUB_ENV"
          uv sync --locked --group dev --group browser
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
          .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          .venv/bin/python server_tests/prepare_visual_components.py --components ketcher public-dataset-examples
          .venv/bin/python - <<'PY'
          import os
          import urllib.request
          from pathlib import Path
          from opendde_workbench.examples.stat6_bundle_release import URL
          target = Path(os.environ["RUNNER_TEMP"]) / "stat6-reviewed-results.zip"
          urllib.request.urlretrieve(URL, target)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"WB_REVIEWED_STAT6_ARCHIVE={target}\n")
          PY
      - name: Closed scope and changed browser source checks
        run: |
          .venv/bin/python -m pytest -q tests/test_admet_workspace_scope.py
          .venv/bin/python -m ruff check scripts/admet-workspace-scope.py tests/test_admet_workspace_scope.py server_tests/test_admet_workspace_browser.py server_tests/test_admet_inspection_browser.py
      - name: Native molecular results, all endpoints, structures and downloads; no inference
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/admet-inspection
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/admet-inspection/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null
          .venv/bin/python -m pytest -q server_tests/test_admet_inspection_browser.py -k native_units_selection_all_endpoints_and_view_exports
          .venv/bin/python -m pytest -q server_tests/test_admet_workspace_browser.py --basetemp "$RUNNER_TEMP/admet-browser-state"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-property-inspection-evidence
          path: |
            server_tests/evidence/admet-inspection
            outputs/admet-workspace
          if-no-files-found: error
