name: Molecular property inspection checks
on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/src/admet/**"
      # Row selection is verified with native ADMET records in the shared selection gate.
      - "!frontend/src/admet/AdmetRecordTable.tsx"
      # Input review is covered with native drawings and readiness in publication-checks.yml.
      - "!frontend/src/admet/AdmetForm*"
      - "server_tests/test_admet_inspection_browser.py"
permissions:
  contents: read
jobs:
  property-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WB_AUTO_DEPLOY: "0"
      WB_BROWSER_URL: http://127.0.0.1:4330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Check changed forms, molecular tables and direct visual consumers
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          cd frontend
          npx vitest run src/admet/AdmetResults.test.tsx src/admet/AdmetForm.test.tsx src/presentation/ResearchTable.test.tsx src/presentation/MetricScatter.test.tsx
      - name: Restore original reviewed cases into isolated state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export WB_HOME="$RUNNER_TEMP/x-dde-property-inspection"
          export WB_STATE_DIR="$WB_HOME/state"
          echo "WB_HOME=$WB_HOME" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$WB_STATE_DIR" >> "$GITHUB_ENV"
          uv sync --locked --group dev --group browser
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
          .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          .venv/bin/python server_tests/prepare_visual_components.py --components ketcher public-dataset-examples
      - name: Native molecular results, endpoint units and one-step questionnaire
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          mkdir -p server_tests/evidence/admet-inspection
          .venv/bin/python -m opendde_workbench --port 4330 > server_tests/evidence/admet-inspection/service.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null && break; sleep 1; done
          curl --silent --fail "$WB_BROWSER_URL/api/health" > /dev/null
          .venv/bin/python -m pytest -q server_tests/test_admet_inspection_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-property-inspection-evidence
          path: server_tests/evidence/admet-inspection
          if-no-files-found: error
