name: Interactive statistical preview checks
on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/src/presentation/plots/**"
      - "frontend/src/datasets/CountBars*"
      - "frontend/src/datasets/CountEvidencePlot*"
      - "frontend/src/datasets/count-summary*"
      - "frontend/src/datasets/DatasetResults.tsx"
      - "frontend/src/datasets/DatasetCharts*"
      - "frontend/src/datasets/BarcodeQuality*"
      - "frontend/src/datasets/barcode-quality*"
      - "frontend/src/datasets/DatasetHeatmaps*"
      - "frontend/src/datasets/SampleCorrelationPlot*"
      - "frontend/src/datasets/SeriesEnrichmentPlot*"
      - "frontend/src/datasets/series-map*"
      - "frontend/src/datasets/SequencingQualityPlot*"
      - "frontend/src/datasets/ModelValidationPlot*"
      - "frontend/src/datasets/chart-documents*"
      - "frontend/src/datasets/statistical-plots*"
      - "frontend/src/datasets/PlotFrame.tsx"
      - "frontend/src/viewer/appearance.ts"
      - "frontend/src/viewer/scene.ts"
      - "frontend/src/viewer/style.ts"
      - "frontend/src/simulations/OverlapHeatmap.tsx"
      - "server_tests/test_statistical_previews_browser.py"
      - "server_tests/barcode_quality_browser.py"
      - ".github/workflows/chart-quality-checks.yml"
      - "scripts/generate-plotly-css.py"
      # Dynamics/FEP-specific consumers now have simulation-view-checks.yml.
      # Shared hydrogen display has focused native Ketcher/3D checks.
      - "!frontend/src/viewer/scene.ts"
      - "!frontend/src/viewer/style.ts"
      # Library/index result routing is covered by the native member gate.
      - "!frontend/src/datasets/DatasetResults.tsx"
permissions:
  contents: read
jobs:
  statistical-previews:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WB_AUTO_DEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the affected barcode or shared chart consumers
        id: scope
        env:
          BASE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base = os.environ.get("BASE", "")
          changed = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines() if base and set(base) != {"0"} else []
          barcode = {
              "frontend/src/datasets/BarcodeQuality.tsx", "frontend/src/datasets/BarcodeQuality.test.tsx",
              "frontend/src/datasets/barcode-quality.ts", "frontend/src/datasets/chart-documents.ts",
              "frontend/src/datasets/chart-documents.test.ts", "frontend/src/datasets/DatasetCharts.tsx",
              "frontend/src/datasets/DatasetCharts.test.tsx", "server_tests/barcode_quality_browser.py",
              "server_tests/test_statistical_previews_browser.py",
          }
          companions = {"pyproject.toml", "uv.lock", "frontend/package.json", "frontend/package-lock.json", "install.sh", "install.ps1",
              ".github/workflows/chart-quality-checks.yml", ".github/workflows/dataset-discovery-checks.yml",
              ".github/workflows/user-interface-checks.yml", ".github/workflows/task-layout-checks.yml"}
          selected = bool(set(changed) & barcode) and all(name in barcode | companions for name in changed)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("barcode_only=" + str(selected).lower() + "\n")
          print("Barcode documents, table, download and direct chart consumers" if selected else "Shared chart consumers")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && python scripts/generate-plotly-css.py --check && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Changed chart, document, structure appearance and direct simulation consumers
        if: steps.scope.outputs.barcode_only != 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/datasets/DatasetCharts.test.tsx src/datasets/DatasetResults.test.tsx src/datasets/chart-documents.test.ts
          src/datasets/series-map.test.ts src/datasets/statistical-plots.test.tsx
          src/datasets/count-summary.test.ts
          src/presentation/plots/types.test.ts src/publication/settings-svg.test.ts
          src/presentation/plots/InteractivePlot.test.tsx
          src/publication/embedded-raster.test.ts src/viewer/style.test.ts
          src/simulations/SimulationResults.test.tsx
      - name: Native barcode evidence, missing/contradictory checks and direct result consumers
        if: steps.scope.outputs.barcode_only == 'true'
        working-directory: frontend
        run: >-
          npx vitest run src/datasets/BarcodeQuality.test.tsx src/datasets/chart-documents.test.ts
          src/datasets/DatasetCharts.test.tsx src/datasets/DatasetResults.test.tsx
      - name: Restore public research cases and graphical tools; never re-run science for layout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "WB_HOME=$RUNNER_TEMP/x-dde-charts" >> "$GITHUB_ENV"
          echo "WB_STATE_DIR=$RUNNER_TEMP/x-dde-charts/state" >> "$GITHUB_ENV"
          gh release download examples-v1 --repo "$GITHUB_REPOSITORY" --pattern x-dde-public-cases-v1.zip --dir "$RUNNER_TEMP"
      - run: |
          .venv/bin/python server_tests/prepare_layout_cases.py "$RUNNER_TEMP/x-dde-public-cases-v1.zip"
          .venv/bin/python server_tests/prepare_visual_components.py --components ketcher public-dataset-examples
          uv run --locked playwright install chromium --with-deps
      - name: Actual bilingual statistical charts, interactions and paper figures
        if: steps.scope.outputs.barcode_only != 'true'
        run: uv run --locked python -m pytest -x -q server_tests/test_statistical_previews_browser.py
      - name: Actual retained barcode quality, bilingual downloads and mobile overflow
        if: steps.scope.outputs.barcode_only == 'true'
        run: uv run --locked python -m pytest -x -q server_tests/test_statistical_previews_browser.py -k 'del.library'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statistical-preview-evidence
          path: outputs/statistical-previews/**
