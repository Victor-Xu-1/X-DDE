name: Public research example checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/opendde_workbench/examples/**'
      - '!src/opendde_workbench/examples/bundle*.py'
      # Simulation template additions and old task bytes have a focused integration gate.
      - '!src/opendde_workbench/examples/catalogue.json'
      - '!src/opendde_workbench/examples/preparation.py'
      - 'frontend/src/examples/**'
      - '!frontend/src/examples/ExampleActions*'
      - '!frontend/src/examples/ExampleToolbar*'
      - '!frontend/src/examples/ExampleGuide*'
      - '!frontend/src/examples/ExampleFeedback*'
      - '!frontend/src/examples/useExampleTemplate*'
      - '!frontend/src/examples/examples.css'
      - '!frontend/src/examples/guide-data.json'
      - 'frontend/src/App.tsx'
      - 'frontend/src/App.test.tsx'
      - 'tests/test_examples.py'
      - 'tests/test_example_observed_inputs.py'
      - 'tests/test_example_pins.py'
  pull_request:
    paths:
      - 'src/opendde_workbench/examples/**'
      - '!src/opendde_workbench/examples/bundle*.py'
      - '!src/opendde_workbench/examples/catalogue.json'
      - '!src/opendde_workbench/examples/preparation.py'
      - 'frontend/src/examples/**'
      - '!frontend/src/examples/ExampleActions*'
      - '!frontend/src/examples/ExampleToolbar*'
      - '!frontend/src/examples/ExampleGuide*'
      - '!frontend/src/examples/ExampleFeedback*'
      - '!frontend/src/examples/useExampleTemplate*'
      - '!frontend/src/examples/examples.css'
      - '!frontend/src/examples/guide-data.json'
      - 'tests/test_examples.py'
      - 'tests/test_example_observed_inputs.py'
      - 'tests/test_example_pins.py'
permissions:
  contents: read
jobs:
  example-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Verify example provenance, immutable results and direct API boundaries
        run: >-
          uv run --locked pytest -q
          tests/test_examples.py tests/test_example_observed_inputs.py tests/test_example_pins.py tests/test_example_records.py tests/test_example_library.py
          tests/test_analysis_cache.py tests/test_projects_science.py
          tests/test_research_assets.py tests/test_api_security.py tests/test_workflows.py
          tests/test_regions.py tests/test_pose_exploration_api.py
      - name: Verify changed example controls and questionnaire consumers
        working-directory: frontend
        run: >-
          npx vitest run
          src/App.test.tsx src/guided/Questionnaire.test.tsx
          src/poses/PoseForm.test.tsx src/poses/PoseWorkspace.test.tsx
          src/viewer/StructureViewer.test.tsx src/viewer/atom-region.test.ts
          src/examples/ExampleActions.test.tsx src/examples/harness.test.ts src/examples/guide.test.ts src/diffsbdd/ReferencePicker.test.tsx
          src/TaskForm.test.tsx src/diffsbdd/DesignOptions.test.tsx
          src/diffsbdd/DiffForm.test.tsx src/docking/DockingForm.test.tsx
          src/pockets/PocketForm.test.tsx src/receptors/StructurePrepareForm.test.tsx
          src/receptors/SurfaceForm.test.tsx
          src/receptors/ReceptorForm.test.tsx src/chemistry/StateForm.test.tsx
          src/antibodies/AntibodyNumberForm.test.tsx src/admet/AdmetForm.test.tsx
          src/humanization/HumanizationForm.test.tsx src/quality/tests/QualityForm.test.tsx
          src/operations/CampaignForm.test.tsx src/operations/PropertyForm.test.tsx
          src/operations/ToolQuestionnaires.test.tsx src/operations/operations.test.tsx
          src/discovery/TargetResearchForm.test.tsx src/discovery/ReferenceImportForm.test.tsx
          src/regions/RegionWorkspace.test.tsx
          src/workflows/WorkflowCenter.test.tsx src/workflows/model.test.ts
