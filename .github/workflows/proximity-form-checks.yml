name: Ternary form resource budget checks
on:
  workflow_dispatch:
  push:
    paths: &form_paths
      - 'frontend/src/proximity/Form*'
      - 'server_tests/test_ternary_job_review_browser.py'
      - 'frontend/src/proximity/PartnerQuestion*'
      - 'frontend/src/proximity/Plan.tsx'
      - 'frontend/src/proximity/ExecutionSettings.tsx'
      - 'frontend/src/proximity/execution.ts'
      - '.github/workflows/proximity-form-checks.yml'
  pull_request:
    paths: *form_paths
permissions:
  contents: read
jobs:
  form:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Bilingual resource choices, verified fragment mapping and exact submitted request
        working-directory: frontend
        run: >-
          npx vitest run src/proximity/Form.test.tsx
          src/proximity/PartnerQuestion.test.tsx
          src/diffsbdd/ReferencePicker.test.tsx
          src/diffsbdd/ReferencePickerLifecycle.test.tsx
      - name: Existing backend budget and chemical-input contract
        run: |
          uv sync --locked --group dev --group browser
          uv run --locked pytest -q tests/test_proximity_contract.py
      - name: Bilingual STAT6 and public ternary-source review without inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download proximity-inputs-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern x-dde-glue-inputs-v1.zip --dir "$RUNNER_TEMP"
          gh release download v0.4.37 --repo "$GITHUB_REPOSITORY" \
            --pattern '5T35-native-*' --dir "$RUNNER_TEMP"
          uv run --locked ruff check server_tests/test_ternary_job_review_browser.py
          uv run --locked playwright install chromium --with-deps
          export WB_TERNARY_VISUAL_STATE="$RUNNER_TEMP/x-dde-ternary-review-tools/state"
          WB_HOME="$RUNNER_TEMP/x-dde-ternary-review-tools" WB_STATE_DIR="$WB_TERNARY_VISUAL_STATE" \
            uv run --locked python server_tests/prepare_visual_components.py --components ketcher
          uv run --locked python -m pytest -q server_tests/test_ternary_job_review_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ternary-job-review-visuals
          path: outputs/ternary-job-review
      - name: Preserve this exact built frontend for isolated browser acceptance
        uses: actions/upload-artifact@v4
        with:
          name: verified-ternary-input-frontend-${{ github.sha }}
          path: src/opendde_workbench/web
          retention-days: 7
