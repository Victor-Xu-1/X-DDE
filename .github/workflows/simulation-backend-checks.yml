name: Simulation backend integration
on:
  workflow_call:
    inputs:
      check:
        type: string
        default: contracts
  workflow_dispatch:
    inputs:
      check:
        type: choice
        default: contracts
        options: [contracts, locks, runtime]
        description: Contracts or environment verification; never starts scientific calculations
  push:
    paths:
      - "src/opendde_workbench/simulations/native_gromacs*"
      - "src/opendde_workbench/simulations/native_md_outputs.py"
      - "src/opendde_workbench/research/initial_pose.py"
      - "src/opendde_workbench/integrations/recipes/gromacs*"
      - "tests/test_gromacs_integration.py"
      - "frontend/src/studio/MethodSwitch.test.tsx"
      - "frontend/src/examples/guide-data.json"
      - "server_tests/check_simulation_environment.py"
      # Questionnaire-only browser assertions use simulation-questionnaire-checks.yml.
      - ".github/workflows/simulation-backend-checks.yml"
permissions:
  contents: read
jobs:
  locks:
    if: github.event_name == 'workflow_dispatch' && inputs.check == 'locks'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/resolve-openfe-lock.py --program gromacs
      - uses: actions/upload-artifact@v4
        with:
          name: gromacs-reviewed-lock
          path: src/opendde_workbench/integrations/recipes/gromacs*.conda.txt
  runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.check == 'runtime'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev
      - name: Build the exact locked environment and negotiate real native interfaces only
        run: uv run --locked python server_tests/check_simulation_environment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gromacs-environment-evidence
          path: |
            outputs/simulation-environment/build.log
            outputs/simulation-environment/interface-*.txt
            outputs/simulation-environment/scope.json
            outputs/simulation-environment/image-context/Dockerfile
  contracts:
    if: github.event_name != 'workflow_dispatch' || inputs.check == 'contracts'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: uv sync --locked --group dev --group browser
      - name: Simulation contracts and the directly affected shared registries
        run: |
          .venv/bin/python scripts/generate-capability-catalog.py --check
          .venv/bin/python -m pytest -q tests/test_gromacs_integration.py tests/test_simulations.py tests/test_method_choices.py tests/test_engine_registry.py
          .venv/bin/python -m pytest -q tests/test_examples.py tests/test_example_pins.py -k 'source_backed_complex_case or future_default_fields'
      - name: Backend switch, questionnaire, original results and download links
        working-directory: frontend
        run: >-
          npx vitest run src/simulations/SimulationForm.test.tsx src/simulations/SimulationResults.test.tsx
          src/simulations/SimulationFiles.test.tsx src/studio/MethodSwitch.test.tsx
          src/studio/research-modules.test.ts src/deployment/component-groups.test.ts
          src/examples/guide.test.ts
      - run: .venv/bin/python -m playwright install chromium --with-deps
      - name: Actual bilingual GROMACS choice through review; never submits a calculation
        run: .venv/bin/python -m pytest -q server_tests/test_gromacs_switch_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gromacs-switch-evidence
          path: outputs/gromacs-switch/**
